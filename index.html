<!-- 重型读书库改为按需懒加载（开机不再阻塞首屏） -->
<script>
function loadEpubCDN(){
  if(typeof ePub!=='undefined')return;
  var SRC=['https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js','https://unpkg.com/epubjs@0.3.93/dist/epub.min.js','https://cdn.bootcdn.net/ajax/libs/epub.js/0.3.93/epub.min.js','https://lib.baomitu.com/epub.js/0.3.93/epub.min.js','https://cdn.staticfile.org/epub.js/0.3.93/epub.min.js'];
  var i=0;
  (function next(){ if(typeof ePub!=='undefined')return; if(i>=SRC.length){console.warn('epub.js 全部源加载失败');return;} var s=document.createElement('script'); s.src=SRC[i++]; s.onload=function(){ if(typeof ePub==='undefined')next(); }; s.onerror=next; document.head.appendChild(s); })();
}
var _libCache={};
function ensureLib(name){
  return new Promise(function(res,rej){
    if(name==='pdf'&&typeof pdfjsLib!=='undefined'){res();return;}
    if(name==='epub'&&typeof ePub!=='undefined'){res();return;}
    if(_libCache[name]){_libCache[name].then(res,rej);return;}
    var src=name==='pdf'?'pdf.min.js':name==='epub'?'epub.min.js':name;
    var p=new Promise(function(r2,j2){
      var s=document.createElement('script'); s.src=src;
      s.onload=function(){
        if(name==='pdf'&&window.pdfjsLib){ try{pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';}catch(e){} r2(); }
        else if(name==='epub'&&window.ePub){ r2(); }
        else { j2(new Error('lib '+name+' loaded but global missing')); }
      };
      s.onerror=function(){
        if(name==='epub'){
          loadEpubCDN();
          var t=0; var iv=setInterval(function(){ if(typeof ePub!=='undefined'){clearInterval(iv);r2();} else if(++t>40){clearInterval(iv);j2(new Error('epub cdn failed'));} },200);
        } else { j2(new Error('lib '+name+' load failed')); }
      };
      document.head.appendChild(s);
    });
    _libCache[name]=p; p.then(res,rej);
  });
}
</script>
<link rel="stylesheet" href="fonts.css">
<style>
/* ============ 像素基础变量 ============ */
:root{
  --px:"Press Start 2P","DotGothic16",monospace;
  --cn:"DotGothic16",monospace;
  /* 默认主题：暖阳小屋（暖黄+奶白） */
  --bg1:#fff8e7; --bg2:#ffe6b8;
  --panel:#fffdf6; --panel2:#fff0cc;
  --ink:#5a3e1b; --ink-dim:#9b7a4a;
  --line:#d9a441; --line2:#e8c074;
  --accent:#e8833a; --accent2:#c0563b;
  --hp:#e0563b; --mp:#3a8fc4; --xp:#7bb661; --gold:#e8a317;
  --good:#5fae5f; --bad:#e0563b; --warn:#e8a317;
  --cat:#ffd9a0;
  --input-bg:#fffdf6;
  --shadow: 0 0 0 3px var(--line), 0 0 0 6px #000, 4px 4px 0 6px rgba(0,0,0,.18);
}
[data-theme="暖阳小屋"]{ } /* 同 :root，显式占位 */
[data-theme="晴空"]{
  --bg1:#eaf4fb; --bg2:#cfe7f7;
  --panel:#ffffff; --panel2:#e8f3fc;
  --ink:#1f3a52; --ink-dim:#5a7891;
  --line:#6aa8d8; --line2:#9cc8e8;
  --accent:#2f80c4; --accent2:#56b4d3;
  --hp:#e0563b; --mp:#2f80c4; --xp:#7bb661; --gold:#e8a317;
  --good:#3a9d6e; --bad:#e0563b; --warn:#e8a317;
  --cat:#cfe7f7;
  --input-bg:#ffffff;
}
[data-theme="糖果工厂"]{
  --bg1:#fff0f6; --bg2:#ffe0ef; --panel:#ffffff; --panel2:#ffeaf4;
  --ink:#5b2a4a; --ink-dim:#9b6a86; --line:#ff8fc0; --line2:#ffb3d9;
  --accent:#ff5da2; --accent2:#9d4edd; --hp:#ff477e; --mp:#48bfe3;
  --xp:#80ed99; --gold:#ffb703; --good:#3aa17e; --bad:#e63946; --warn:#f4a261; --cat:#ffc8dd;
  --input-bg:#fff7fb;
}
[data-theme="暗夜森林"]{
  --bg1:#0d2818; --bg2:#143d2b; --panel:#1c3a2a; --panel2:#234d38;
  --ink:#e8f5d8; --ink-dim:#9bc4a0; --line:#4a7c59; --line2:#6fae7f;
  --accent:#f2c14e; --accent2:#5bc0be; --hp:#e76f51; --mp:#5bc0be;
  --xp:#b5e48c; --gold:#f2c14e; --good:#88c293; --bad:#e76f51; --warn:#f4a261; --cat:#d8f3a0;
  --input-bg:#102218;
}
[data-theme="复古终端"]{
  --bg1:#1b1b2f; --bg2:#16213e;
  --panel:#26244a; --panel2:#33305f;
  --ink:#f3e9d2; --ink-dim:#b9b0a0;
  --line:#6d5b8c; --line2:#8a6fb0;
  --accent:#ffb347; --accent2:#ff6b9d;
  --hp:#e94560; --mp:#4cc9f0; --xp:#a3e635; --gold:#ffd166;
  --good:#7bd389; --bad:#ff5d5d; --warn:#ffd166;
  --cat:#ffd9a0;
  --input-bg:#0e0e1e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--cn);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 2px, transparent 2px 4px),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--ink);
  min-height:100vh;
  image-rendering:pixelated;
  -webkit-font-smoothing:none;
}
/* 像素扫描线 */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.22}
button{font-family:var(--cn);cursor:pointer;color:var(--ink)}
input,select,textarea{font-family:var(--cn)}
::selection{background:var(--accent);color:#000}

/* ============ 通用像素组件 ============ */
.px{font-family:var(--px);letter-spacing:.5px}
.pixel-border{border:3px solid var(--line);box-shadow:0 0 0 3px #000, 0 0 0 6px var(--line2);image-rendering:pixelated}
.panel,.tile{background:var(--panel);border:3px solid #000;outline:3px solid var(--line);outline-offset:0;box-shadow:6px 6px 0 rgba(0,0,0,.4);padding:14px;border-radius:2px}
.panel-soft{background:var(--panel2);border:2px solid var(--line);border-radius:2px;padding:10px}
.pxbtn{background:var(--panel2);border:2px solid #000;outline:2px solid var(--line);color:var(--ink);padding:8px 12px;font-size:13px;border-radius:2px;box-shadow:3px 3px 0 rgba(0,0,0,.4);transition:transform .05s}
.pxbtn:hover{filter:brightness(1.15)}
.pxbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.4)}
.pxbtn.primary{background:var(--accent);color:#1a1020}
.pxbtn.danger{background:var(--hp);color:#fff}
.pxbtn.small{padding:4px 8px;font-size:11px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);padding:2px 6px;font-size:11px;border-radius:2px;margin:2px}
.tag.p0{background:#555;color:#ddd}
.tag.p1{background:var(--mp);color:#021}
.tag.p2{background:var(--hp);color:#fff}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:3px 8px;font-size:12px;border-radius:20px}
.chip.on{background:var(--accent);color:#1a1020;border-color:var(--accent)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--input-bg);color:var(--ink);border:2px solid var(--line);padding:6px 8px;border-radius:2px;outline:none;font-size:13px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.bar{height:14px;background:rgba(0,0,0,.28);border:2px solid var(--line);border-radius:2px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),var(--good));transition:width .4s}
.bar.hp>i{background:linear-gradient(90deg,var(--hp),#ff8a8a)}
.bar.mp>i{background:linear-gradient(90deg,var(--mp),#8de4ff)}
.bar.gold>i{background:linear-gradient(90deg,var(--gold),#ffe08a)}

/* ============ 布局 ============ */
.wrap{max-width:1180px;margin:0 auto;padding:12px}
header.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-family:var(--px);font-size:15px;color:var(--accent);text-shadow:3px 3px 0 #000;white-space:nowrap}
.logo small{display:block;font-family:var(--cn);font-size:11px;color:var(--ink-dim);text-shadow:none;margin-top:4px}
.topstat{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.stat{background:var(--panel);border:2px solid #000;outline:2px solid var(--line);padding:5px 9px;font-size:12px;border-radius:2px;display:flex;gap:6px;align-items:center}
.stat b{color:var(--gold);font-family:var(--px);font-size:11px}

/* 导航 */
nav.mods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);border:2px solid #000;outline:2px solid var(--line);padding:8px 10px;border-radius:2px;min-width:74px;transition:transform .08s,filter .1s;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.modbtn:hover{filter:brightness(1.2)}
.modbtn.active{outline-color:var(--accent);background:var(--panel2);transform:translateY(-2px)}
.modbtn .ico{font-size:22px;line-height:1;filter:drop-shadow(2px 2px 0 #000)}
.modbtn .lbl{font-size:11px;color:var(--ink-dim)}
.modbtn.active .lbl{color:var(--accent)}
/* 「更多」折叠区：常显主城/账房，其余标签收到这里 */
.modbtn.more{outline-style:dashed;background:var(--panel2)}
.modbtn.more .ico{filter:none}
.mod-more{flex-basis:100%;width:100%;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;padding-top:8px;border-top:2px dashed var(--line)}

/* 主区 */
main{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
@media(max-width:920px){main{grid-template-columns:1fr}}
.section{display:none}
.section.active{display:block;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
h2.title{font-family:var(--px);font-size:13px;margin:0 0 12px;color:var(--accent);text-shadow:2px 2px 0 #000}
h3.sub{font-size:14px;margin:14px 0 8px;color:var(--ink);border-left:4px solid var(--accent);padding-left:8px}
a.jump{float:right;font-size:11px;line-height:1.5;border:2px solid var(--accent);color:var(--accent);padding:1px 7px;border-radius:2px;cursor:pointer;margin-left:8px;white-space:nowrap;font-weight:bold;font-family:var(--px)}
a.jump:hover{background:var(--accent);color:#fff}
.panel .jumprow{display:inline-block;cursor:pointer;padding:1px 4px;border-radius:2px}
.panel .jumprow:hover{background:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:720px){
  .grid2,.grid3{grid-template-columns:1fr}
  .wrap{padding:8px}
  .panel,.tile,.fold{padding:10px;border-width:2px;outline-width:2px;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
  .grid2>.fold,.grid3>.fold{margin-bottom:0}
  .fold-h{padding:9px 10px;font-size:13px}
  .fold-b{padding:10px}
  .pxbtn{padding:6px 10px;font-size:12px}
  .pxbtn.small{padding:3px 6px;font-size:10px}
  h2.title{font-size:12px;margin-bottom:8px}
  h3.sub{font-size:13px;margin:10px 0 6px}
  .modbtn{min-width:58px;padding:6px 7px}
  .modbtn .ico{font-size:18px}
  .modbtn .lbl{font-size:10px}
  .water-cup{font-size:18px}
  .health-tile{padding:8px}
  .health-tile .big{font-size:20px}
  .word-card{min-height:84px;padding:8px}
  .lesson-box{padding:8px}
  .meal-box{padding:6px}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{padding:5px 6px;font-size:13px}
  input[type=time]{height:34px;max-height:34px}
}
@media(max-width:520px){
  .water-cup{font-size:16px}
  .modbtn{min-width:50px;padding:5px 5px}
  .modbtn .ico{font-size:16px}
  .panel,.tile,.fold{padding:8px}
  .fold-b{padding:8px}
  h3.sub{font-size:12px}
}

/* 右栏小猫 */
aside.right{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.cat-stage{position:relative;background:linear-gradient(180deg,#2a2a55,#1a1a35);border:3px solid #000;outline:3px solid var(--line);border-radius:2px;overflow:hidden;min-height:230px;text-align:center}
[data-theme="暖阳小屋"] .cat-stage{background:linear-gradient(180deg,#fff3d6,#ffd98a)}
[data-theme="晴空"] .cat-stage{background:linear-gradient(180deg,#dceffb,#b6ddf5)}
[data-theme="糖果工厂"] .cat-stage{background:linear-gradient(180deg,#ffd6ec,#ff9ec4)}
[data-theme="暗夜森林"] .cat-stage{background:linear-gradient(180deg,#1c3a2a,#0d2818)}
.cat-stage .sky{position:absolute;inset:0;background:radial-gradient(circle at 20% 20%, rgba(255,255,255,.15), transparent 40%);pointer-events:none}
/* 小猫互动特效 */
.cat-fx{position:absolute;left:50%;top:50px;transform:translateX(-50%);font-size:44px;z-index:6;pointer-events:none;opacity:0;filter:drop-shadow(2px 2px 0 #000)}
.cat-fx.pet{animation:fxPet 1.5s ease forwards}
.cat-fx.feed{animation:fxFed 1.5s ease forwards}
.cat-fx.play{animation:fxPlay 1.5s ease forwards}
@keyframes fxPet{0%{opacity:0;transform:translate(-50%,-40px) rotate(-30deg) scale(.5)}25%{opacity:1;transform:translate(-50%,0) rotate(15deg) scale(1.1)}50%{opacity:1;transform:translate(-50%,0) rotate(-12deg) scale(1.1)}75%{opacity:1;transform:translate(-50%,0) rotate(8deg) scale(1.1)}100%{opacity:0;transform:translate(-50%,30px) scale(.8)}}
@keyframes fxFed{0%{opacity:0;transform:translate(-50%,-50px) scale(.4)}35%{opacity:1;transform:translate(-50%,10px) scale(1.3)}65%{opacity:1;transform:translate(-50%,25px) scale(1)}100%{opacity:0;transform:translate(-50%,55px) scale(.7)}}
@keyframes fxPlay{0%{opacity:0;transform:translate(-50%,-10px) scale(.5) rotate(0)}30%{opacity:1;transform:translate(-50%,-30px) scale(1.2) rotate(200deg)}60%{opacity:1;transform:translate(-50%,15px) scale(1) rotate(400deg)}100%{opacity:0;transform:translate(-50%,45px) scale(.7) rotate(560deg)}}
#catSprite{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:96px;height:96px;cursor:pointer;transition:transform .15s;animation:bob 2.2s ease-in-out infinite}
#catSprite:hover{transform:translateX(-50%) scale(1.08)}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.cat-bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid #000;outline:2px solid var(--line);padding:6px 10px;font-size:12px;border-radius:8px;max-width:230px;z-index:5;display:none}
.cat-bubble::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--panel)}
.cat-meta{display:flex;justify-content:space-around;font-size:11px;padding:8px;background:var(--panel);border-top:2px solid #000}
.cat-meta div{text-align:center}
.cat-meta b{display:block;font-family:var(--px);font-size:11px;color:var(--accent)}
.interact{display:flex;gap:6px;justify-content:center;padding:8px;background:var(--panel);border-top:2px solid #000}
.interact .pxbtn{flex:1;font-size:11px;padding:6px}
.cat-poops{position:absolute;bottom:96px;left:8px;right:8px;display:flex;gap:3px;flex-wrap:wrap;z-index:3;justify-content:center}
.cat-poops .poop{font-size:18px;cursor:pointer;filter:drop-shadow(0 1px 0 #000)}
.cat-poops .poop:hover{transform:scale(1.2)}
.cat-sick{position:absolute;top:6px;right:8px;font-size:20px;z-index:4}

/* 小猫像素图(纯CSS box-shadow像素画)通过SVG实现 */
.firefly{position:fixed;width:8px;height:8px;background:var(--gold);box-shadow:0 0 6px var(--gold);z-index:50;pointer-events:auto;cursor:pointer;animation:fly 7s linear infinite}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(40px,-30px)}50%{transform:translate(-20px,-60px)}75%{transform:translate(30px,-90px)}100%{transform:translate(0,-120px);opacity:0}}

/* ============ 日历 ============ */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head button{background:var(--panel2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:11px;text-align:center;color:var(--ink-dim);padding:4px 0;font-family:var(--px);font-size:9px}
.cal-cell{aspect-ratio:1;background:var(--panel2);border:2px solid #000;border-radius:2px;padding:3px;font-size:11px;cursor:pointer;position:relative;transition:filter .1s;min-height:42px}
.cal-cell:hover{filter:brightness(1.25)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default}
.cal-cell.today{outline:2px solid var(--accent)}
.cal-cell .d{font-family:var(--px);font-size:9px;color:var(--ink-dim)}
.cal-cell .mood{font-size:16px;position:absolute;right:2px;bottom:0}
.cal-cell .dot{position:absolute;top:2px;right:2px;width:6px;height:6px;background:var(--accent);border-radius:50%}
.cal-cell .period{position:absolute;top:2px;left:2px;width:6px;height:6px;background:var(--hp);border-radius:50%}
.mood-picker{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.mood-picker span{font-size:22px;cursor:pointer;padding:2px;border:2px solid transparent;border-radius:4px}
.mood-picker span:hover{border-color:var(--accent)}

/* ============ 任务/待办 ============ */
.todo-row{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:2px solid #000;padding:8px;border-radius:2px;margin-bottom:6px}
.todo-row.done{opacity:.5;text-decoration:line-through}
.todo-row .cb{width:22px;height:22px;flex:none;border:2px solid var(--line);background:#000;border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.todo-row .cb.on{background:var(--good);color:#000}
.todo-row .body{flex:1;min-width:0}
.todo-row .ttl{font-size:13px;word-break:break-all}
.todo-row .meta{font-size:10px;color:var(--ink-dim);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.todo-row .del{background:transparent;border:none;color:var(--bad);font-size:16px;cursor:pointer}
.todo-row .del-big{background:var(--bad);color:#fff;border:2px solid #000;width:36px;height:36px;font-size:22px;cursor:pointer;border-radius:2px;flex:none;margin-left:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:2px 2px 0 rgba(0,0,0,.35);text-shadow:1px 1px 0 #000}
.todo-row .del-big:hover{filter:brightness(1.15)}
.todo-row .del-big:active{transform:translate(2px,2px);box-shadow:0 0 0 rgba(0,0,0,.35)}
.subtask{font-size:11px;color:var(--ink-dim);margin-top:4px;padding-left:8px;border-left:2px solid var(--line)}
.subtask div{margin:2px 0}
/* 任务折叠 */
.task-group{margin-bottom:8px;border:2px solid var(--line);border-radius:4px;overflow:hidden}
.task-group-head{cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--panel2);font-size:12px;user-select:none;transition:background .12s}
.task-group-head:hover{background:var(--accent);color:#1a1020}
.task-group-head .fold-arrow{font-size:9px;width:14px;text-align:center}
.task-group-body{padding:4px 0}
.task-group-body .todo-row{margin-bottom:4px}
/* AI 阅读弹窗 */
.ai-popup{position:fixed;z-index:9999;background:var(--panel);border:2px solid var(--accent);border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.3);display:none;padding:4px}
.ai-popup .ai-acts{display:flex;gap:4px;flex-wrap:wrap}
.ai-popup button{font-size:10px;padding:4px 8px;border:1px solid var(--line);background:var(--input-bg);border-radius:3px;cursor:pointer;white-space:nowrap}
.ai-popup button:hover{background:var(--accent);color:#1a1020}
.ai-result{position:fixed;z-index:9998;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:2px solid var(--accent);border-radius:8px;max-width:520px;width:90%;max-height:70vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,.4);display:none;padding:16px}
.ai-load{text-align:center;padding:20px;color:var(--accent)}
.ai-body{font-size:13px;line-height:1.7}
.ai-chat-box{max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;padding:8px;background:var(--input-bg)}
.ai-msg{margin-bottom:8px;padding:6px 8px;border-radius:4px;max-width:90%}
.ai-msg.user{background:var(--accent);color:#1a1020;margin-left:auto;text-align:right}
.ai-msg.bot{background:var(--panel2);margin-right:auto}
.ai-msg-head{font-size:10px;opacity:.7;margin-bottom:2px}
.ai-msg-body{font-size:13px;line-height:1.6;word-break:break-word}
.ai-split-step{padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.5}
.ai-split-step:last-child{border-bottom:none}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* 四象限 */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbox{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:8px;min-height:120px}
.qbox.q1{border-color:var(--hp)} .qbox.q2{border-color:var(--accent)} .qbox.q3{border-color:var(--warn)} .qbox.q4{border-color:var(--mp)}
.qbox h4{margin:0 0 6px;font-size:12px;font-family:var(--px);font-size:9px}
.qitem{background:var(--panel);border:1px solid var(--line);padding:4px 6px;font-size:11px;margin-bottom:4px;cursor:grab;border-radius:2px}
.qitem.dragging{opacity:.4}
.qbox.drag-over{outline:2px dashed var(--accent)}

/* 习惯 */
.habit-card{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:8px;margin-bottom:6px}
.habit-card .top{display:flex;justify-content:space-between;align-items:center}
.habit-card .streak{font-family:var(--px);font-size:10px;color:var(--accent)}

/* ============ 财务 ============ */
.fin-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.fin-card{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:8px;text-align:center}
.fin-card .lbl{font-size:11px;color:var(--ink-dim)}
.fin-card .val{font-family:var(--px);font-size:13px;color:var(--gold);margin-top:4px;word-break:break-all}
.fin-card.neg .val{color:var(--bad)}
.pie{width:120px;height:120px;border-radius:50%;border:3px solid #000;image-rendering:pixelated}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:90px;padding:6px;background:var(--input-bg);border:2px solid var(--line);border-radius:2px}
.bar-chart .b{flex:1;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px;border:1px solid #000;position:relative}
.bar-chart .b span{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--ink-dim)}
.ledger-row{display:flex;gap:6px;font-size:12px;padding:5px 6px;border-bottom:1px dashed var(--line);align-items:center}
.ledger-row.in{color:var(--good)} .ledger-row.out{color:var(--bad)}
.fin-cat-grid{display:flex;gap:6px;flex-wrap:wrap}
.fin-cat-chip{display:inline-flex;align-items:center;gap:3px;background:var(--panel);border:2px solid var(--line);padding:4px 8px;font-size:11px;border-radius:20px;cursor:pointer;transition:transform .05s}
.fin-cat-chip:hover{filter:brightness(1.1)}
.fin-cat-chip.on{background:var(--accent);color:#1a1020;border-color:var(--accent)}
.treasure{position:relative;height:40px;background:rgba(0,0,0,.28);border:2px solid var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.treasure>i{position:absolute;left:0;bottom:0;height:100%;background:linear-gradient(0deg,var(--gold),#ffe08a);transition:width .5s}
.treasure span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2}
.wish-card{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:8px;margin-bottom:6px}
.fut-collapsed .fut-collapsed-body{display:none;margin-top:4px}
.fut-collapsed.open .fut-collapsed-body{display:block}
.fut-collapsed .fut-collapsed-body ~ *{}
.fut-collapsed > div > span:last-child{transition:transform .15s}
.fut-collapsed.open > div > span:last-child{transform:rotate(90deg);display:inline-block}

/* ============ 未来·直观清单 ============ */
.visual-card{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:10px;margin-bottom:8px;cursor:pointer;transition:transform .08s}
.visual-card:active{transform:scale(.99)}
.visual-card .vhead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.visual-card .vtitle{flex:1;font-size:14px;font-weight:bold}
.visual-card .vpercent{font-size:13px;color:var(--ink-dim);white-space:nowrap}
.visual-card .vbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.visual-card .vbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.visual-items{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.visual-item{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:3px;font-size:13px;border:2px solid #000;cursor:pointer;user-select:none}
.visual-item.done{opacity:.55;text-decoration:line-through}
.visual-item .chk{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;border:2px solid currentColor;border-radius:2px}
.visual-add{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:3px;font-size:13px;border:2px dashed var(--line);color:var(--ink-dim);cursor:pointer;background:transparent}

/* ============ 学习/英语 ============ */
.word-card{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:12px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;perspective:600px}
.word{font-family:var(--px);font-size:16px;color:var(--accent);text-shadow:2px 2px 0 #000}
.phonetic{font-size:12px;color:var(--ink-dim);margin-top:6px}
.meaning{font-size:13px;margin-top:8px}
.lesson-box{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:10px;margin-bottom:8px}
.choice{display:block;background:var(--panel);border:2px solid var(--line);padding:6px 8px;margin:4px 0;cursor:pointer;border-radius:2px;font-size:13px}
.choice:hover{border-color:var(--accent)}
.choice.correct{background:var(--good);color:#000}
.choice.wrong{background:var(--bad);color:#fff}
.exam-tab{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.exam-tab .chip{cursor:pointer}
.exam-tab .chip.on{background:var(--accent);color:#1a1020;border-color:var(--accent)}
.path-line{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.path-node{background:var(--panel2);border:2px solid var(--line);padding:4px 10px;border-radius:20px;font-size:12px}
.path-node.on{background:var(--accent);color:#1a1020;border-color:var(--accent)}
.path-arrow{color:var(--ink-dim)}

/* ============ 健康 ============ */
.health-tile{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:10px;text-align:center}
.health-tile .big{font-size:26px}
.water-cup{font-size:24px;cursor:pointer;filter:grayscale(1);transition:filter .1s}
.water-cup.full{filter:none}
.meal-box{background:var(--panel);border:2px solid var(--line);padding:8px;border-radius:2px;margin-top:6px}

/* ============ 绘画 ============ */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.art-frame{background:var(--panel2);border:3px solid var(--gold);box-shadow:0 0 0 2px #000;border-radius:2px;padding:6px;text-align:center}
.art-frame .ph{height:70px;background:#000;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;border-radius:2px}
.milestone{display:flex;gap:4px;flex-wrap:wrap}
.ms-node{flex:1;min-width:90px;background:var(--panel2);border:2px solid var(--line);padding:6px;border-radius:2px;text-align:center;font-size:11px}
.ms-node.on{border-color:var(--accent);background:var(--panel)}
.ms-node.done{background:var(--good);color:#000}

/* ============ 心理/灵感 ============ */
.tip-card{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:12px;position:relative}
.tip-card::before{content:"";position:absolute;left:-2px;top:-2px;width:14px;height:14px;background:var(--accent2);border:2px solid #000}
.psych-q{font-size:12px;color:var(--accent);margin-top:8px;font-style:italic}
.insp-card{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:8px;margin-bottom:6px}
.dice{font-size:40px;cursor:pointer;display:inline-block;animation:none}
.dice.roll{animation:spin .6s ease}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

/* ============ 日报 ============ */
.report-line{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.report-line b{color:var(--gold)}
.advice{background:var(--panel);border-left:4px solid var(--accent);padding:8px;margin:4px 0;font-size:13px}

/* ============ 番茄钟 ============ */
.pomo{display:flex;flex-direction:column;align-items:center;gap:8px}
.pomo-ring{width:120px;height:120px;border-radius:50%;border:6px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--px);font-size:20px;color:var(--accent);position:relative;background:var(--panel2)}
.pomo-ring.run{border-color:var(--hp);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.4)}50%{box-shadow:0 0 0 10px rgba(233,69,96,0)}}

/* ============ 成就 ============ */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.badge{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:8px;text-align:center;font-size:11px}
.badge.unlocked{border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.badge.locked{opacity:.35;filter:grayscale(1)}
.badge .em{font-size:26px;display:block}

/* 开关 */
.switch{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.switch input{width:auto}
.toggle{width:42px;height:22px;background:#000;border:2px solid var(--line);border-radius:20px;position:relative;cursor:pointer;display:inline-block;vertical-align:middle}
.toggle::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;background:var(--ink);border-radius:50%;transition:.15s}
.toggle.on{background:var(--good)}
.toggle.on::after{left:21px;background:#000}

/* 模态 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:3px solid #000;outline:3px solid var(--line);max-width:480px;width:100%;padding:16px;border-radius:2px;max-height:85vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid #000;outline:2px solid var(--accent);padding:10px 16px;border-radius:2px;z-index:300;font-size:13px;animation:toastin .2s;max-width:90vw}
@keyframes toastin{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.hidden{display:none!important}
.muted{color:var(--ink-dim);font-size:11px}
.scroll{max-height:340px;overflow:auto;padding-right:4px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
hr.pxhr{border:none;border-top:2px dashed var(--line);margin:12px 0}
.catEvolve{animation:evolve 1.2s ease}
@keyframes evolve{0%{transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(.3);filter:brightness(3)}60%{transform:translateX(-50%) scale(1.4) rotate(10deg);filter:hue-rotate(180deg)}100%{transform:translateX(-50%) scale(1)}}
.boot-loader{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg2);gap:14px}
.boot-loader .px{width:36px;height:36px;background:var(--accent);image-rendering:pixelated;animation:bootpulse 1s steps(2) infinite}
@keyframes bootpulse{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.3) rotate(45deg)}100%{transform:scale(1) rotate(90deg)}}
.boot-loader .t{font-family:var(--cn);font-size:13px;color:var(--ink-dim)}
/* 日志模块 */
.diary-write{background:var(--panel2);border:2px solid #000;outline:2px solid var(--line);border-radius:2px;padding:12px;margin-bottom:10px}
.diary-write textarea{min-height:120px;resize:vertical}
.diary-prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:10px}
.diary-prev-item{position:relative;width:84px;height:84px;border:2px solid #000;border-radius:2px;overflow:hidden;background:#000}
.diary-prev-item img{width:100%;height:100%;object-fit:cover;display:block}
.diary-prev-item .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:1px solid #fff;width:22px;height:22px;font-size:13px;cursor:pointer;border-radius:50%;padding:0;line-height:1}
.diary-card{background:var(--panel);border:2px solid #000;border-radius:2px;padding:10px;margin-bottom:10px;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.diary-card-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.diary-card-title{font-size:14px;color:var(--accent);flex:1;word-break:break-all}
.diary-card-meta{font-size:11px;color:var(--ink-dim);text-align:right;white-space:nowrap}
.diary-card-actions{display:flex;gap:4px;flex:none}
.diary-card-body{display:none;margin-top:8px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.diary-card.open .diary-card-body{display:block}
.diary-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.diary-imgs img{width:92px;height:92px;object-fit:cover;border:2px solid #000;border-radius:2px;cursor:pointer;background:#000}
.diary-img-view{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.diary-img-view.show{display:flex}
.diary-img-view img{max-width:95vw;max-height:95vh;border:3px solid #fff;border-radius:2px}
.diary-img-view span{position:absolute;top:10px;right:14px;color:#fff;font-size:30px;cursor:pointer}
/* 日志扩展 */
.add-panel{display:none;margin-top:8px;flex-wrap:wrap;gap:6px}.add-panel.show{display:flex}
.add-opt{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:2px solid #000;border-radius:2px;padding:8px 10px;cursor:pointer;font-size:11px;color:var(--ink);min-width:74px}
.add-opt:hover{filter:brightness(1.1)}.add-opt span{font-size:22px}
.doodle-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:400;display:none;align-items:center;justify-content:center;padding:10px}
.doodle-bg.show{display:flex}
.doodle-box{background:var(--panel);border:3px solid #000;outline:3px solid var(--line);padding:10px;border-radius:2px;max-width:96vw}
.doodle-toolbar{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.doodle-toolbar input[type=color]{width:32px;height:28px;padding:0;border:2px solid #000}
.doodle-canvas{border:2px solid #000;background:#fff;display:block;touch-action:none;cursor:crosshair}
.diary-table{border-collapse:collapse;margin:8px 0;width:100%}
.diary-table td{border:2px solid var(--line);padding:6px 8px;background:var(--panel);min-width:60px;color:var(--ink)}
.attachment-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.attachment-chip{display:inline-flex;gap:4px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:3px 8px;font-size:11px;margin:2px;border-radius:2px}
.attachment-chip .x{cursor:pointer;color:var(--bad);font-weight:bold;margin-left:2px}
.diary-card .attachments{margin-top:6px}
/* 读书器 */
.read-stage{background:var(--panel);border:2px solid #000;border-radius:2px;padding:10px;margin-bottom:10px}
.book-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.book-card{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:10px;text-align:center;cursor:pointer;transition:transform .1s}
.book-card:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.book-card .em{font-size:38px}
.book-card .nm{font-size:12px;margin-top:6px;word-break:break-all;color:var(--ink)}
.book-card .meta{font-size:10px;color:var(--ink-dim);margin-top:4px}
.book-card .prog{height:4px;background:rgba(0,0,0,.2);border-radius:2px;margin-top:6px;overflow:hidden}
.book-card .prog>i{display:block;height:100%;background:var(--xp)}
.read-area{background:var(--input-bg);border:2px solid #000;border-radius:2px;padding:18px;min-height:420px;font-size:16px;line-height:1.9;color:var(--ink);overflow:auto;max-height:65vh}
.read-area.pdf-view{display:flex;justify-content:center;background:#222}
.read-area canvas{max-width:100%;height:auto;box-shadow:0 0 8px rgba(0,0,0,.4)}
.read-bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.read-bar .grow{flex:1;min-width:120px}
.book-empty{text-align:center;padding:30px 10px;color:var(--ink-dim)}
/* 旅行 */
.travel-stage{position:relative;background:linear-gradient(180deg,#b8e0f0,#88c8e0);border:3px solid #000;border-radius:2px;overflow:hidden;margin-bottom:10px;min-height:340px}
.travel-svg{width:100%;height:auto;display:block}
.travel-svg .land{fill:#e8d8a8;stroke:#8b7355;stroke-width:.5}
.travel-svg .cn-land{fill:#f8e8c8;stroke:#8b7355;stroke-width:.8}
.travel-svg .cn-border{fill:none;stroke:#b8966a;stroke-width:.4;stroke-dasharray:2,2}
.travel-dot{cursor:pointer;transition:transform .12s;transform-box:fill-box;transform-origin:center}
.travel-dot:hover{transform:scale(1.18)}
.travel-dot circle{stroke:#000;stroke-width:1}
.travel-dot text{font-size:9px;fill:#2a1a0a;pointer-events:none;text-anchor:middle;font-family:var(--px)}
.travel-dot.visited circle{fill:var(--good)}
.travel-dot.wishlist circle{fill:var(--gold)}
.travel-dot.normal circle{fill:var(--hp);opacity:.8}
.travel-detail{background:var(--panel);border:2px solid #000;border-radius:2px;padding:10px;margin-top:10px}
.td-notes{margin-top:10px;border-top:2px dashed var(--line);padding-top:8px}
.td-notes-h{font-weight:700;font-size:13px;margin-bottom:6px;color:var(--accent)}
.td-note{display:flex;align-items:flex-start;gap:6px;padding:4px 0;font-size:12px;border-bottom:1px dotted rgba(0,0,0,.08)}
.td-tag{flex:none;font-size:13px}
.td-ntxt{flex:1;line-height:1.5;word-break:break-all}

.city-stage{position:relative;background:linear-gradient(180deg,#d4e4b8,#b8d4a0);border:3px solid #000;border-radius:2px;overflow:hidden;margin-bottom:10px;min-height:380px}
.city-svg{width:100%;height:auto;display:block}
.city-svg .grid{stroke:#00000018;stroke-width:.3}
.city-svg .water{fill:#a8d8ea;opacity:.7}
.poi-dot{cursor:pointer;transition:transform .12s;transform-box:fill-box;transform-origin:center}
.poi-dot:hover{transform:scale(1.18)}
.poi-dot circle{stroke:#000;stroke-width:1}
.poi-dot text{font-size:3.6px;fill:#2a1a0a;pointer-events:none;text-anchor:middle;font-family:var(--px)}
/* ===== 使用场景：手机/平板 ===== */
body[data-device="tablet"]{font-size:15px}
body[data-device="tablet"] .chip{font-size:13px;padding:5px 12px}
body[data-device="tablet"] .pxbtn{font-size:14px;padding:10px 15px}
body[data-device="tablet"] .modbtn{min-width:96px;font-size:14px}
body[data-device="tablet"] .city-switch .chip{font-size:13px;padding:5px 12px}
body[data-device="tablet"] .poi-dot text{font-size:3.8px}
body[data-device="phone"] .pxbtn.small{font-size:13px;padding:8px 13px}
body[data-device="phone"] .chip{padding:6px 11px;min-height:28px;box-sizing:border-box}
body[data-device="phone"] .city-switch .chip{padding:5px 10px}
body[data-device="phone"] .modbtn{min-width:80px}
body[data-device="phone"] .poi-dot text{font-size:3.9px}
/* ===== 城市地图缩放 ===== */
.city-stage{touch-action:none;-webkit-user-select:none;user-select:none}
.city-ctrl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:4}
.city-ctrl button{width:36px;height:36px;font-size:17px;line-height:1;padding:0}
.zoom-badge{position:absolute;left:8px;top:8px;z-index:4;background:rgba(0,0,0,.45);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;pointer-events:none}
.poi-dot.spot circle{fill:var(--good)}
.poi-dot.transit circle{fill:var(--hp);opacity:.9}
.poi-dot.dim{opacity:.22}
.city-stage.lod0 .poi-dot.transit:not(.visited):not(.wish) text{display:none}

/* ===== 手机底部 Tab 导航 ===== */
.btabs{display:none}
.more-sheet{display:none;position:fixed;inset:0;z-index:320;background:rgba(0,0,0,.5)}
.more-sheet.open{display:block}
.more-sheet .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:3px solid #000;box-shadow:0 -4px 0 rgba(0,0,0,.3);padding:12px 12px calc(18px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto}
.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
body[data-device="phone"] .mods{display:none}
body[data-device="phone"] .wrap{padding-bottom:76px}
body[data-device="phone"] .btabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:250;background:var(--panel);border-top:3px solid #000;box-shadow:0 -3px 0 rgba(0,0,0,.35);padding:3px 4px calc(3px + env(safe-area-inset-bottom));gap:2px}
.btab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 4px;background:transparent;border:2px solid transparent;outline:none;font-family:var(--px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.btab .ico{font-size:20px;line-height:1;filter:drop-shadow(2px 2px 0 #000)}
.btab .lbl{font-size:9px;color:var(--ink-dim)}
.btab.active{border-color:var(--accent);background:var(--panel2)}
.btab.active .lbl{color:var(--accent)}
body[data-device="phone"] .quick-add{bottom:90px}
body[data-device="phone"] #installHint{bottom:92px !important}

.poi-filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.poi-info{background:var(--panel);border:2px solid #000;border-radius:2px;padding:10px;margin-top:10px}
.poi-addrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.poi-tag{display:inline-block;font-size:10px;padding:1px 6px;border:1px solid var(--line);border-radius:2px;background:var(--panel2);color:var(--muted)}
.poi-dot.visited circle{stroke:var(--gold);stroke-width:1.8;fill:#e8c85a}
.poi-dot.visited text{fill:#8a6a10;font-weight:bold}
.poi-dot.wish circle{stroke:#e090c8;stroke-width:1.6}
.poi-dot.wish text{fill:#a04878}
.city-switch{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.city-switch .chip{font-size:11px;padding:2px 8px}
.exp-wrap{position:relative;height:16px;background:var(--panel2);border:2px solid #000;margin:6px 0 10px;box-sizing:border-box}
.exp-fill{height:100%;background:repeating-linear-gradient(90deg,var(--gold),var(--gold) 6px,#d4a829 6px,#d4a829 12px)}
.route-line{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:3 2;fill:none;opacity:.9}
.route-stop circle{fill:#1a1020;opacity:.85;stroke:var(--accent);stroke-width:1.2}
.route-stop text{fill:#ffe9a8;font-size:5px;text-anchor:middle;font-weight:bold}
.route-row{display:flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid #000;padding:4px 8px;margin-top:4px;font-size:12px}
.route-num{display:inline-block;min-width:18px;height:18px;line-height:16px;text-align:center;background:var(--accent);color:#1a1020;font-weight:bold;border:2px solid #000;border-radius:50%;font-size:10px}
.exp-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#2a1a0a;text-shadow:0 0 2px #fff}
.tips-box{margin-top:6px;font-size:12px;background:var(--panel2);border:1px dashed var(--line);padding:4px 8px;border-radius:2px}

.food-cat{margin:4px 0;border:2px solid #000;border-radius:2px;background:var(--panel);box-shadow:2px 2px 0 rgba(0,0,0,.18)}
.food-cat-h{padding:8px 10px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:6px;user-select:none}
.food-cat-h:hover{background:rgba(0,0,0,.05)}
.food-cat-h .ar{display:inline-block;color:var(--accent);font-weight:900}
.food-cat-b{padding:4px 10px 10px 22px;border-top:2px dashed var(--line)}
.food-leaf{padding:3px 0;font-size:13px;border-bottom:1px dotted rgba(0,0,0,.08)}
.food-leaf b{color:var(--accent)}
.food-nutri{display:inline-block;margin-left:6px;font-size:11px;color:#2e8b57;background:rgba(46,139,87,.12);padding:1px 6px;border-radius:8px}
/* ================= 食物购买清单 ================= */
.shop-sel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:860px){.shop-sel-grid,.shop-grid{grid-template-columns:repeat(2,1fr)}}
.shop-sel{border:2px solid #000;border-radius:2px;background:var(--panel);box-shadow:2px 2px 0 rgba(0,0,0,.18)}
.shop-sel-h{padding:6px 8px;cursor:pointer;font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;user-select:none}
.shop-sel-h:hover{background:rgba(0,0,0,.05)}
.shop-sel-h .ar{color:var(--accent);font-weight:900}
.shop-sel-b{padding:4px 8px 8px;border-top:2px dashed var(--line);max-height:190px;overflow-y:auto}
.shop-col{border:2px solid var(--line);border-radius:2px;padding:6px;background:var(--panel2)}
.shop-col-h{font-weight:700;font-size:13px;margin-bottom:4px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.shop-item{padding:4px 6px;cursor:pointer;font-size:13px;border-radius:2px;display:flex;align-items:center;gap:5px}
.shop-item:hover{background:rgba(0,0,0,.06)}
.shop-item.done{opacity:.65}
.shop-item.done .shop-n{text-decoration:line-through}
.shop-x{margin-left:auto;color:#c0392b;font-size:11px;padding:0 3px}
.shop-x:hover{color:#e74c3c;font-weight:900}
.shop-cnt{background:var(--accent);color:#1a1020;border-radius:8px;padding:0 6px;font-size:11px}
.shop-hist{margin-top:2px}
.shop-hist-h{cursor:pointer;font-size:12px;padding:3px 0;user-select:none}
.shop-hist-h:hover{color:var(--accent)}
.shop-hist-h .ar{color:var(--accent);font-weight:900}
.shop-hist-b{padding:2px 0 6px 18px}
/* 中国地图四层缩放 */
.cn-map-wrap{overflow:hidden;touch-action:none}
.cn-svg{cursor:grab;user-select:none}
.cn-svg:active{cursor:grabbing}
.cn-zoom{position:absolute;top:8px;right:8px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);border:2px solid #000;border-radius:2px;padding:8px 5px;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.cn-zoom-label{font-size:13px;line-height:1}
.cn-zoom-range{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:10px;height:130px;accent-color:var(--accent);cursor:pointer}
.cn-zoom-btns{display:flex;flex-direction:column;gap:4px}
.cn-lv{width:30px;height:30px;font-size:14px;border:2px solid #000;border-radius:2px;background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .1s}
.cn-lv:hover{transform:translateY(-1px)}
.cn-lv.on{background:var(--accent);box-shadow:inset 0 0 0 2px #000}
.cn-zoom-val{font-size:10px;font-weight:bold;color:var(--accent)}
.cn-legend{font-size:10px;color:#3a4a5a;text-align:center;padding:4px;background:rgba(255,255,255,.4);border-top:2px solid #000}
@media (max-width:520px){ .cn-zoom-range{height:110px} .cn-lv{width:26px;height:26px;font-size:12px} }
/* ===== 中国地图·Canvas 平滑缩放版 ===== */
.cn-canvas-wrap{position:relative;width:100%;height:480px;overflow:hidden;touch-action:none;background:linear-gradient(180deg,#bfe0f2,#dcefe0);border:2px solid #000;border-radius:3px;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.cn-canvas{display:block;width:100%;height:100%;cursor:grab}
.cn-canvas:active{cursor:grabbing}
.cn-ctrl{position:absolute;right:10px;bottom:10px;z-index:6;display:flex;flex-direction:column;gap:8px;align-items:center}
.cn-ctrl button{width:38px;height:38px;font-size:18px;border:2px solid #000;border-radius:3px;background:var(--panel);box-shadow:2px 2px 0 rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .08s,background .12s}
.cn-ctrl button:hover{transform:translateY(-1px)}
.cn-ctrl button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(0,0,0,.3)}
.cn-locate{background:var(--accent);color:#1a1020}
.cn-zlbl{position:absolute;left:10px;top:8px;z-index:6;background:var(--panel);border:2px solid #000;border-radius:3px;padding:4px 8px;font-size:11px;font-weight:bold;box-shadow:2px 2px 0 rgba(0,0,0,.25);color:#3a4a5a}
.cn-zlbl b{color:var(--accent)}
.cn-tip{position:absolute;left:10px;bottom:10px;z-index:6;font-size:10px;color:#3a4a5a;background:rgba(255,255,255,.55);border:1px solid #000;border-radius:2px;padding:3px 6px;max-width:62%}
.cn-cluster{font-weight:bold}
.travel-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.travel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.travel-item{background:var(--panel2);border:2px solid #000;border-radius:2px;padding:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.travel-item .nm{flex:1;font-size:12px;word-break:break-all}
.travel-diary{background:var(--panel2);border:2px solid #000;border-radius:4px;padding:10px;margin-bottom:8px}
.travel-diary:hover{border-color:var(--accent)}
/* 语音速记 */
.voice-panel{background:var(--panel2);border:2px solid #000;outline:2px solid var(--line);border-radius:2px;padding:12px;margin-bottom:10px}
.rec-btn{width:64px;height:64px;border-radius:50%;border:3px solid #000;background:var(--hp);color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 rgba(0,0,0,.35);transition:transform .1s;flex:none}
.rec-btn:hover{filter:brightness(1.1)}
.rec-btn.recording{background:var(--bad);animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{box-shadow:3px 3px 0 rgba(0,0,0,.35),0 0 0 0 rgba(255,80,80,.5)}50%{box-shadow:3px 3px 0 rgba(0,0,0,.35),0 0 0 12px rgba(255,80,80,0)}}
.rec-live{display:none;margin-top:10px}
.rec-live.show{display:block}
.voice-item{background:var(--panel);border:2px solid #000;border-radius:2px;padding:8px;margin-bottom:6px}
.voice-item audio{width:100%;height:34px;margin-top:6px}
.voice-item .vtext{font-size:13px;margin-top:4px;word-break:break-all}

/* ============ 新增：热力图 ============ */
.heatmap{display:flex;flex-wrap:wrap;gap:2px;max-width:100%}
.heatmap .hcell{width:12px;height:12px;border-radius:2px;border:1px solid var(--line);background:var(--input-bg);cursor:pointer;transition:transform .1s}
.heatmap .hcell:hover{transform:scale(1.4);z-index:2}
.heatmap .hcell.l0{background:var(--input-bg)}
.heatmap .hcell.l1{background:#c8e6c9}
.heatmap .hcell.l2{background:#81c784}
.heatmap .hcell.l3{background:#4caf50}
.heatmap .hcell.l4{background:#2e7d32}
.heatmap-legend{display:flex;gap:4px;align-items:center;margin-top:6px;font-size:10px;color:var(--ink-dim)}
.heatmap-legend span{width:12px;height:12px;border-radius:2px}
/* 习惯强度条 */
.bar.str>i{background:linear-gradient(90deg,#9d4edd,#e0563b)}
/* 年度热力图 */
.heat-year{overflow-x:auto;padding-bottom:4px}
.heat-nav{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.heat-nav b{font-family:var(--px)}
.heat-sum{margin-bottom:6px;font-size:11px}
.heat-body{display:flex;gap:4px;align-items:flex-start}
.heat-weekday{display:flex;flex-direction:column;gap:3px;font-size:9px;color:var(--ink-dim);flex:none}
.heat-right{flex:1;min-width:0}
.heat-months{display:flex;gap:3px;margin-bottom:2px}
.hm-label{width:12px;flex:none;font-size:9px;color:var(--ink-dim);white-space:nowrap;overflow:visible}
.heat-grid{display:flex;gap:3px;flex-wrap:nowrap}
.heat-col{display:flex;flex-direction:column;gap:3px}
.heat-col .hcell{width:12px;height:12px;border:1px solid var(--line);border-radius:2px;background:var(--input-bg);cursor:pointer;transition:transform .1s}
.heat-col .hcell:hover{transform:scale(1.4);z-index:2}
.heat-col .hcell.l0{background:var(--input-bg)}
.heat-col .hcell.l1{background:#c8e6c9}
.heat-col .hcell.l2{background:#81c784}
.heat-col .hcell.l3{background:#4caf50}
.heat-col .hcell.l4{background:#2e7d32}
.heat-col .hcell.empty{background:transparent;border-color:transparent}

/* ============ 新增：番茄设置 ============ */
.pomo-settings{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.pomo-settings input{width:60px}
.pomo-stats{display:flex;gap:8px;justify-content:space-around;font-size:11px;margin-top:6px}
.pomo-stats b{color:var(--accent);font-family:var(--px);font-size:11px}
.noise-select{display:flex;gap:4px;flex-wrap:wrap}
.noise-select .chip{cursor:pointer}
/* ===== 时间轴（心理学史 / 历史模块） ===== */
.tl{position:relative;padding-left:20px;margin-top:6px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-i{position:relative;margin-bottom:14px;cursor:pointer}
.tl-i:before{content:"";position:absolute;left:-17px;top:5px;width:11px;height:11px;background:var(--accent);border:2px solid #000;border-radius:50%;box-shadow:0 0 0 2px var(--panel)}
.tl-i:hover:before{background:var(--warn)}
.tl-y{font-family:var(--px);font-size:13px;color:var(--accent);font-weight:bold;letter-spacing:.5px}
.tl-t{font-size:14px;font-weight:bold;margin:1px 0 2px}
.tl-who{font-size:12px;color:var(--ink-dim)}
.tl-c{font-size:13px;line-height:1.7;color:var(--ink-dim);margin-top:2px}
.hist-flag{display:inline-block;font-size:11px;background:var(--panel2);border:2px solid #000;padding:1px 7px;border-radius:20px;margin-bottom:4px}
.hist-leader{font-size:13px;font-weight:bold;color:var(--accent)}
.hist-sub{font-size:12px;color:var(--ink-dim);font-weight:normal;margin-left:6px}
.hist-list{margin:6px 0 0;padding-left:18px}
.hist-list li{font-size:13px;line-height:1.8}
.hist-tag{display:inline-block;font-size:11px;background:var(--accent);color:#1a1020;border:2px solid #000;padding:1px 7px;border-radius:20px;margin-right:4px}

/* ============ 新增：任务标签 & 重复 ============ */
.tag-input{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag-input input{flex:1;min-width:60px}
.repeat-opt{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

/* ============ 新增：批注/读书笔记 ============ */
.annot-highlight{background:rgba(255,200,50,.4);cursor:pointer;border-bottom:2px dashed var(--gold)}
.annot-note{background:rgba(100,180,255,.3);cursor:pointer;border-bottom:2px dotted var(--mp)}
.annot-panel{position:fixed;right:0;top:0;width:320px;height:100vh;background:var(--panel);border-left:3px solid var(--line);z-index:100;overflow-y:auto;padding:12px;box-shadow:-4px 0 0 rgba(0,0,0,.4);transform:translateX(100%);transition:transform .3s}
.annot-panel.show{transform:translateX(0)}
.annot-item{background:var(--panel2);border:2px solid #000;padding:8px;margin-bottom:6px;border-radius:2px}

/* ============ 新增：像素房间 ============ */
.room-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:360px;margin:0 auto}
.room-cell{aspect-ratio:1;background:var(--input-bg);border:2px solid var(--line);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:transform .1s}
.room-cell:hover{transform:scale(1.1);z-index:2;border-color:var(--accent)}
.room-cell.occupied{background:var(--panel2)}
.furniture-shop{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.furniture-item{background:var(--panel2);border:2px solid #000;padding:6px 10px;border-radius:2px;cursor:pointer;font-size:12px;text-align:center;transition:transform .1s}
.furniture-item:hover{transform:translateY(-2px);border-color:var(--accent)}
.furniture-item .emoji{font-size:24px;display:block}

/* ============ 新增：全局搜索 ============ */
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
.search-overlay.show{display:flex}
.search-box{background:var(--panel);border:3px solid #000;outline:3px solid var(--line);padding:16px;width:90%;max-width:600px;box-shadow:0 0 0 8px rgba(0,0,0,.5)}
.search-box input{font-size:16px;padding:10px}
.search-results{max-height:300px;overflow-y:auto;margin-top:8px}
.search-item{display:flex;gap:8px;padding:6px 8px;cursor:pointer;border:2px solid transparent;border-radius:2px;font-size:13px}
.search-item:hover{border-color:var(--accent);background:var(--panel2)}
.search-item .mod-tag{font-size:10px;background:var(--accent);color:#1a1020;padding:1px 6px;border-radius:2px;white-space:nowrap}

/* ============ 新增：情绪日记 ============ */
.emotion-grid{display:flex;gap:8px;flex-wrap:wrap}
.emotion-btn{font-size:32px;cursor:pointer;padding:4px 8px;border:2px solid transparent;border-radius:4px;transition:transform .1s}
.emotion-btn:hover{transform:scale(1.2);border-color:var(--accent)}
.emotion-btn.sel{border-color:var(--accent);background:var(--panel2)}

/* ============ 新增：月度报告长图 ============ */
.report-card{background:var(--panel);border:3px solid #000;outline:3px solid var(--line);padding:20px;max-width:400px;margin:0 auto;text-align:center}
.report-card h2{font-family:var(--px);font-size:14px;color:var(--accent)}
.report-stat{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px dashed var(--line);font-size:12px}
.report-stat b{color:var(--gold)}

/* ============ 新增：深色模式自动切换 ============ */
@media(prefers-color-scheme:dark){[data-darkmode="auto"]{}}

/* ============ 新增：预算进度条 ============ */
.budget-bar{margin:4px 0}
.budget-bar .lbl{font-size:11px;display:flex;justify-content:space-between}
.budget-bar .bar{height:10px}
.budget-bar .bar.warn>i{background:linear-gradient(90deg,var(--warn),var(--hp))}

/* ============ 新增：图片附件 ============ */
.insp-img{max-width:200px;max-height:150px;border:2px solid var(--line);border-radius:2px;margin-top:4px;cursor:pointer;image-rendering:auto}
.insp-img:hover{outline:2px solid var(--accent)}

/* ============ 新增：对比相册 ============ */
.compare-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.compare-slot{flex:1;background:var(--input-bg);border:2px dashed var(--line);border-radius:2px;min-height:120px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--ink-dim)}
.compare-slot img{max-width:100%;max-height:120px;object-fit:contain}
.compare-arrow{font-size:24px;color:var(--accent)}
/* 参考图库 */
.ref-card{display:flex;gap:8px;align-items:center;background:var(--panel2);border:2px solid #000;border-radius:2px;padding:6px;margin-bottom:6px}
.ref-thumb{width:54px;height:54px;object-fit:cover;border:2px solid var(--line);border-radius:2px;cursor:pointer;flex:none}
.ref-card .del{align-self:flex-start}

/* ============ 新增：自由布局 ============ */
[data-layout="compact"] .wrap{padding:8px;max-width:100%}
[data-layout="compact"] main{grid-template-columns:1fr}
[data-layout="compact"] .grid2,[data-layout="compact"] .grid3{grid-template-columns:1fr}
[data-layout="compact"] .panel{padding:8px}
[data-layout="compact"] .pomo-ring{width:96px;height:96px;font-size:16px}
[data-layout="compact"] .book-shelf,.guild-grid{grid-template-columns:repeat(2,1fr)}
[data-layout="compact"] .tile,.card,.panel{min-width:0}
[data-layout="compact"] input,textarea,select,.text-input{max-width:100%;box-sizing:border-box}
[data-layout="wide"] .wrap{max-width:1400px}
[data-layout="wide"] main{grid-template-columns:1fr 1fr 200px}
[data-layout="wide"] .grid2{grid-template-columns:1fr 1fr}
[data-layout="wide"] .grid3{grid-template-columns:repeat(3,1fr)}
[data-layout="wide"] .book-shelf{grid-template-columns:repeat(4,1fr)}

/* ============ 新增：小猫皮肤 ============ */
.skin-picker{display:flex;gap:6px;flex-wrap:wrap}
.skin-opt{width:48px;height:48px;border:3px solid var(--line);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--panel2)}
.skin-opt.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.skin-opt.locked{opacity:.35;filter:grayscale(1)}

/* ============ 新增：白噪音频谱动画 ============ */
.noise-vis{display:flex;gap:2px;align-items:flex-end;height:30px;justify-content:center}
.noise-vis .bar{width:4px;background:var(--accent);animation:none;border-radius:1px;min-height:3px}

/* ============ 新增：汉字字典模块 ============ */
.dict-card{display:flex;gap:12px;background:var(--panel-bg,var(--panel));border:2px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;align-items:flex-start}
.dict-char{font-size:52px;line-height:1;font-weight:700;color:var(--accent);min-width:64px;text-align:center;font-family:var(--cn)}
.dict-meta{flex:1;min-width:0}
.dict-py{font-size:18px;color:var(--accent);font-weight:700}
.dict-info{font-size:12px;color:var(--ink-dim);margin:2px 0 4px}
.dict-mean{font-size:14px;color:var(--ink);line-height:1.5}
.dict-words{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.dict-word{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:10px;background:var(--input-bg);color:var(--accent);cursor:pointer}
.dict-word:hover{background:var(--accent);color:#1a1020}
.dict-actions{display:flex;flex-direction:column;gap:6px;min-width:88px}
.dict-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:2px solid var(--line);border-radius:6px;background:var(--input-bg);color:var(--ink);cursor:pointer;font-size:13px;margin:3px}
.dict-chip:hover,.dict-chip.on{border-color:var(--accent);color:var(--accent)}
.dict-chip i{font-style:normal;font-size:10px;color:var(--ink-dim)}
.dict-empty{color:var(--ink-dim);text-align:center;padding:30px 10px;font-size:13px}
.dict-hint{font-size:12px;color:var(--ink-dim);margin-top:6px;line-height:1.6}
.dict-stats{font-size:12px;color:var(--accent);margin:6px 0}
/* 心情天气 */
.mw-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.mw-cell{border:2px solid var(--line);border-radius:3px;background:var(--panel2);padding:3px 1px;text-align:center;min-height:42px}
.mw-d{font-size:10px;color:var(--ink-dim)}
.mw-w{font-size:16px;line-height:1.1}
.mw-t{font-size:8px;margin-top:1px}
/* 像素扭蛋机 */
.gacha-box{max-height:70vh;overflow:auto}
.gacha-result{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;min-height:10px}
.gacha-item{width:64px;text-align:center;padding:6px 2px;border:2px solid #000;border-radius:3px;background:var(--panel2);animation:gachaPop .35s ease}
.gacha-e{font-size:26px;line-height:1}
.gacha-n{font-size:10px;margin-top:2px}
.gacha-rr{font-size:9px;font-weight:bold;margin-top:1px}
.gacha-item.r-SSR{box-shadow:0 0 10px #f5c542;background:linear-gradient(180deg,#fff7da,#ffe9a8)}
.gacha-item.r-SR{box-shadow:0 0 6px #5bb8e6}
@keyframes gachaPop{0%{transform:scale(0) rotate(-15deg);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.gacha-book{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:6px}
.gacha-cell{text-align:center;padding:5px 2px;border:2px solid var(--line);border-radius:3px;background:var(--panel2);font-size:9px}
.gacha-cell.locked{filter:grayscale(1);opacity:.45}
.gacha-ce{font-size:20px;line-height:1}
.gacha-cn{margin-top:1px;font-size:9px}
.gacha-cr{font-size:9px;font-weight:bold}
/* ============ 通用折叠区块（手机端默认收起，桌面默认展开）============ */
.fold{margin-bottom:12px;background:var(--panel);border:3px solid #000;outline:2px solid var(--line);outline-offset:0;box-shadow:6px 6px 0 rgba(0,0,0,.4);border-radius:2px;overflow:hidden}
.grid2>.fold,.grid3>.fold{margin-bottom:0}
.fold-h{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;user-select:none;background:var(--panel2,#2a2a2a);font-size:14px;line-height:1.2}
.fold-h:active{filter:brightness(.92)}
.fold-ico{font-size:15px}
.fold-t{flex:1;font-weight:bold;color:var(--ink)}
.fold-arrow{font-size:12px;color:var(--ink-dim);transition:transform .15s ease}
.fold.open .fold-arrow{transform:rotate(180deg)}
.fold-b{padding:14px;border-top:2px solid var(--line);background:var(--panel)}
.fold:not(.open) .fold-b{display:none}
/* 字典 A-Z 按拼音首字母浏览 */
.dict-alpha-index{display:flex;flex-wrap:wrap;gap:0;margin:8px 0 2px}
.dict-alpha-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.dict-alpha-tile{width:56px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:5px;background:var(--panel2);cursor:pointer;padding:2px}
.dict-alpha-tile:hover{border-color:var(--accent);background:var(--accent);color:#1a1020}
.dict-alpha-tile b{font-size:26px;line-height:1.1;font-family:var(--cn)}
.dict-alpha-tile i{font-style:normal;font-size:10px;color:var(--ink-dim);margin-top:1px}
.dict-alpha-tile:hover i{color:#1a1020}
.dict-chip-all{background:var(--accent);color:#1a1020;border-color:var(--accent);font-weight:bold}
.dict-chip-all:hover{filter:brightness(1.1)}
.dict-alpha-sec{margin-top:14px}
.dict-alpha-sec-h{font-size:15px;font-family:var(--mono);color:var(--accent);border-bottom:2px dashed var(--line);padding-bottom:3px;margin-bottom:4px}
.dict-alpha-sec-h i{font-style:normal;font-size:11px;color:var(--ink-dim);margin-left:6px}
.dict-alpha-toplink{position:fixed;right:14px;bottom:14px;z-index:60;opacity:.85}
.guild-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guild-cell{background:var(--panel2);border:2px solid var(--line);border-radius:2px;padding:10px}
@media(max-width:560px){.guild-grid{grid-template-columns:1fr}}
.quick-add{position:fixed;right:16px;bottom:16px;z-index:280;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.qa-fab{width:52px;height:52px;border:3px solid #000;outline:2px solid var(--accent);background:var(--accent);color:#1a1020;font-size:26px;font-weight:bold;border-radius:50%;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.4);font-family:var(--px);line-height:1}
.qa-fab:hover{filter:brightness(1.12)}
.qa-menu{display:none;flex-direction:column;gap:6px;background:var(--panel);border:2px solid #000;outline:2px solid var(--line);padding:8px;border-radius:2px;animation:pop .15s ease}
.qa-menu button{font-size:13px;padding:8px 14px;text-align:left;white-space:nowrap}
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.heat-cell{aspect-ratio:1;border:1px solid rgba(0,0,0,.25);border-radius:2px;background:var(--panel)}
.heat-cell.lv0{background:var(--panel2)}
.heat-cell.lv1{background:#7bc96f}
.heat-cell.lv2{background:#4caf50}
.heat-cell.lv3{background:#2e7d32}
.exam-chip{font-size:11px;padding:4px 8px;background:var(--panel2);border:2px solid #000;outline:2px solid var(--line);border-radius:2px;white-space:nowrap}
.exam-chip.urgent{outline-color:var(--bad);color:var(--bad)}
.exam-chip.past{opacity:.5}

let S = load();
/* 启动后若已开启 GitHub 同步，异步拉取最新数据（函数声明已提升，可安全调用） */
(function(){ const g=S.profile&&S.profile.gist; if(g&&g.enabled&&g.token&&g.gistId&&typeof fetch==='function'){ gistPull(); } })();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(LS_KEY)); if(d) return mergeDefault(d); }catch(e){}
  return defaultState();
}
function mergeDefault(d){
  const base = defaultState();
  function deepMerge(target, src){
    for(const k in src){
      if(Array.isArray(src[k])){ target[k] = Array.isArray(target[k]) ? target[k] : src[k]; }
      else if(typeof src[k]==='object' && src[k]!==null){
        target[k] = typeof target[k]==='object' && target[k]!==null ? target[k] : {};
        deepMerge(target[k], src[k]);
      } else { if(!(k in target)) target[k] = src[k]; }
    }
  }
  deepMerge(d, base);
  return d;
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); scheduleGistPush(); scheduleBackup(); }
let _bkLast=0;

async function deriveKey(pwd,salt){ const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function encBackup(pwd){ const salt=crypto.getRandomValues(new Uint8Array(16)); const key=await deriveKey(pwd,salt); const iv=crypto.getRandomValues(new Uint8Array(12)); const pt=new TextEncoder().encode(JSON.stringify(S)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,pt); const bin=new Uint8Array([...salt,...iv,...new Uint8Array(ct)]); return 'BAUWENC1:'+btoa(String.fromCharCode(...bin)); }
async function decBackup(str,pwd){ str=(str||'').trim().replace('BAUWENC1:',''); const bin=Uint8Array.from(atob(str),c=>c.charCodeAt(0)); const salt=bin.slice(0,16), iv=bin.slice(16,28), ct=bin.slice(28); const key=await deriveKey(pwd,salt); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct); S=mergeDefault(JSON.parse(new TextDecoder().decode(pt))); save(); render(); }

/* ---------- GitHub Gist 多端同步 ---------- */
const GIST_FILE = "bauw_state.json";
let _gistTimer = null;
function gistCfg(){ return S.profile.gist || (S.profile.gist={token:"",gistId:"",enabled:false,lastSync:""}); }
function scheduleGistPush(){
  const c=gistCfg();
  if(!c.enabled || !c.token || typeof fetch!=='function') return;
  if(_gistTimer) clearTimeout(_gistTimer);
  _gistTimer=setTimeout(gistPush, 1500);
}
async function gistPush(){
  const c=gistCfg();
  if(!c.enabled || !c.token || typeof fetch!=='function') return;
  try{
    const payload=JSON.stringify(S,null,2);
    const headers={"Authorization":"Bearer "+c.token,"Content-Type":"application/json","Accept":"application/vnd.github+json"};
    let url,method,body;
    if(c.gistId){
      url="https://api.github.com/gists/"+c.gistId; method="PATCH";
      body=JSON.stringify({files:{[GIST_FILE]:{content:payload}}});
    } else {
      url="https://api.github.com/gists"; method="POST";
      body=JSON.stringify({description:"BauW 工作台多端同步",public:false,files:{[GIST_FILE]:{content:payload}}});
    }
    const res=await fetch(url,{method,headers,body});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json=await res.json();
    if(!c.gistId){ c.gistId=json.id; }
    c.lastSync=new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify(S));   // 持久化 gistId/lastSync，不调 save() 避免递归触发推送
    toast("☁️ 已同步到 GitHub~","good");
  }catch(e){
    console.warn("Gist 同步上传失败:",e);
    toast("云端同步失败（本地数据已保留）","warn");
  }
}
async function gistPull(){
  const c=gistCfg();
  if(!c.enabled || !c.token || !c.gistId || typeof fetch!=='function') return;
  try{
    const res=await fetch("https://api.github.com/gists/"+c.gistId,{headers:{"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json"}});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json=await res.json();
    const f=json.files && json.files[GIST_FILE];
    if(!f || !f.content) return;
    const data=JSON.parse(f.content);
    S=mergeDefault(data);
    c.lastSync=new Date().toISOString();
    save(); render();
    toast("☁️ 已从 GitHub 拉取最新数据~","good");
  }catch(e){
    console.warn("Gist 同步拉取失败:",e);
    toast("云端拉取失败（继续使用本地数据）","warn");
  }
}
function gistPushNow(){ const c=gistCfg(); if(!c.token){toast("请先在设置填写 GitHub Token","warn");return;} clearTimeout(_gistTimer); gistPush(); }
function gistPullNow(){ const c=gistCfg(); if(!c.token){toast("请先在设置填写 GitHub Token","warn");return;} if(!c.gistId){toast("还没有同步记录，先点「立即上传」","warn");return;} gistPull(); }

/* ============================================================
   每日内容引擎：去重 + 每天推进一个新内容 + 可手动「换一条」
   - 每天首次打开某模块：自动选一个「未看过」的内容，标记已看
   - 当天再打开：保持同一条，不重复刷新
   - 点「换一条」：当前标记已看，立刻换下一条未看过的
   - 全部看过则清空记录重新循环
   ============================================================ */
function pickDaily(key, pool, reshuffle){
  if(!S.daily) S.daily={};
  if(!S.seen) S.seen={};
  if(!S.daily[key]) S.daily[key]={date:"",idx:0};
  if(!S.seen[key]) S.seen[key]=[];
  const d=S.daily[key], seen=S.seen[key];
  const isNewDay = d.date!==todayStr();
  if(isNewDay || reshuffle){
    if(reshuffle && !seen.includes(d.idx)) seen.push(d.idx);
    if(seen.length>=pool.length) S.seen[key]=[];
    let idx=0; while(S.seen[key].includes(idx) && idx<pool.length) idx++;
    d.idx=idx; d.date=todayStr();
    if(isNewDay && !S.seen[key].includes(idx)) S.seen[key].push(idx);
    save();
  }
  return pool[d.idx]||pool[0];
}
// 单词：每天推进N个新词，循环即复习（艾宾浩斯友好）
function activeBook(){
  const m = S.english.examMode;
  if(m==='自定义') return (S.english.customWords||[]);
  return ENG_BOOKS[m] || WORDS;
}
function pickWords(n, reshuffle){
  const pool=activeBook();
  if(!pool.length){ S.english.cursor=0; return []; }
  if(!('cursor' in S.english)){ S.english.cursor=0; S.english._wday=todayStr(); save(); }
  if(reshuffle){ S.english.cursor=(S.english.cursor+n)%pool.length; S.english._wday=todayStr(); save(); }
  else if(S.english._wday!==todayStr()){ S.english.cursor=(S.english.cursor+n)%pool.length; S.english._wday=todayStr(); save(); }
  const arr=[]; for(let i=0;i<n;i++) arr.push(pool[(S.english.cursor+i)%pool.length]);
  return arr;
}
function addCustomWord(){
  const w=(document.getElementById('cwWord').value||'').trim();
  const p=(document.getElementById('cwPhon').value||'').trim();
  const m=(document.getElementById('cwMean').value||'').trim();
  if(!w){ toast('请先输入单词','warn'); return; }
  S.english.customWords=S.english.customWords||[];
  if(S.english.customWords.find(x=>x.w.toLowerCase()===w.toLowerCase())){ toast('该单词已存在','warn'); return; }
  S.english.customWords.push({w, p, m:m||'(待补释义)'});
  save(); R.eng(); toast('已添加：'+w,'good');
}
function delCustomWord(w){
  if(!confirm('删除单词「'+w+'」？')) return;
  S.english.customWords=(S.english.customWords||[]).filter(x=>x.w!==w);
  save(); R.eng(); toast('已删除','good');
}
// 通用换一条
function reshufflePick(key, pool){
  if(key==='word') pickWords(15,true); else pickDaily(key, pool, true);
  R[curMod] && R[curMod]();
  toast("换了一条新内容喵~","good");
}

  return `<button class="modbtn ${m.id===curMod?'active':''}" onclick="App.go('${m.id}')">
    <span class="ico">${m.ico}</span><span class="lbl">${m.lbl}</span></button>`;
}

/* ---------- 渲染导航 ---------- */
function renderNav(){
  const pinned = MODULES.filter(m=>NAV_PINNED.includes(m.id));
  const others = MODULES.filter(m=>!NAV_PINNED.includes(m.id));
  // 当前所在模块若属于「更多」内，则自动展开，保证 active 高亮可见
  if(others.some(m=>m.id===curMod)) navMoreOpen = true;
  const moreBtn = `<button class="modbtn more ${navMoreOpen?'open':''}" onclick="toggleNavMore()">
    <span class="ico">${navMoreOpen?'▲':'⋯'}</span><span class="lbl">${navMoreOpen?'收起':'更多'}</span></button>`;
  const othersHtml = navMoreOpen
    ? `<div class="mod-more">${others.map(navBtn).join("")}</div>` : "";
  $("#modNav").innerHTML = pinned.map(navBtn).join("") + moreBtn + othersHtml;
}
function toggleNavMore(){ navMoreOpen = !navMoreOpen; renderNav(); }

/* ---------- 手机底部 Tab ---------- */
const BTAB_IDS=["dash","task","fin","travel"];
function renderBottomTabs(){
  const bt=document.getElementById('bottomTabs'); if(!bt)return;
  bt.innerHTML=BTAB_IDS.map(function(id){
    const m=MODULES.filter(function(x){return x.id===id;})[0]; if(!m)return '';

  }).join('')+'<button class="btab" onclick="openMoreSheet()"><span class="ico">⋯</span><span class="lbl">更多</span></button>';

function openMoreSheet(){

  sh.innerHTML='<div class="sheet"><h3 class="sub" style="margin:2px 0 10px">📦 全部模块</h3><div class="more-grid">'+
