const R = {}; // 各模块渲染函数

/* ============ 通用折叠：渲染后把各 .panel 包成可折叠区块 ============ */
let foldState = {}; // key: modId::title -> true(展开)/false(收起)，内存态（不持久化）
function foldify(sec, mod){
  if(!sec) return;
  const m = (typeof window!=='undefined') && window.innerWidth<=820;
  let idx = 0;
  sec.querySelectorAll('.panel').forEach(p=>{
    if(p.closest('.panel') !== p) return; // 跳过嵌套 panel
    const h = p.querySelector('h3.sub, h2.title, h3');
    const title = h ? h.textContent.trim() : ((MODULES.find(x=>x.id===mod)||{}).title || '面板');
    let body; if(h){ h.remove(); body = p.innerHTML; } else { body = p.innerHTML; }
    const key = mod+'::'+title;
    let isOpen;
    if(key in foldState) isOpen = foldState[key];
    else isOpen = true; // 默认全部展开，避免手机端误以为板块丢失（仍可手动折叠，状态会记忆）
    idx++;
    const node = document.createElement('div');
    node.className = 'fold'+(isOpen?' open':'');
    node.dataset.foldKey = key;
    node.innerHTML = `<div class="fold-h" onclick="toggleFoldBlock(this)"><span class="fold-arrow">▾</span><span class="fold-t">${escapeHtml(title)}</span></div><div class="fold-b">${body}</div>`;
    p.replaceWith(node);
  });
}
function toggleFoldBlock(hEl){
  const fold = hEl.closest('.fold'); if(!fold) return;
  fold.classList.toggle('open');
  const key = fold.dataset.foldKey;
  if(key) foldState[key] = fold.classList.contains('open');
}

/* ============================================================
   汉字字典模块（参考《新华字典》体例，离线常用字精选）
   ============================================================ */
let dictMode = "search";   // search | radical | stroke | fav | daily | alpha
let dictQ = "";
let dictRad = null;        // 当前浏览的部首
let dictStk = null;        // 当前浏览的笔画数
let dictAlpha = null;      // 当前浏览的拼音首字母（alpha 模式）

function dictReady(){ return typeof DICT !== "undefined" && DICT && Object.keys(DICT).length; }

function dictUpdateTabs(){
  document.querySelectorAll("#sec-dict .dict-tabs .pxbtn").forEach(b=>{
    b.classList.toggle("primary", b.dataset.m === dictMode);
  });
}
function dictSetMode(m){
  dictMode = m; dictRad = null; dictStk = null; dictAlpha = null;
  dictUpdateTabs(); dictRenderContent();
}
function dictSearch(q){
  dictQ = (q||"").trim();
  if(dictMode !== "search"){ dictMode = "search"; dictUpdateTabs(); }
  dictRenderContent();
}
function dictLookup(w){
  const inp = document.querySelector("#sec-dict #dictInput");
  if(inp){ inp.value = w; }
  dictQ = w; dictMode = "search"; dictUpdateTabs(); dictRenderContent();
}
function dictSetRadical(r){
  dictRad = r; dictMode = "radical"; dictUpdateTabs(); dictRenderContent();
}
function dictSetStroke(n){
  dictStk = n; dictMode = "stroke"; dictUpdateTabs(); dictRenderContent();
}
function dictSetAlpha(L){
  dictAlpha = L || null; dictMode = "alpha"; dictUpdateTabs(); dictRenderContent();
}
const DICT_FUN_CHARS=['梦','光','笑','星','海','猫','甜','暖','勇','悟','禅','茶','诗','画','风','雪','月','火','水','心','爱','想','念','乐','喜','花','云','雨','春','秋','山','石','玉','金','木','鸟','鱼','龙','虎','鹿','蝶','沙','盐','糖','酒','歌','舞','书','笔','墨','影','幻','灵','静','安','康','福','缘','惜','感','恩','望','途','野','潮','浪','森','林','谷','川','河','湖','泉','翼','羽','晶','彩','虹','盼','悦','悠','澄','澈','锦','绣','萌','酣','惬','恬','馨'];
function dictDailyChar(){
  if(!dictReady()) return null;
  if(S.dict.dailyOverride && S.dict.dailyOverrideDay===todayStr() && DICT[S.dict.dailyOverride]) return S.dict.dailyOverride;
  const keys = Object.keys(DICT);
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const doy = Math.floor((now - start) / 86400000);
  return keys[doy % keys.length];
}
function dictRefreshDaily(){
  if(!dictReady())return;
  const keys=Object.keys(DICT);
  let pool=keys;
  const fun=DICT_FUN_CHARS.filter(c=>DICT[c]);
  if(fun.length) pool=fun;
  const hist=(S.dict.dailyHistory&&S.dict.dailyHistory.day===todayStr())?S.dict.dailyHistory.list:[];
  let pick,guard=0;
  do{ pick=pool[Math.floor(Math.random()*pool.length)]; guard++; }while(hist.includes(pick)&&hist.length<pool.length&&guard<60);
  S.dict.dailyOverride=pick; S.dict.dailyOverrideDay=todayStr();
  S.dict.dailyHistory={day:todayStr(),list:[...(hist),pick]};
  save(); renderDict(); toast("换了一个字喵~","good");
}
function dictCardHTML(ch){
  const d = DICT[ch]; if(!d) return "";
  const fav = (S.dict.favs||[]).includes(ch);
  const learned = (S.dict.learned||[]).includes(ch);
  const words = (d.words||[]).map(w=>`<span class="dict-word" onclick="dictLookup('${escapeHtml(w)}')">${escapeHtml(w)}</span>`).join("");
  return `<div class="dict-card">
    <div class="dict-char">${ch}</div>
    <div class="dict-meta">
      <div class="dict-py">${d.py}</div>
      <div class="dict-info">部首 <b>${escapeHtml(d.rad)}</b> · 笔画 <b>${d.stk}</b></div>
      <div class="dict-mean">${escapeHtml(d.mean)}</div>
      <div class="dict-words">${words}</div>
    </div>
    <div class="dict-actions">
      <button class="pxbtn small" onclick="dictToggleFav('${ch}')">${fav?"★ 已收藏":"☆ 收藏"}</button>
      <button class="pxbtn small" onclick="dictMarkLearned('${ch}')">${learned?"✓ 已学会":"○ 标记学会"}</button>
    </div>
  </div>`;
}
function dictMatch(q){
  q = q.toLowerCase();
  const res = [];
  for(const ch in DICT){
    const d = DICT[ch];
    const pyTone = d.py.toLowerCase();
    const pyPlain = d.py.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
    if(ch === q || pyTone.indexOf(q) >= 0 || pyPlain.indexOf(q) >= 0 || d.mean.indexOf(q) >= 0 || (d.words||[]).some(w=>w.indexOf(q) >= 0)){
      res.push(ch);
    }
  }
  return res;
}
function dictRadicalGroups(){
  const map = {};
  for(const ch in DICT){
    const r = DICT[ch].rad || "？";
    (map[r] = map[r] || []).push(ch);
  }
  return map;
}
function dictStrokeGroups(){
  const map = {};
  for(const ch in DICT){
    const s = DICT[ch].stk;
    (map[s] = map[s] || []).push(ch);
  }
  return map;
}
/* ===== 按拼音首字母 A-Z 浏览 ===== */
function dictTone(py){
  const n = (py||"").normalize("NFD");
  for(let i=0;i<n.length;i++){
    const c = n.charCodeAt(i);
    if(c===0x0304) return 1;   // ā macron → 一声
    if(c===0x0301) return 2;   // á acute  → 二声
    if(c===0x030C) return 3;   // ǎ caron  → 三声
    if(c===0x0300) return 4;   // à grave  → 四声
  }
  return 5;                    // 轻声
}
function dictCmp(a,b){
  const pa = (DICT[a].py||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const pb = (DICT[b].py||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  if(pa!==pb) return pa<pb?-1:1;
  return dictTone(DICT[a].py) - dictTone(DICT[b].py);
}
function dictAlphaCounts(){
  const cnt = {};
  for(const ch in DICT){
    const ini = dictIni(DICT[ch].py);
    cnt[ini] = (cnt[ini]||0)+1;
  }
  return cnt;
}
function dictAlphaList(ini){
  const arr = [];
  for(const ch in DICT){
    if(dictIni(DICT[ch].py) === ini) arr.push(ch);
  }
  arr.sort(dictCmp);
  return arr;
}
function dictAlphaListAll(){
  const cnt = dictAlphaCounts();
  const letters = Object.keys(cnt).sort();
  return letters.map(L=>{
    const arr = dictAlphaList(L);
    return `<div class="dict-alpha-sec" id="asec-${L}"><div class="dict-alpha-sec-h">${L.toUpperCase()}<i>${arr.length} 字</i></div><div class="dict-alpha-grid">` +
      arr.map(ch=>{ const d=DICT[ch]; return `<span class="dict-alpha-tile" onclick="dictLookup('${ch}')" title="${escapeHtml(d.py)}"><b>${ch}</b><i>${escapeHtml(d.py)}</i></span>`; }).join("") +
      `</div></div>`;
  }).join("");
}
function dictIni(py){
  py = (py||"").toLowerCase();
  const n = py.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return n ? n[0] : "#";
}
function dictRenderContent(){
  const box = document.querySelector("#sec-dict #dictContent");
  if(!box) return;
  if(!dictReady()){
    box.innerHTML = `<div class="dict-empty">字典数据未加载，请确认 dict.js 与本页在同一目录~</div>`;
    return;
  }
  let html = "";
  if(dictMode === "search"){
    if(!dictQ){
      const dc = dictDailyChar();
      html += `<div class="dict-hint">输入汉字、拼音（如 <b>ni</b>）或释义关键词查询；也可点上方标签按部首 / 笔画浏览。</div>`;
      if(dc) html += `<div style="margin-top:10px"><div class="dict-stats">🌟 今日一字（每日更新）</div>${dictCardHTML(dc)}</div>`;
    } else {
      const list = dictMatch(dictQ).slice(0,40);
      if(!list.length){
        html = `<div class="dict-empty">没找到「${escapeHtml(dictQ)}」相关的字，换个词试试~</div>`;
      } else {
        html = `<div class="dict-stats">找到 ${dictMatch(dictQ).length} 个相关字（显示前 ${list.length}）</div>` + list.map(dictCardHTML).join("");
      }
    }
  } else if(dictMode === "radical"){
    const groups = dictRadicalGroups();
    if(!dictRad){
      const keys = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
      html = `<div class="dict-stats">共 ${keys.length} 个部首</div>` + keys.map(r=>`<span class="dict-chip" onclick="dictSetRadical('${escapeHtml(r)}')">${r}<i>${groups[r].length}</i></span>`).join("");
    } else {
      const chars = groups[dictRad] || [];
      html = `<button class="pxbtn small" onclick="dictSetMode('radical')">← 返回部首索引</button><div class="dict-stats">部首「${escapeHtml(dictRad)}」共 ${chars.length} 字</div>` + chars.map(dictCardHTML).join("");
    }
  } else if(dictMode === "stroke"){
    const groups = dictStrokeGroups();
    if(dictStk === null){
      const keys = Object.keys(groups).map(Number).sort((a,b)=>a-b);
      html = `<div class="dict-stats">共 ${keys.length} 种笔画数</div>` + keys.map(n=>`<span class="dict-chip" onclick="dictSetStroke(${n})">${n}画<i>${groups[n].length}</i></span>`).join("");
    } else {
      const chars = groups[dictStk] || [];
      html = `<button class="pxbtn small" onclick="dictSetMode('stroke')">← 返回笔画索引</button><div class="dict-stats">${dictStk} 画共 ${chars.length} 字</div>` + chars.map(dictCardHTML).join("");
    }
  } else if(dictMode === "fav"){
    const favs = (S.dict.favs||[]).filter(c=>DICT[c]);
    if(!favs.length){
      html = `<div class="dict-empty">还没有收藏的字，点卡片上的「☆ 收藏」即可加入~</div>`;
    } else {
      html = `<div class="dict-stats">已收藏 ${favs.length} 字</div>` + favs.map(dictCardHTML).join("");
    }
  } else if(dictMode === "daily"){
    const dc = dictDailyChar();
    const learned = (S.dict.learned||[]).length;
    html = `<div class="dict-stats">🌟 每日一字 · 已学会 ${learned} 字 <button class="pxbtn small" style="margin-left:6px;padding:2px 8px;font-size:10px" onclick="dictRefreshDaily()">🔄 换一个</button></div>` + (dc?dictCardHTML(dc):"");
  } else if(dictMode === "alpha"){
    if(!dictAlpha){
      const cnt = dictAlphaCounts();
      const letters = Object.keys(cnt).sort();
      const total = dictReady()?Object.keys(DICT).length:0;
      html = `<div class="dict-stats">按拼音首字母浏览全部 ${total} 字（点字母展开，或点「全部」一次性展开）</div><div class="dict-alpha-index">` +
        `<span class="dict-chip dict-chip-all" onclick="dictSetAlpha('*')">全部<i>${total}</i></span>` +
        letters.map(L=>`<span class="dict-chip" onclick="dictSetAlpha('${L}')">${L.toUpperCase()}<i>${cnt[L]}</i></span>`).join("") + `</div>`;
    } else if(dictAlpha === "*"){
      const total = dictReady()?Object.keys(DICT).length:0;
      html = `<button class="pxbtn small" onclick="dictSetAlpha('')">← 返回 A-Z 索引</button><button class="pxbtn small" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 回到顶部</button>` +
        `<div class="dict-stats">全部 ${total} 字（按拼音 A→Z 分组排序，点字看详情）</div>` + dictAlphaListAll();
    } else {
      const list = dictAlphaList(dictAlpha);
      html = `<button class="pxbtn small" onclick="dictSetAlpha('')">← 返回 A-Z 索引</button><div class="dict-stats">「${dictAlpha.toUpperCase()}」开头共 ${list.length} 字（点字看详情）</div><div class="dict-alpha-grid">` +
        list.map(ch=>{ const d=DICT[ch]; return `<span class="dict-alpha-tile" onclick="dictLookup('${ch}')" title="${escapeHtml(d.py)}"><b>${ch}</b><i>${escapeHtml(d.py)}</i></span>`; }).join("") + `</div>`;
    }
  }
  // 参考来源提示
  if(dictMode === "search" && !dictQ){
    html += `<div class="dict-hint" style="margin-top:14px">本字典为<b>离线常用字精选</b>（参考《新华字典 第12版》体例整理 ${dictReady()?Object.keys(DICT).length:0} 字头）。完整版《新华字典》PDF 可在「读书」模块上传随时翻阅。</div>`;
  }
  box.innerHTML = html;
}

function dictToggleFav(ch){
  S.dict.favs = S.dict.favs || [];
  const i = S.dict.favs.indexOf(ch);
  if(i >= 0){ S.dict.favs.splice(i,1); toast("已取消收藏~"); }
  else { S.dict.favs.push(ch); toast("★ 已收藏「"+ch+"」","good"); }
  save(); dictRenderContent();
}
function dictMarkLearned(ch){
  S.dict.learned = S.dict.learned || [];
  if(S.dict.learned.includes(ch)){ toast("这个字已经学会啦~"); return; }
  S.dict.learned.push(ch);
  addXP(2);
  toast("✓ 学会「"+ch+"」 +2 EXP","good");
  save(); dictRenderContent();
}

const CAT_LINES={

  dirty:["身上黏糊糊的…想洗澡喵","喵！便便要清理啦，臭臭的","干净溜溜才舒服嘛~","白白帮我清理一下下？"],
  sick:["喵…不太舒服，想睡觉","呜…白白摸摸就不疼了","病恹恹地看着你，需要药药","喵呜，想要关心…"],
  away:["（小猫离家出走了，先照顾好它再聊喵）"],
  play:["喵！来玩球球！⚽","扑通——接住我呀！","喵呜，转圈圈 chasing~","玩累了…但好开心！"]
};
function catLine(){
  const c=S.cat; let pool;
  if(c.away) pool=CAT_LINES.away;
  else if(c.sick) pool=CAT_LINES.sick;
  else if(c.clean<=30) pool=CAT_LINES.dirty;
  else if(c.full<=30) pool=CAT_LINES.hungry;
  else if(c.mood>=70) pool=CAT_LINES.happy;
  else pool=CAT_LINES.normal;
  return pool[Math.floor(Math.random()*pool.length)];
}
function catSVG(stage, mood){
  const skin = S.cat.skin && CAT_SKINS[S.cat.skin] ? CAT_SKINS[S.cat.skin] : CAT_SKINS.newleaf;
  // 图片皮肤模式：新叶喵直接贴图
  if (S.cat.skin === "newleaf") {
    const glow = stage>=2 ? `<div style="position:absolute;inset:0;border-radius:50%;box-shadow:0 0 20px rgba(255,255,255,.5);animation:glowPulse 2s ease-in-out infinite"></div>` : "";
    const star = stage>=2 ? `<div style="position:absolute;top:2px;right:2px;font-size:14px">✨</div>` : "";
    return `<div style="position:relative;width:96px;height:96px;image-rendering:pixelated">${glow}<img src="cat_newleaf.png" style="width:88px;height:88px;position:absolute;left:4px;top:4px;object-fit:contain;image-rendering:pixelated" alt="🍃" onerror="this.style.display='none';this.parentElement.innerHTML+='<div style=width:88px;height:88px;display:flex;align-items:center;justify-content:center;font-size:40px>🍃</div>'">${star}</div>`;
  }
  const c = {
    O: skin.dark || "#4a7c23",
    G: skin.body || "#8fc04a",
    E: skin.ear || "#c8e8a0",
    L: skin.face || "#d0eab8",
    W: "#ffffff",
    P: skin.eyeR || "#d4637a",
    B: "#1a1a1e",
    N: skin.nose || "#5a9e30",
    S: skin.body || "#8fc04a"
  };
  const px = 3;
  const offX = 18;
  const offY = 18;
  const pixelMap = [
    "    OOOO    OOOO    ",
    "   OGGGOO  OOGGGO   ",
    "  OGLLLLLLLLLLLLGO  ",
    " OGLLLWPWLLLLWPWLLLGO",
    " OGLLLWPWLLLLWPWLLLGO",
    "  OGLLLLNNNNLLLLGO  ",
    "   OGLLLLNNLLLLGO   ",
    "   OOGLLLLLLLLGGO   ",
    "    OOGLLLLLGGO     ",
    "     OOGLLLGGO      ",
    "      OOGLLGO       ",
    "       OOLLOO       ",
    "        OOOO        ",
    "         OO         ",
    "         OO         ",
    "                    ",
    "                    ",
    "                    ",
    "                    ",
    "                    "
  ];
  const rects = [];
  pixelMap.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch !== ' ' && c[ch]) {
        rects.push(`<rect x="${x * px + offX}" y="${y * px + offY}" width="${px}" height="${px}" fill="${c[ch]}"/>`);
      }
    }
  });
  const glow = stage>=2 ? `<circle cx="48" cy="48" r="44" fill="none" stroke="#fff" stroke-width="1" opacity=".5"><animate attributeName="opacity" values=".3;.8;.3" dur="2s" repeatCount="indefinite"/></circle>` : "";
  const star = stage>=2 ? `<text x="70" y="30" font-size="14">✨</text>` : "";
  const eyeOffset = mood<40 ? 2 : (mood>=70 ? -1 : 0);
  const eyeShift = eyeOffset ? rects.map(r => {
    if (r.includes('fill="'+c.W+'"') || r.includes('fill="'+c.B+'"') || r.includes('fill="'+c.P+'"')) {
      return r.replace(/y="(\d+)"/, (m, y) => `y="${parseInt(y)+eyeOffset*px}"`);
    }
    return r;
  }).join("") : rects.join("");
  return `<svg viewBox="0 0 96 96" width="96" height="96" style="image-rendering:pixelated">${glow}${eyeShift}${star}</svg>`;
}
const STAGE_NAME = ["幼猫","像素猫","星辉猫"];
function renderCat(){
  const c = S.cat;
  if(c.away){ $("#catSprite").innerHTML = '<div style="font-size:40px">🏃‍♀️💨</div>'; }

      if(c.sick) html += `<button class="pxbtn small danger" onclick="App.healCat()">💊看病</button>`;

function deriveCatHealth(){
  const c=S.cat;
  if(typeof c.clean!=="number")c.clean=80;
  if(typeof c.hp!=="number")c.hp=100;
  if(!Array.isArray(c.poops))c.poops=[];
  if(typeof c.sick!=="boolean")c.sick=false;
  if(typeof c.away!=="boolean")c.away=false;
  if(c.away) return;
  // 疏忽惩罚：便便堆积 / 太饿 / 太脏 / 心情极差 → 健康下降
  if(c.poops.length>=3 || c.full<=10 || c.clean<=10 || c.mood<=10) c.hp = clamp(c.hp-3,0,100);
  // 死亡（离家）优先于回复，避免被回复分支救回
  if(c.hp<=0){ c.away=true; c.sick=false; return; }
  // 生病判定
  if(c.hp<30) c.sick=true;
  // 健康回复：仅在未生病且被照顾得好时
  else if(c.full>50 && c.clean>50 && c.mood>40 && c.poops.length===0) c.hp = clamp(c.hp+1,0,100);
}
function catTick(){
  const c=S.cat;
  if(typeof c.clean!=="number")c.clean=80;
  if(typeof c.hp!=="number")c.hp=100;
  if(!Array.isArray(c.poops))c.poops=[];
  if(typeof c.lastTick!=="string")c.lastTick="";
  const now=Date.now();
  const last=c.lastTick?new Date(c.lastTick).getTime():0;
  const mins = last?Math.floor((now-last)/60000):0;
  if(mins>=10){
    const steps=Math.min(Math.floor(mins/10),12);
    c.full=clamp(c.full-steps,0,100);
    c.clean=clamp(c.clean-steps,0,100);
    c.mood=clamp(c.mood-Math.floor(steps/2),0,100);
    c.active=clamp(c.active-steps,0,100);
    if(c.clean<50 && c.poops.length<3 && Math.random()<0.6) c.poops.push(uid());
    c.lastTick=String(now);
    deriveCatHealth();
    save();
  } else if(!c.lastTick){ c.lastTick=String(now); }
}
function xpNeed(lv){ return 100 + (lv-1)*60; }
function addXP(n){
  const oldStage = S.cat.stage;
  S.cat.xp += n;
  let need = xpNeed(S.cat.level);
  while(S.cat.xp >= need){ S.cat.xp -= need; S.cat.level++; need = xpNeed(S.cat.level); if(S.cat.level%5===0 && S.cat.stage<2){ S.cat.stage++; toast(`✨ ${S.cat.name} 进化成了「${STAGE_NAME[S.cat.stage]}」！获得纪念壁纸~`,'gold'); $("#catSprite").classList.add("catEvolve"); setTimeout(()=>$("#catSprite").classList.remove("catEvolve"),1200); } }
  S.cat.mood = clamp(S.cat.mood + Math.floor(n/5), 0, 100);
  save(); renderCat(); renderTop(); checkAchievements();
  if(S.cat.stage>oldStage){}
}
function dailyDecay(){
  // 每日小猫状态衰减（若久未互动）
  if(S.cat.lastInteract !== todayStr()){
    S.cat.full = clamp(S.cat.full-15,0,100);
    S.cat.mood = clamp(S.cat.mood-10,0,100);
    S.cat.active = clamp(S.cat.active-10,0,100);
    S.cat.clean = clamp(S.cat.clean-20,0,100);
    if(S.cat.clean<50 && S.cat.poops.length<3) S.cat.poops.push(uid());
    deriveCatHealth();
    if(S.cat.full<30) toast(`${S.cat.name} 肚子饿饿…完成几个任务喂喂它喵~`,'warn');
    if(S.cat.sick) toast(`💊 ${S.cat.name} 生病了，点「💊看病」照顾它喵~`,'warn');
    if(S.cat.away) toast(`🏃 ${S.cat.name} 伤心地离家出走了…好好照顾它能接回来`,'warn');
    save();
  }
}

function scheduleReminders(){

function svgBars(data, opt){
  opt=opt||{}; var w=opt.w||620,h=opt.h||120,pad=opt.pad||16;
  var n=data.length; if(!n) return '<div class="muted">暂无数据</div>';
  var max=Math.max.apply(null,data.map(function(d){return d.v;}).concat([1]));
  var bw=Math.max(2,Math.floor((w-pad*2)/n));
  var gap=Math.max(1,Math.floor(bw*0.18));
  var s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block;width:100%;height:auto;image-rendering:pixelated">';
  data.forEach(function(d,i){
    var bh=Math.max(1,Math.round(d.v/max*(h-pad-12)));
    var x=pad+i*bw+gap/2, y=h-pad-bh;
    s+='<rect x="'+x+'" y="'+y+'" width="'+(bw-gap)+'" height="'+bh+'" fill="'+(d.c||opt.color||'#7bc96f')+'" shape-rendering="crispEdges"></rect>';
    var step=Math.max(1,Math.ceil(n/8));
    if(opt.labels&&(i%step===0||i===n-1)) s+='<text x="'+(x+(bw-gap)/2)+'" y="'+(h-pad+10)+'" font-size="9" fill="var(--ink-dim)" text-anchor="middle">'+d.l+'</text>';
  });
  s+='<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--line)" stroke-width="1"></line>';
  s+='</svg>';
  return s;
}

function examCountdownHTML(){
  const exams=((S.exams)||[]).slice().sort((a,b)=>a.date<b.date?-1:1);

  const items = exams.length? exams.map(e=>{
    let d=Math.round((new Date(e.date)-new Date(tdy))/86400000);
    const past=d<0; d=Math.max(0,d);
    return `<span class="exam-chip ${past?'past':(d<=7?'urgent':'')}" onclick="examManage()" title="${e.date}"><b>${e.name}</b> · ${past?'已结束':d+' 天后'}</span>`;
  }).join("") : `<span class="muted">尚未设置考试，点「管理」添加</span>`;
  return `<div class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">

function addGoalStep(gid){

function toggleGoalStep(gid,i){
  const g=(S.goals||[]).find(x=>x.id===gid); if(!g)return;

function renderCal(){
  const y=calDate.getFullYear(), m=calDate.getMonth();
  $("#calTitle").textContent = `${y}.${String(m+1).padStart(2,"0")}`;
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const dows = ["日","一","二","三","四","五","六"];
  let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  for(let i=0;i<first;i++) html+=`<div class="cal-cell empty"></div>`;
  const tdy = todayStr();
  for(let d=1;d<=days;d++){
    const ds = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const mood = S.moods[ds];
    const hasTask = S.tasks.some(t=>t.date===ds && !t.done);
    const isPeriod = S.period.last && isPeriodDay(ds);
    html+=`<div class="cal-cell ${ds===tdy?'today':''}" onclick="pickMood('${ds}')">
      <div class="d">${d}</div>${hasTask?'<div class="dot"></div>':''}${mood?`<div class="mood">${mood}</div>`:''}${isPeriod?'<div class="period"></div>':''}
    </div>`;
  }
  $("#calGrid").innerHTML = html;
}
function isPeriodDay(ds){
  if(!S.period.last) return false;
  const last = new Date(S.period.last); const cur = new Date(ds);
  const diff = Math.floor((cur-last)/(86400000));
  const c = S.period.cycle;
  return diff>=0 && (diff% c)<5;
}

function addTask(){
  const raw=$("#newTask").value.trim(); if(!raw){toast("请输入任务标题~","warn");return;}

// NLP 智能解析（TickTick式自然语言输入）
function parseTaskNLP(title){
  let date=null,cat=null,detail=null;
  const tdy=new Date();
  const datePatterns=[
    [/明天/,()=>{const d=new Date(tdy);d.setDate(d.getDate()+1);return{date:d.toISOString().slice(0,10),label:"明天"};}],
    [/今天/,()=>{return{date:tdy.toISOString().slice(0,10),label:"今天"};}],
    [/后天/,()=>{const d=new Date(tdy);d.setDate(d.getDate()+2);return{date:d.toISOString().slice(0,10),label:"后天"};}],
    [/下周(\S)/,()=>{const wds={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"日":0};const d=new Date(tdy);d.setDate(d.getDate()+((wds[RegExp.$1]||1)-tdy.getDay()+7)%7+7);return{date:d.toISOString().slice(0,10),label:"下周"+RegExp.$1};}],
    [/周(\S)/,()=>{const wds={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"日":0};const d=new Date(tdy);d.setDate(d.getDate()+((wds[RegExp.$1]||1)-tdy.getDay()+7)%7);return{date:d.toISOString().slice(0,10),label:"周"+RegExp.$1};}],
    [/(\d+)月(\d+)日/,()=>{return{date:`${tdy.getFullYear()}-${String(+RegExp.$1).padStart(2,"0")}-${String(+RegExp.$2).padStart(2,"0")}`,label:RegExp.$1+"月"+RegExp.$2+"日"};}],
  ];
  for(const [re,fn] of datePatterns){
    const m=title.match(re);if(m){const r=fn();date=r.date;detail=r.label;title=title.replace(m[0],"").trim();break;}
  }
  const catPatterns=[
    [/学习|背单词|做题|刷题|复习|考试|看书|读书|英语|专升本|四级/,"学习"],
    [/工作|开会|报告|项目|客户|邮件|出差/,"工作"],
    [/跑步|健身|运动|瑜伽|散步|游泳|锻炼/,"生活"],
    [/画画|绘画|吉他|钢琴|唱歌|摄影|写生/,"兴趣"],
  ];
  for(const [re,c] of catPatterns){if(re.test(title)){cat=c;if(!detail)detail="分类:"+c;break;}}
  return {title,date,cat,detail,parsed:!!date||!!cat};
}

function renderTasks(){
  if(!document.getElementById('taskList')) return;
  const tdy=todayStr();
  let list=S.tasks.filter(t=>{
    if(taskFilter==="done") return t.done;
    if(taskFilter==="today") return t.date===tdy && !t.done;
    return !t.done;
  });
  if(taskFilterCat) list=list.filter(t=>t.cat===taskFilterCat);
  if(taskFilterTag) list=list.filter(t=>(t.tags||[]).includes(taskFilterTag));
  if(taskSearch){ const q=taskSearch.toLowerCase(); list=list.filter(t=>(t.title||"").toLowerCase().includes(q) || (t.note||"").toLowerCase().includes(q) || (t.sub||[]).some(s=>(s.t||"").toLowerCase().includes(q))); }
  curTaskList=list;
  // 智能提醒（按真实日期判断，不污染任务数据）
  const overdueNow=S.tasks.filter(t=>!t.done && t.date && t.date<tdy);
  const delayed=overdueNow.filter(t=>daysBetween(t.date,tdy)>=3);
  if(delayed.length && !S._warnedDelay){ S._warnedDelay=true; bubble(`白！「${delayed[0].title}」已经逾期${daysBetween(delayed[0].date,tdy)}天啦，今天完成奖励双倍小鱼干喵~`); }

  // === 看板视图（按优先级三列，可拖拽调整） ===
  if(taskView==="board"){
    const cols=[["🔥 紧急",2,"var(--hp,#e0563b)"],["⭐ 重要",1,"var(--warn,#e8a33d)"],["📌 普通",0,"var(--accent)"]];
    $("#taskList").innerHTML=`<div style="display:flex;gap:8px;align-items:flex-start;overflow-x:auto">${cols.map(([nm,p,cc])=>{
      const items=list.filter(t=>(t.prio||0)===p);
      return `<div style="flex:1;min-width:150px;border:2px dashed ${cc};border-radius:6px;padding:6px" ondragover="event.preventDefault()" ondrop="dropPrio(event,${p})">
        <div class="sub" style="color:${cc};margin:0 0 6px">${nm}（${items.length}）</div>
        ${items.map(t=>`<div class="qitem" draggable="true" ondragstart="event.dataTransfer.setData('id','${t.id}')" style="margin-bottom:4px">
          <span style="cursor:pointer" onclick="toggleTask('${t.id}')">${t.done?'☑':'☐'}</span> ${t.title}
          ${t.date&&t.date<tdy&&!t.done?`<span style="color:var(--hp);font-size:10px">⏰${daysBetween(t.date,tdy)}天</span>`:""}
          ${t.tags&&t.tags.length?t.tags.map(tg=>`<span class="tag" style="font-size:9px">#${tg}</span>`).join(""):""}
        </div>`).join("")||'<div class="muted" style="font-size:11px">空</div>'}
      </div>`;
    }).join("")}</div><div class="muted" style="margin-top:6px">拖拽卡片到其他列可调整优先级</div>`;
    return;
  }

  // === 按分类分组折叠 ===
  const cats=[...new Set(list.map(t=>t.cat))].sort();
  // 默认全部展开
  if(!window._foldState) window._foldState={};
  let html='';
  if(list.length===0){ html='<div class="muted">这里空空如也~</div>'; }
  else {
    const overdueN=list.filter(t=>t.date&&t.date<tdy&&!t.done).length;
    const todayN=list.filter(t=>t.date===tdy&&!t.done).length;
    html += `<div class="muted" style="margin-bottom:6px">📊 待办 ${list.length} · 今日到期 ${todayN} · 逾期 ${overdueN}${taskFilterTag?` · 🏷️#${taskFilterTag}`:''}</div>`;
    if(taskFilterTag) html += `<div class="muted" style="margin-bottom:6px">🏷️ 按标签「#${taskFilterTag}」筛选 <a onclick="taskFilterTag='';renderTasks()" style="cursor:pointer;color:var(--accent)">✕清除</a></div>`;
    cats.forEach(cat=>{
      const items=list.filter(t=>t.cat===cat);
      const folded=window._foldState[cat]||false;
      html+=`<div class="task-group">
        <div class="task-group-head" onclick="toggleFold('${cat}')">
          <span class="fold-arrow">${folded?'▶':'▼'}</span>
          <span class="tag" style="margin-right:6px">${cat}</span>
          <span class="muted" style="font-size:10px">${items.length}项</span>
          <span style="flex:1"></span>
          <span class="muted" style="font-size:10px">${items.filter(t=>t.prio>=2).length}紧急</span>
        </div>
        <div class="task-group-body" style="display:${folded?'none':'block'}">
          ${items.map(t=>renderOneTask(t)).join("")}
        </div>
      </div>`;
    });
  }
  $("#taskList").innerHTML = html;
  // 智能提醒（基于真实逾期天数，不再依赖被污染的 t.delayed 字段）
  if(delayed.length && !S._warnedDelay){ S._warnedDelay=true; bubble(`白！「${delayed[0].title}」已经逾期${daysBetween(delayed[0].date,tdy)}天啦，今天完成奖励双倍小鱼干喵~`); }
}
function toggleFold(cat){
  window._foldState=window._foldState||{};
  window._foldState[cat]=!window._foldState[cat];
  renderTasks();
}
function renderOneTask(t){

    <div class="cb ${t.done?'on':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</div>

        ${t.tags&&t.tags.length?t.tags.map(tg=>`<span class="tag" style="background:var(--accent);color:#1a1020;font-size:10px;cursor:pointer" onclick='taskFilterTag=${JSON.stringify(tg)};renderTasks()'>#${escapeHtml(tg)}</span>`).join(""):""}
        ${t.date&&t.date<tdy?`<span style="color:var(--hp)">⏰逾期${daysBetween(t.date,tdy)}天</span>`:(t.date===tdy?`<span style="color:var(--warn)">⏰今日到期</span>`:"")}
      </div>
      ${subTotal?`<div class="subprog"><span>✅ ${subDone}/${subTotal} · ${subPct}%</span><div style="margin-top:4px;height:6px;background:var(--line);border:1px solid #000"><i style="display:block;height:100%;width:${subPct}%;background:var(--accent)"></i></div></div><div class="subtask">${t.sub.map((s,i)=>`<div><span style="cursor:pointer" onclick="toggleSub('${t.id}',${i})">${s.done?'☑':'☐'}</span> ${s.t}</div>`).join("")}</div>`:""}
      ${t.note?`<div class="tnote muted" style="white-space:pre-wrap;margin-top:4px;font-size:11px">📝 ${escapeHtml(t.note)}</div>`:""}
      <div class="muted"><a onclick="addSub('${t.id}')" style="cursor:pointer;color:var(--accent)">+子任务</a> · <a onclick="splitTask('${t.id}')" style="cursor:pointer;color:var(--accent)">一键拆解</a> · <a onclick="excerptTask('${t.id}')" style="cursor:pointer;color:var(--accent)">摘录</a></div>

    <button class="del-big" onclick="delTask('${t.id}')" title="删除任务">✕</button>
  </div>`;

function splitTask(id){

/* 习惯 */
function addHabit(){ openHabitEditor(''); }
function ensureHabit(h){ if(typeof h.strength!=='number')h.strength=0; if(typeof h.grace!=='number')h.grace=0; if(typeof h.skips!=='number')h.skips=0; if(typeof h.weekCount!=='number')h.weekCount=0; if(typeof h.weekStreak!=='number')h.weekStreak=0; if(!h.freq)h.freq="daily"; if(!h.icon)h.icon="🎯"; if(!h.unit)h.unit="天"; }
function habitToggle(id){ const h=S.habits.find(x=>x.id===id); if(!h)return; ensureHabit(h); const tdy=todayStr(); if(h.last===tdy){ h.last=""; h.streak=Math.max(0,h.streak-1); h.history[tdy]=false; if(h.counts)delete h.counts[tdy]; if(h.freq==="weekly"&&h.weekCount>0)h.weekCount--; h.strength=clamp(h.strength-2,0,100); } else { if(h.freq!=="weekly" && h.last){ const yd=new Date(); yd.setDate(yd.getDate()-1); if(h.last!==yd.toISOString().slice(0,10)) h.streak=0; } if(h.freq!=="weekly") h.streak++; h.last=tdy; h.history[tdy]=true; h.counts=h.counts||{}; h.counts[tdy]=1; if(h.freq==="weekly") h.weekCount++; h.strength=clamp(h.strength+(h.freq==="weekly"?3:4)+(h.freq==="weekly"?0:h.streak*0.4),0,100); h.skips=0; h._atRisk=false; habitRecordHour(h); const mult=habitMult(h); addXP(Math.round(5*mult)); S.cat.fish++; toast(`打卡成功！💪强度${Math.round(h.strength)}%`+(mult>1?` · ⚡倍率x${mult.toFixed(1)} +${Math.round(5*mult)}EXP`:"")+(h.freq==="weekly"?` · 本周${h.weekCount}/${h.weekTarget||3}`:` · 连续${h.streak}${h.unit||'天'}`),"good"); habitChainRemind(h); } save(); renderHabits(); checkAchievements(); }
/* 连签倍率：连续越久经验越多（上限x2） */
function habitMult(h){ const s=h.freq==="weekly"?(h.weekStreak||0)*7:(h.streak||0); return Math.min(2, 1+Math.min(s,20)*0.05); }
/* 同日多次打卡 +1 */
function habitPlusOne(id){ const h=habitFind(id); if(!h)return; ensureHabit(h); const tdy=todayStr(); const done=h.log?!!h.log[tdy]:h.last===tdy; if(!done){ toast("先完成今天的第一次打卡喵~","warn"); return; } h.counts=h.counts||{}; h.counts[tdy]=(h.counts[tdy]||1)+1; h.strength=clamp(h.strength+0.5,0,100); addXP(1); save(); if(curMod==="health")R.health(); else renderHabits(); toast(`「${h.name}」今日第 ${h.counts[tdy]} 次！+1EXP`,"good"); }
/* 打卡意图备注（当日小目标） */
function habitIntent(id){ const h=habitFind(id); if(!h)return; const tdy=todayStr(); const cur=(h.intent&&h.intent.date===tdy)?h.intent.txt:""; const t=prompt("今天的小目标（如：只做10个）：",cur); if(t===null)return; h.intent={date:tdy,txt:t.trim()}; save(); if(curMod==="health")R.health(); else renderHabits(); if(t.trim())toast("🎯 已记下今日意图~","good"); }
/* 习惯堆叠：设置前置习惯 */
function habitChainSet(id){ const h=habitFind(id); if(!h)return; const all=[...S.habits,...(S.health.customHabits||[])].filter(x=>x.id!==id); if(!all.length){toast("还没有其他习惯可以堆叠喵~","warn");return;} const names=all.map((x,i)=>`${i+1}.${x.name}`).join(" / "); const v=prompt(`「${h.name}」在哪个习惯之后做？输入编号（0=取消堆叠）\n${names}`); if(v===null)return; const n=parseInt(v); if(!n||n<1||n>all.length){ delete h.after; save(); toast("已取消堆叠~","good"); } else { h.after=all[n-1].id; save(); toast(`⛓️ 已设置：「${all[n-1].name}」之后做「${h.name}」`,"good"); } if(curMod==="health")R.health(); else renderHabits(); }
/* 打卡后链式提醒下一个习惯 */
function habitChainRemind(h){ const next=[...S.habits,...(S.health.customHabits||[])].find(x=>x.after===h.id); if(next){ const tdy=todayStr(); const nd=next.log?!!next.log[tdy]:next.last===tdy; if(!nd) setTimeout(()=>notify(`⛓️ 链式提醒：「${h.name}」完成了，接着做「${next.name}」吧喵~`),900); } }
/* 记录打卡时段 + 最佳时段建议 */
function habitRecordHour(h){ h.hours=h.hours||[]; h.hours.push(new Date().getHours()); if(h.hours.length>60)h.hours=h.hours.slice(-60); }
function habitBestHour(h){ if(!h.hours||h.hours.length<5)return null; const cnt={}; h.hours.forEach(x=>cnt[x]=(cnt[x]||0)+1); const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]; return +best[0]; }
function delHabit(id){ S.habits=S.habits.filter(x=>x.id!==id); save(); renderHabits(); }
function renderHabits(){
  const tdy=todayStr();
  const html=S.habits.length?S.habits.map(h=>{
    ensureHabit(h);
    const done=h.last===tdy;
    const rate=Object.values(h.history).filter(Boolean).length;
    const freqTxt=h.freq==="weekly"?`📅每周${h.weekTarget||3}`:`🔥${h.streak}${h.unit||'天'}`;
    const sub=h.freq==="weekly"?`<div class="muted">本周 ${h.weekCount||0}/${h.weekTarget||3} 次 · 🔥连${h.weekStreak||0}周</div>`:"";
    const cnt=(h.counts&&h.counts[tdy])||0;
    const intent=(h.intent&&h.intent.date===tdy&&h.intent.txt)?`<div class="muted" style="color:var(--accent)">🎯 ${h.intent.txt}</div>`:"";
    const afterH=h.after?habitFind(h.after):null;
    const bh=habitBestHour(h);
    return `<div class="habit-card"><div class="top"><div><b>${h.icon||'🎯'} ${h.name}</b> <span class="streak">${freqTxt}</span>${cnt>1?` <span class="tag" style="background:var(--accent);color:#1a1020">x${cnt}</span>`:""}</div><div><button class="pxbtn small ${done?'primary':''}" onclick="habitToggle('${h.id}')">${done?'✓已打卡':'打卡'}</button>${done?` <button class="pxbtn small" onclick="habitPlusOne('${h.id}')" title="同日多次">＋1</button>`:""} <button class="del" onclick="delHabit('${h.id}')">✕</button> <button class="del" style="color:var(--ink-dim)" title="编辑图标/单位" onclick="openHabitEditor('${h.id}')">✎</button></div></div>
    ${sub}${intent}${afterH?`<div class="muted">⛓️ 在「${afterH.name}」之后</div>`:""}
    <div class="bar" style="margin-top:6px"><i style="width:${Math.min(h.streak*10,100)}%"></i></div><div class="bar str" style="margin-top:4px"><i style="width:${Math.round(h.strength)}%"></i></div><div class="muted">累计打卡${rate}次 · 💪强度${Math.round(h.strength)}%${bh!==null?` · ⏱️常在${bh}点打卡`:""}${h._atRisk?' · ⚠️今天还没打卡':''}</div>
    <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap"><button class="pxbtn small" onclick="habitFreqCycle('${h.id}')">${h.freq==="weekly"?("📅每周"+(h.weekTarget||3)):"📅每天"}</button><button class="pxbtn small" onclick="habitGraceCycle('${h.id}')">🛡️宽恕${h.grace||0}</button><button class="pxbtn small" onclick="habitIntent('${h.id}')">🎯意图</button><button class="pxbtn small" onclick="habitChainSet('${h.id}')">⛓️堆叠</button></div></div>`;
  }).join(""):'<div class="muted">还没有习惯，添加一个吧~</div>';
  $("#habitList").innerHTML=html;
}

function habitFind(id){ return S.habits.find(x=>x.id===id)||(S.health.customHabits||[]).find(x=>x.id===id); }
/* ===== 21天习惯挑战 ===== */
function habitDoneOn(h,ds){ if(h.log)return !!h.log[ds]; return h.last===ds; }
function addChallenge21(){
  const all=[...S.habits,...(S.health.customHabits||[])];
  if(!all.length){ toast("先创建一个习惯喵~","warn"); return; }
  const menu=all.map((h,i)=>`${i+1}. ${h.name}`).join("\n");
  const pick=prompt("选择要挑战21天的习惯（输入编号）：\n"+menu);
  if(!pick)return;
  const h=all[parseInt(pick)-1];
  if(!h){ toast("编号不对喵~","warn"); return; }
  if(!S.challenges)S.challenges=[];
  if(S.challenges.some(c=>c.habitId===h.id&&c.status==="doing")){ toast("这个习惯已经在挑战中啦~","warn"); return; }
  S.challenges.push({id:uid(),habitId:h.id,habitName:h.name,start:todayStr(),status:"doing"});
  save(); R.health(); toast(`🏔️ 21天挑战开始！从今天起连续打卡「${h.name}」`,"gold");
}
function challengeEval(c){
  // 返回 {day, missed} —— day: 已坚持天数(从start到今天连续)，missed: 是否断签
  const h=habitFind(c.habitId);
  if(!h)return {day:0,missed:true};
  const start=new Date(c.start+"T00:00:00");
  const tdy=todayStr();
  let day=0, missed=false;
  for(let i=0;i<21;i++){
    const d=new Date(start.getTime()+i*86400000).toISOString().slice(0,10);
    if(d>tdy)break;
    if(habitDoneOn(h,d)){ day++; }
    else if(d<tdy){ missed=true; break; } // 过去某天没打卡=断签（今天还没打不算）
  }
  return {day,missed};
}
function checkChallenges21(){
  (S.challenges||[]).forEach(c=>{
    if(c.status!=="doing")return;
    const ev=challengeEval(c);
    if(ev.missed){ c.status="failed"; toast(`💔 21天挑战「${c.habitName}」断签了…可以重新发起喵`,"warn"); }
    else if(ev.day>=21){ c.status="done"; addXP(50); S.cat.fish+=3; toast(`🎉 21天挑战「${c.habitName}」达成！+50EXP +3🐟`,"gold"); logAction("完成21天挑战："+c.habitName,"习惯"); }
  });
  save();
}
function restartChallenge21(id){
  const c=(S.challenges||[]).find(x=>x.id===id); if(!c)return;
  c.start=todayStr(); c.status="doing";
  save(); R.health(); toast("🏔️ 挑战重新开始，这次一定行喵！","good");
}
function delChallenge21(id){
  S.challenges=(S.challenges||[]).filter(x=>x.id!==id);
  save(); R.health();
}
/* ===== 习惯推荐（AI优先，本地模板降级） ===== */
const HABIT_TEMPLATES=[

async function recommendHabits(){
  const goal=prompt("你的目标是什么？（如：减肥 / 考研上岸 / 每月存2000 / 学会画画）");
  if(!goal)return;
  let recs=null, src="模板";
  if(S.ai&&S.ai.key){
    toast("✨ AI正在为你定制习惯…","good");
    const r=await callAI(`用户目标：「${goal}」。请推荐4-6个每天/每周可执行的微习惯帮助达成目标。要求：每个习惯一行，10字以内，具体可打卡（如"每天喝水8杯"），不要编号不要解释，直接输出习惯列表。`);
    if(r){ recs=r.split("\n").map(s=>s.replace(/^[\d\.\-\*、\s]+/,"").trim()).filter(s=>s&&s.length<=16).slice(0,6); src="AI"; }
  }
  if(!recs||!recs.length){
    const tpl=HABIT_TEMPLATES.find(t=>t.k.some(k=>goal.includes(k)));
    recs=tpl?tpl.list:["每天专注2个番茄钟","睡前复盘5分钟","每天记录1条进展","早上先做最重要的事"];
    src=tpl?("模板·"+tpl.n):"通用模板";
  }
  openModal(`<div class="muted" style="margin-bottom:8px">目标「${escapeHtml(goal)}」 · 来源：${src}</div>
    ${recs.map(n=>`<div class="ledger-row"><span style="flex:1">⚡ ${escapeHtml(n)}</span><button class="pxbtn small primary" onclick="addRecHabit('${escapeHtml(n).replace(/'/g,"\\'")}');this.textContent='✓已添加';this.disabled=true">+添加</button></div>`).join("")}
    <div class="muted" style="margin-top:8px;font-size:10px">点击添加后会出现在「自定义习惯」里，建议一次最多养成2-3个新习惯喵~</div>`,"✨ 习惯推荐");
}
function addRecHabit(name){
  if(!S.health.customHabits)S.health.customHabits=[];
  if(S.health.customHabits.some(h=>h.name===name)||S.habits.some(h=>h.name===name)){ toast("这个习惯已经有啦~","warn"); return; }
  S.health.customHabits.push({id:uid(),name,streak:0,strength:0,freq:"daily",grace:0,skips:0,weekCount:0,weekStreak:0,log:{}});
  save(); if(curMod==="health")R.health();
  toast(`⚡ 习惯「${name}」已添加！`,"good"); logAction("添加推荐习惯："+name,"习惯");
}
function renderChallenges21(){
  checkChallenges21();
  const cs=S.challenges||[];
  if(!cs.length)return '<div class="muted" style="margin-top:8px">还没有进行中的挑战~</div>';
  return '<div style="margin-top:8px">'+cs.map(c=>{
    const ev=c.status==="doing"?challengeEval(c):null;
    const day=c.status==="done"?21:(ev?ev.day:0);
    const pct=Math.round(day/21*100);
    const dots=Array.from({length:21},(_,i)=>{
      const h=habitFind(c.habitId);
      const d=new Date(new Date(c.start+"T00:00:00").getTime()+i*86400000).toISOString().slice(0,10);
      const done=h&&habitDoneOn(h,d);
      const future=d>todayStr();
      return `<span style="width:12px;height:12px;display:inline-block;border-radius:2px;background:${done?'var(--good,#7bc96f)':future?'var(--panel2,rgba(128,128,128,.2))':(c.status==='failed'&&!done?'var(--bad,#e05561)':'var(--panel2,rgba(128,128,128,.2))')}" title="第${i+1}天 ${d}"></span>`;
    }).join("");
    const badge=c.status==="done"?'<span class="tag" style="background:var(--good,#7bc96f);color:#1a1020">🏆 达成</span>':c.status==="failed"?'<span class="tag" style="background:var(--bad,#e05561)">💔 断签</span>':`<span class="tag" style="background:var(--accent);color:#1a1020">第 ${day}/21 天</span>`;
    return `<div class="habit-card" style="margin-top:8px"><div class="top"><div><b>🏔️ ${c.habitName}</b> ${badge}</div><div>${c.status==="failed"?`<button class="pxbtn small" onclick="restartChallenge21('${c.id}')">🔄 重启</button>`:""} <button class="del" onclick="delChallenge21('${c.id}')">✕</button></div></div>
      <div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div>
      <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:6px">${dots}</div>
      <div class="muted" style="margin-top:4px;font-size:10px">开始于 ${c.start} · ${c.status==="doing"?"连续打卡到第21天即达成":c.status==="done"?"习惯已养成，继续保持喵~":"断签不可怕，重启再来！"}</div></div>`;
  }).join("")+'</div>';
}
function habitFreqCycle(id){ const h=habitFind(id); if(!h)return; ensureHabit(h); if(h.freq!=="weekly"){ h.freq="weekly"; h.weekTarget=3; h.weekCount=0; h.weekStreak=0; } else { const seq=[3,5,7,0]; let i=seq.indexOf(h.weekTarget||3); h.weekTarget=seq[(i+1)%seq.length]; if(h.weekTarget===0) h.freq="daily"; } save(); if(curMod==="health")R.health(); else renderHabits(); toast("频率："+(h.freq==="weekly"?("每周"+h.weekTarget+"次"):"每天"),"good"); }
function habitGraceCycle(id){ const h=habitFind(id); if(!h)return; ensureHabit(h); h.grace=(h.grace+1)%4; save(); if(curMod==="health")R.health(); else renderHabits(); toast("宽恕次数："+h.grace+"（允许连续跳过的天数）","good"); }

let finType="out", finFilter="all", finTagSel="";
function addRecord(){
  const amt=+$("#finAmt").value; if(!amt||amt<=0){toast("请输入有效金额~","warn");return;}
  const tag=$("#finTag").value, note=$("#finNote").value;
  const accId=$("#finAcc").value;
  const acc=(S.finance.accounts||[]).find(a=>a.id===accId);
  if(acc){
    if(finType==="out") acc.balance = Math.max(0, (acc.balance||0)-amt);
    else acc.balance = (acc.balance||0)+amt;
  }
  S.finance.records.push({id:uid(),type:finType,amt,tag,note,date:todayStr(),accId});
  $("#finAmt").value="";$("#finNote").value=""; save(); R.fin();
  if(finType==="out" && amt>100) bubble(`又花钱啦…${S.cat.name}默默记了一笔喵`);
  logAction(`${finType==="in"?"收入":"支出"}¥${amt} ${tag}${note?"·"+note:""}`,"财务");
  addXP(2);
  if(finType==="out"){
    const m=todayStr().slice(0,7);
    const cb=(S.finance.categoryBudgets||{})[tag];
    if(cb){ const spent=S.finance.records.filter(r=>r.type==="out"&&r.tag===tag&&r.date.slice(0,7)===m).reduce((a,b)=>a+b.amt,0); if(spent>cb) toast(`⚠️「${tag}」本月已超预算 ¥${(spent-cb).toFixed(0)}（预算¥${cb}）`,"warn"); }
  }
}
function addSaving(){ const a=+$("#saveAmt").value; if(!a)return; S.finance.savings.have+=a; save(); R.fin(); if(S.finance.savings.have>=S.finance.savings.goal) toast("🎉 储蓄目标达成！宝箱装满啦~","gold"); }
function setGoal(){ S.finance.savings.goal=+$("#saveGoal").value||S.finance.savings.goal; save(); R.fin(); }
function addWish(){ const n=$("#wishName").value.trim(),a=+$("#wishAmt").value; if(!n||!a)return; S.finance.wishJars.push({id:uid(),name:n,goal:a,have:0}); save(); R.fin(); }
function wishDeposit(id){ const v=+prompt("存入金额："); if(!v)return; const w=S.finance.wishJars.find(x=>x.id===id); if(w){w.have+=v; if(w.have>=w.goal){toast(`🎉「${w.name}」心愿达成！小猫拆礼盒庆祝~`,"gold"); addXP(20);} save(); R.fin();} }
function delWish(id){ S.finance.wishJars=S.finance.wishJars.filter(x=>x.id!==id); save(); R.fin(); }
function renderWish(){
  $("#wishList").innerHTML = S.finance.wishJars.length?S.finance.wishJars.map(w=>`<div class="wish-card"><div style="display:flex;justify-content:space-between"><b>🎁 ${w.name}</b><span class="muted">¥${w.have}/¥${w.goal}</span></div><div class="treasure"><i style="width:${w.have/w.goal*100}%"></i><span>${Math.round(w.have/w.goal*100)}%</span></div><div style="margin-top:6px"><button class="pxbtn small" onclick="wishDeposit('${w.id}')">💰存入</button> <button class="del" onclick="delWish('${w.id}')">✕</button></div></div>`).join(""):'<div class="muted">还没有心愿储蓄罐~</div>';
}
function renderLedger(){
  const tdy=todayStr();
  let recs=[...S.finance.records].reverse();
  if(finFilter==="week"){ const dd=new Date();dd.setDate(dd.getDate()-7); recs=recs.filter(r=>r.date>=dd.toISOString().slice(0,10)); }
  if(finFilter==="month") recs=recs.filter(r=>r.date.slice(0,7)===tdy.slice(0,7));
  if(finFilter==="year") recs=recs.filter(r=>r.date.slice(0,4)===tdy.slice(0,4));
  $("#ledger").innerHTML = recs.length?recs.map(r=>{
    const acc=(S.finance.accounts||[]).find(a=>a.id===r.accId);
    return `<div class="ledger-row ${r.type}"><span>${FIN_ICONS[r.tag]||'📝'}</span><span style="flex:1">${r.tag} ${r.note?'· '+r.note:''} ${acc?`<span class="muted">${acc.icon}${acc.name}</span>`:''}</span><span>${r.date}</span><b>${r.type==="in"?"+":"-"}¥${r.amt.toFixed(2)}</b><button class="del" onclick="delRecord('${r.id}')">✕</button></div>`;
  }).join(""):'<div class="muted">暂无记录</div>';
}
function delRecord(id){
  const r=S.finance.records.find(x=>x.id===id);
  if(r){
    const acc=(S.finance.accounts||[]).find(a=>a.id===r.accId);
    if(acc){
      if(r.type==="out") acc.balance=(acc.balance||0)+r.amt;
      else acc.balance=Math.max(0,(acc.balance||0)-r.amt);
    }
  }

}
function adjustAccount(id){
  const acc=S.finance.accounts.find(a=>a.id===id); if(!acc)return;
  const op=prompt(`「${acc.icon} ${acc.name}」当前余额 ¥${acc.balance.toFixed(2)}\n输入「+100」充值、「-50」扣款、「100」设为余额，或留空取消：`);
  if(op===null || op.trim()==="")return;
  const v=parseFloat(op.replace(/[+=]/g,''));
  if(isNaN(v))return;
  if(op.startsWith('+')) acc.balance+=v;
  else if(op.startsWith('-')) acc.balance=Math.max(0,acc.balance-v);
  else acc.balance=v;
  save(); R.fin(); toast(`已更新「${acc.name}」余额为 ¥${acc.balance.toFixed(2)}`);
}

  S.finance.records.forEach(r=>{if(r.accId===id) delete r.accId;});

}

function flipWord(){ $("#wordMean").classList.toggle("hidden"); }

function retryErr(i,sel,a){
  const err=(S.english.errs||[]).slice().reverse()[i]; if(!err)return;

}

function markReviewed(wname,ok){
  const r=S.english.review.find(x=>x.w.w===wname); if(!r)return;
  if(ok){ S.english.review=S.english.review.filter(x=>x.w.w!==wname); S.english.wrong=S.english.wrong.filter(x=>x.w!==wname); addXP(3); toast("掌握！已移出生词本 +3EXP","good"); }
  else { r.fc=(r.fc||1)+1; r.next=nextReview(r.fc); toast("下次复习："+r.next,"warn"); }
  save();
}
function markWord(ok){ const w=window._words[window._wi]; if(!w)return;
  S.english.review=S.english.review.filter(x=>x.w.w!==w.w);
  if(!ok){
    const ex=S.english.review.find(x=>x.w.w===w.w);
    const fc=ex?ex.fc+1:1;
    S.english.review.push({w,fc,next:nextReview(fc)});
    if(!S.english.wrong.find(x=>x.w===w.w)) S.english.wrong.push(w);
    save(); toast('加入生词本，按艾宾浩斯'+(ex?'再':'')+'复习~','warn');
  } else { addXP(2); toast('掌握！+2EXP','good'); }
  wordNav(1);
}

  const ws=(S.english.wrong||[]);

function speakWordText(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){ toast("朗读不可用","warn"); } }
function dictationTest(){
  const pool=(S.english.wrong&&S.english.wrong.length?S.english.wrong:pickWords(30));
  if(!pool||!pool.length){ toast("词库为空","warn"); return; }

function renderFoodNode(key,node,depth){

function ringSVG(pct, color, centerText){
  pct=Math.max(0,Math.min(100,Math.round(pct)));
  const r=34, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="92" height="92" viewBox="0 0 92 92" role="img" aria-label="${centerText}">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="#d9d2c5" stroke-width="9"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 46 46)"/>
    <text x="46" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#2a2a40">${centerText}</text>
  </svg>`;
}
function speakWord(){
  if(!window._words||!window._words.length){toast('还没有单词可朗读~','warn');return;}
  if(!('speechSynthesis' in window)){toast('当前浏览器不支持语音朗读喵~','warn');return;}
  try{ const w=window._words[window._wi]||window._words[0]; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(w.w); u.lang='en-US'; u.rate=0.9; window.speechSynthesis.speak(u);}catch(e){toast('朗读失败~','warn');}
}
function renderFinTrendSVG(){
  const tdy=todayStr(); const months=[];
  for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const ym=d.toISOString().slice(0,7);
    const inc=S.finance.records.filter(r=>r.date.slice(0,7)===ym&&r.type==='in').reduce((a,b)=>a+b.amt,0);
    const out=S.finance.records.filter(r=>r.date.slice(0,7)===ym&&r.type==='out').reduce((a,b)=>a+b.amt,0);
    months.push({ym,inc,out});}
  const maxv=Math.max(1,...months.map(m=>Math.max(m.inc,m.out)));
  const W=560,H=150,bw=16,gap=8,baseY=H-22,groupW=bw*2+gap;
  const startX=Math.max(8,(W-months.length*groupW)/2);
  let bars='';
  months.forEach((m,i)=>{const x=startX+i*groupW;const hi=m.inc/maxv*(H-38),ho=m.out/maxv*(H-38);
    bars+=`<rect x="${x.toFixed(1)}" y="${(baseY-hi).toFixed(1)}" width="${bw}" height="${hi.toFixed(1)}" fill="#2ecc71" rx="2"/>`;
    bars+=`<rect x="${(x+bw+gap).toFixed(1)}" y="${(baseY-ho).toFixed(1)}" width="${bw}" height="${ho.toFixed(1)}" fill="#e74c3c" rx="2"/>`;
    bars+=`<text x="${(x+bw+gap/2).toFixed(1)}" y="${baseY+14}" text-anchor="middle" font-size="10" fill="#6b6b6b">${m.ym.slice(2)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:560px;display:block"><rect x="6" y="2" width="10" height="10" fill="#2ecc71"/><text x="20" y="11" font-size="10" fill="#6b6b6b">收入</text><rect x="56" y="2" width="10" height="10" fill="#e74c3c"/><text x="70" y="11" font-size="10" fill="#6b6b6b">支出</text>${bars}</svg>`;
}

function moodToWeather(e){
  const m={"😊":"☀️晴","🥰":"🌈彩虹","✨":"⭐晴朗","🎨":"🎨创作","📖":"📖书香","😂":"☀️晴","😭":"🌧️大雨","🤔":"☁️多云","🥳":"🎉庆典","😋":"🍜美食","🏃":"🌬️有风","🎮":"🎮电玩夜","😴":"🌙月夜","🤗":"🌤️晴间多云","😎":"☀️烈日","🌸":"🌸花季","😢":"🌧️小雨","😡":"⛈️雷暴","🤒":"🤕不适","😐":"⛅阴转晴","🌅":"🌅清晨"};
  return m[e]||"⛅阴转晴";
}
function moodColor(e){
  if(["😊","🥰","✨","🎨","📖","😂","🥳","😋","🏃","🎮","🤗","😎","🌸","🌅"].includes(e)) return "var(--good)";

}
function moodWeatherHTML(){

function drawYearReview(cv){
  if(!cv)return; const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx)return;
  const W=360,H=680; cv.width=W; cv.height=H;
  ctx.fillStyle='#1a1020'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f5c542'; ctx.font='bold 17px monospace'; ctx.textAlign='center';
  ctx.fillText('白の像素年度回顾', W/2, 28);
  ctx.fillStyle='#fff'; ctx.font='12px monospace';
  ctx.fillText(new Date().getFullYear()+' 年', W/2, 48);
  ctx.fillStyle='#9aa6b2'; ctx.font='11px monospace'; ctx.textAlign='left';
  ctx.fillText('每月心情天气', 14, 76);
  const yr=new Date().getFullYear();
  for(let mi=0;mi<12;mi++){
    let good=0,bad=0,tot=0;
    const days=new Date(yr,mi+1,0).getDate();
    for(let d=1;d<=days;d++){ const ds=`${yr}-${String(mi+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const e=S.moods[ds]; if(!e)continue; tot++; if(["😊","🥰","✨","🎨","🌅"].includes(e))good++; else if(["😢","😡","🤒"].includes(e))bad++; }
    const x=14+mi*28;
    const hG=Math.round(good/tot*42)||0, hB=Math.round(bad/tot*42)||0;
    ctx.fillStyle='#5ec28a'; ctx.fillRect(x,140-hG,24,hG);
    ctx.fillStyle='#e06c75'; ctx.fillRect(x,140-hG-hB,24,hB);
    ctx.fillStyle='#9aa6b2'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText((mi+1), x+12, 156);
  }
  let tasksDone=(S.tasks||[]).filter(t=>t.done).length;
  let pomo=(S.pomo&&S.pomo.total)||0;
  let habits=(S.habits||[]).reduce((s,h)=>s+(h.streak||0),0);
  let gachaOwned=(S.gacha&&S.gacha.owned.length)||0;
  let futDone=(S.future&&S.future.items&&S.future.items.filter(i=>i.done).length)||0;
  const stats=[['🗡️任务',tasksDone],['🍅专注',pomo],['💪习惯连签',habits],['🐱猫Lv',S.cat.level],['🎰图鉴',gachaOwned],['✅愿望',futDone]];
  ctx.textAlign='left'; ctx.font='12px monospace';
  let sy=188; ctx.fillStyle='#f5c542'; ctx.fillText('年度数据',14,sy); sy+=20;
  stats.forEach((s,i)=>{ const x=14+(i%2)*176; const yy=sy+Math.floor(i/2)*22; ctx.fillStyle='#fff'; ctx.fillText(s[0]+' '+s[1], x, yy); });
  sy+=Math.floor(6/2)*22+16;
  ctx.fillStyle='#f5c542'; ctx.font='bold 13px monospace'; ctx.textAlign='center';
  ctx.fillText('明年也要和小猫一起加油喵~', W/2, sy+6);
  ctx.fillStyle='#9aa6b2'; ctx.font='9px monospace';
  ctx.fillText('BauW 像素自律工作台 · 本地生成', W/2, sy+26);
}

function futureTargetStr(it){
  if(it.mode==="someday") return "🌌 有生之年";
  if(it.mode==="months") return "⏳ "+(it.months||1)+" 个月内";
  if(it.mode==="date") return "🎯 "+(it.tdate||"");
  return "";
}
function futureTargetDate(it){
  if(it.mode==="date" && it.tdate) return it.tdate;
  if(it.mode==="months" && it.months){ const d=new Date(); d.setMonth(d.getMonth()+(+it.months||1)); return d.toISOString().slice(0,10); }
  return null;
}
function futureDaysLeft(it){
  const td=futureTargetDate(it); if(!td) return null;
  return Math.round((new Date(td)-new Date(todayStr()))/86400000);
}
function futureCountdown(it){
  const d=futureDaysLeft(it);
  if(d===null) return `<span class="tag" style="background:var(--panel2)">🌌 无期限</span>`;
  if(d>0) return `<span class="tag" style="background:#e7f5ff;color:#1d6fb8">还剩 ${d} 天</span>`;
  if(d===0) return `<span class="tag" style="background:#fff3cd;color:#9a6700">就是今天!</span>`;
  return `<span class="tag" style="background:#ffe3e3;color:#c0392b">已逾期 ${-d} 天</span>`;
}
function futureSortItems(list){
  const arr=list.slice();
  if(futureSort==="created") arr.sort((a,b)=>(b.created||"").localeCompare(a.created||""));
  else arr.sort((a,b)=>{
    const da=futureTargetDate(a), db=futureTargetDate(b);
    if(da&&db) return da.localeCompare(db);
    if(da&&!db) return -1;
    if(!da&&db) return 1;
    return (b.created||"").localeCompare(a.created||"");
  });
  return arr;
}
R.future=function(){
  const sec=$("#sec-future");
  const items=(S.future&&S.future.items)||[];
  const visualLists=(S.future&&S.future.visualLists)||[];
  const doing=items.filter(i=>!i.done);
  const done=items.filter(i=>i.done);
  let view=items;
  if(futureTab==="doing") view=doing;
  else if(futureTab==="done") view=done;
  const sorted=futureSortItems(view);
  const soonDue=doing.filter(i=>{const d=futureDaysLeft(i);return d!==null&&d>=0&&d<=30;}).length;
  const overdue=doing.filter(i=>{const d=futureDaysLeft(i);return d!==null&&d<0;}).length;
  const isVisual=futureTab==="visual";
  sec.innerHTML=`
    <h2 class="title">${MODULES.find(m=>m.id==="future").title} 🌠</h2>
    <div class="panel" style="text-align:center;margin-bottom:10px">
      <div style="font-family:var(--px);font-size:15px;color:var(--accent)">🌌 想做就记下来，给未来一个期限</div>
      <div style="margin-top:8px"><button class="pxbtn primary" onclick="${isVisual?'openVisualListEditor()':'openFutureEditor()'}">➕ ${isVisual?'新建直观清单':'添加未来愿望'}</button></div>
    </div>
    ${isVisual?'':`<div class="panel" style="margin-bottom:10px">
      <div class="report-line"><span>📋 共</span><b>${items.length} 件</b></div>
      <div class="report-line"><span>⚡ 进行中</span><b>${doing.length} 件</b></div>
      <div class="report-line"><span>✅ 已完成</span><b>${done.length} 件</b></div>
      <div class="report-line"><span>⏰ 30天内到期</span><b>${soonDue} 件${overdue?` <span style="color:var(--bad)">· 逾期 ${overdue} 件</span>`:""}</b></div>
    </div>`}
    <div class="filter-row" style="margin-bottom:8px">
      <span class="chip ${futureTab==='all'?'on':''}" onclick="futureSetTab('all')">全部</span>
      <span class="chip ${futureTab==='doing'?'on':''}" onclick="futureSetTab('doing')">进行中</span>
      <span class="chip ${futureTab==='done'?'on':''}" onclick="futureSetTab('done')">已完成</span>
      <span class="chip ${futureTab==='visual'?'on':''}" onclick="futureSetTab('visual')">🎨 直观</span>
      <span style="flex:1"></span>
      ${isVisual?'':`<span class="chip ${futureSort==='time'?'on':''}" onclick="futureSetSort('time')">按期限</span>
      <span class="chip ${futureSort==='created'?'on':''}" onclick="futureSetSort('created')">按添加</span>`}
    </div>
    <div class="scroll">
      ${isVisual?renderVisualLists(visualLists):(sorted.length?sorted.map(i=>futureCard(i)).join(""):'<div class="muted" style="text-align:center;padding:18px">还没有愿望，点上面「添加未来愿望」记下第一件想做的事吧~</div>')}
    </div>`;
};
function futureCard(it){
  const col=it.color||"#ff9a3c";
  const tagHtml=it.tag?`<span class="tag" style="background:${col}22;color:${col};border-color:${col}55">${escapeHtml(it.tag)}</span>`:"";
  // 进行中卡片默认折叠：只显示标题小块 + 颜色条 + 展开箭头；展开才显示期限/倒计时/备注
  if(!it.done){
    return `<div class="insp-card fut-collapsed" style="border-left:4px solid ${col};cursor:pointer" onclick="futureToggle('${it.id}')">
      <div style="display:flex;gap:6px;align-items:center">
        <div style="flex:1;font-size:14px">${escapeHtml(it.title)}</div>
        <span style="font-size:12px;color:var(--ink-dim)">▸</span>
      </div>
      <div class="fut-collapsed-body" id="futbody-${it.id}">
        <div class="meta" style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          ${tagHtml}
          <span class="tag" style="background:var(--panel2)">${futureTargetStr(it)}</span>
          ${futureCountdown(it)}
        </div>
        ${it.note?`<div class="muted" style="margin-top:5px;white-space:pre-wrap;font-size:12px">${escapeHtml(it.note)}</div>`:""}
        <div class="meta" style="margin-top:6px;font-size:11px;color:var(--ink-dim)">
          添加于 ${it.created||"?"} <a onclick="event.stopPropagation();futureDone('${it.id}')" style="color:var(--good);cursor:pointer">完成</a> <a onclick="event.stopPropagation();futureToTask('${it.id}')" style="color:var(--accent);cursor:pointer">⚔️转任务</a> <a onclick="event.stopPropagation();openFutureEditor('${it.id}')" style="color:var(--accent);cursor:pointer">✎编辑</a> <a onclick="event.stopPropagation();delFuture('${it.id}')" style="color:var(--bad);cursor:pointer">🗑删除</a>
        </div>
      </div>
    </div>`;
  }
  return `<div class="insp-card" style="border-left:4px solid ${col}">
    <div style="display:flex;gap:6px;align-items:flex-start">
      <div style="flex:1;font-size:14px;text-decoration:line-through;opacity:.6">${escapeHtml(it.title)}</div>
      <span style="color:var(--good)">✅</span>
    </div>
    <div class="meta" style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      ${tagHtml}
      <span class="tag" style="background:var(--panel2)">${futureTargetStr(it)}</span>
      <span class="tag" style="background:var(--panel2)">已于 ${it.doneDate} 完成</span>
    </div>
    ${it.note?`<div class="muted" style="margin-top:5px;white-space:pre-wrap;font-size:12px">${escapeHtml(it.note)}</div>`:""}
    <div class="meta" style="margin-top:5px;font-size:11px;color:var(--ink-dim)">
      添加于 ${it.created||"?"} <a onclick="delFuture('${it.id}')" style="color:var(--bad);cursor:pointer">🗑删除</a>
    </div>
  </div>`;
}
function futureToggle(id){
  const el=document.getElementById('futbody-'+id); if(el) el.classList.toggle('open');
  const card=el?el.closest('.fut-collapsed'):null; if(card) card.classList.toggle('open');
}
function futureSetTab(t){ futureTab=t; R.future(); }
function futureSetSort(s){ futureSort=s; R.future(); }

/* ---------- 直观清单 ---------- */
function visualProgress(list){ const a=(list.items||[]); return a.length?Math.round(a.filter(i=>i.done).length/a.length*100):0; }
function renderVisualLists(lists){
  if(!lists.length) return '<div class="muted" style="text-align:center;padding:18px">还没有直观清单，点上面「新建直观清单」创建一个吧~<br>比如：豆瓣Top250、去过的城市、100件小事…</div>';
  return lists.map(li=>{
    const pct=visualProgress(li);
    const col=li.color||"#ff9a3c";
    const preview=(li.items||[]).slice(0,8);
    return `<div class="visual-card" onclick="openVisualList('${li.id}')">
      <div class="vhead">
        <span class="vtitle" style="color:${col}">${escapeHtml(li.title)}</span>
        <span class="vpercent">${pct}%</span>
      </div>
      <div class="vbar"><i style="width:${pct}%;background:${col}"></i></div>
      <div class="visual-items">
        ${preview.length?preview.map(it=>`<span class="visual-item ${it.done?'done':''}" style="background:${col}22;border-color:${col}66;color:${col};text-decoration:none">${escapeHtml(it.t)}</span>`).join(""):'<span class="muted">暂无事件</span>'}
        ${(li.items||[]).length>8?`<span class="muted" style="font-size:12px">+${li.items.length-8}…</span>`:''}
      </div>
    </div>`;
  }).join("");
}
function openVisualList(id){
  const li=(S.future.visualLists||[]).find(x=>x.id===id); if(!li)return;
  const col=li.color||"#ff9a3c";
  const pct=visualProgress(li);
  const items=(li.items||[]);
  const html=`<div style="max-width:520px">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <h3 class="sub" style="margin:0;flex:1;color:${col}">${escapeHtml(li.title)}</h3>
      <span class="tag">${pct}%</span>
      <button class="pxbtn small" onclick="openVisualListEditor('${li.id}')">✎</button>
    </div>
    <div class="vbar" style="margin-bottom:12px"><i style="width:${pct}%;background:${col}"></i></div>
    <div class="visual-items" style="margin-bottom:12px">
      ${items.length?items.map((it,idx)=>`<span class="visual-item ${it.done?'done':''}" style="background:${col}22;border-color:${col}66;color:${col}" onclick="toggleVisualItem('${li.id}','${it.id}')">
        <span class="chk">${it.done?'✓':''}</span>${escapeHtml(it.t)}
        <a onclick="event.stopPropagation();delVisualItem('${li.id}','${it.id}')" style="margin-left:4px;color:var(--bad);font-size:11px">✕</a>
      </span>`).join(""):'<span class="muted">还没有事件，在下面添加第一个吧~</span>'}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <input type="text" id="vNewItem" placeholder="输入事件，按回车添加" style="flex:1" onkeydown="if(event.key==='Enter')addVisualItem('${li.id}')">
      <button class="pxbtn primary small" onclick="addVisualItem('${li.id}')">+添加</button>
    </div>
    <div style="text-align:right">
      <button class="pxbtn" onclick="App.closeModal()">关闭</button>
    </div>
  </div>`;
  openModal(html, li.title);
  setTimeout(()=>{const n=$("#vNewItem"); if(n)n.focus();}, 60);
}
function openVisualListEditor(id){
  const li=id?(S.future.visualLists||[]).find(x=>x.id===id):null;
  window.__visualColor=li?(li.color||"#ff9a3c"):"#ff9a3c";
  const html=`<div style="max-width:430px">
    <h3 class="sub" style="margin-top:0">${li?'✎ 编辑清单':'🎨 新建直观清单'}</h3>
    <label class="muted">清单名称</label>
    <input id="vListTitle" type="text" style="width:100%" value="${escAttr(li?li.title:'')}" placeholder="例如：豆瓣Top250电影">
    <label class="muted" style="margin-top:8px;display:block">主题色</label>
    <div id="vListColors" style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">
      ${["#ff9a3c","#4cc9f0","#9d4edd","#06d6a0","#ef476f","#ffd166","#118ab2","#f15bb5"].map(c=>`<span onclick="visualPickColor('${c}',this)" style="width:24px;height:24px;border-radius:6px;background:${c};cursor:pointer;border:2px solid ${li&&li.color===c?'#000':'transparent'}"></span>`).join("")}
    </div>
    ${li?`<label class="muted" style="margin-top:8px;display:block">批量编辑事件（每行一个，或空格/逗号分隔；[x]开头表示已完成）</label>
    <textarea id="vListBulk" rows="6" style="width:100%">${escAttr(li.items.map(i=>(i.done?'[x] ':'')+i.t).join('\n'))}</textarea>`:`<label class="muted" style="margin-top:8px;display:block">一次性加入多个事件（空格 / 逗号 / 换行 分隔皆可）</label>
    <textarea id="vListBulk" rows="6" style="width:100%" placeholder="例如：看日出 看极光 养一只猫 学吉他"></textarea>`}
    <div style="text-align:right;margin-top:10px">
      ${li?`<button class="pxbtn" style="float:left;color:var(--bad)" onclick="delVisualList('${li.id}')">🗑删除</button>`:''}
      <button class="pxbtn" onclick="App.closeModal()">取消</button>
      <button class="pxbtn primary" onclick="saveVisualList('${id||''}')">${li?'保存':'创建'}</button>
    </div>
  </div>`;
  openModal(html, li?'编辑清单':'新建直观清单');
}
function visualPickColor(c,el){ window.__visualColor=c; document.querySelectorAll('#vListColors span').forEach(s=>s.style.borderColor='transparent'); if(el) el.style.borderColor='#000'; }
function parseVisualBulk(text){
  const raw=String(text||"");
  // 多行则按行分割（保留行内空格，适合「Top Gun 壮志凌云」这类带空格的标题）
  // 单行则按空格/逗号/顿号分割（满足「一次性加多个、空格分隔」）
  const chunks = (raw.indexOf("\n")>=0||raw.indexOf("\r")>=0) ? raw.split(/\r?\n/) : raw.split(/\s+|，|,|、/);
  const out=[];
  for(let line of chunks){
    line=String(line||"").trim();
    if(!line) continue;
    const done=/^\[x\]/i.test(line);
    const t=line.replace(/^\[[ x]\]\s*/i,"").trim();
    if(t) out.push({id:uid(),t,done});
  }
  return out;
}
function saveVisualList(id){
  const title=$("#vListTitle").value.trim();
  if(!title){ toast("给清单起个名字喵~","warn"); return; }
  const color=window.__visualColor||"#ff9a3c";
  const bulk=$("#vListBulk").value||"";
  if(id){
    const li=S.future.visualLists.find(x=>x.id===id);
    if(!li)return;
    li.title=title; li.color=color;
    li.items=parseVisualBulk(bulk);
    toast("清单已更新~","good");
  } else {
    const items=parseVisualBulk(bulk);
    S.future.visualLists.push({id:uid(),title,color,items,created:todayStr()});
    toast(items.length?`清单创建成功，已加入 ${items.length} 个事件喵~`:"清单创建成功喵~","good");
  }
  save(); App.closeModal(); R.future();
}
function delVisualList(id){ if(!confirm("确定删除这个直观清单？"))return; S.future.visualLists=S.future.visualLists.filter(x=>x.id!==id); save(); App.closeModal(); R.future(); toast("已删除~","good"); }
function addVisualItem(listId){
  const inp=$("#vNewItem"); const raw=(inp.value||"").trim(); if(!raw)return;
  const li=S.future.visualLists.find(x=>x.id===listId); if(!li)return;
  const items=parseVisualBulk(raw); if(!items.length)return;
  li.items=li.items||[]; li.items.push(...items);
  inp.value='';
  save(); openVisualList(listId);
  addXP(items.length);
  toast(items.length>1?('已添加 '+items.length+' 个事件喵~'):'已添加~','good');
}
function toggleVisualItem(listId,itemId){
  const li=S.future.visualLists.find(x=>x.id===listId); if(!li)return;
  const it=li.items.find(x=>x.id===itemId); if(!it)return;
  it.done=!it.done;
  if(it.done){ addXP(2); S.cat.fish=(S.cat.fish||0)+.2; }
  save(); openVisualList(listId);
}
function delVisualItem(listId,itemId){
  const li=S.future.visualLists.find(x=>x.id===listId); if(!li)return;
  li.items=li.items.filter(x=>x.id!==itemId);
  save(); openVisualList(listId);
}

function openFutureEditor(id){
  const it=id?S.future.items.find(x=>x.id===id):null;
  const mode=it?it.mode:"date";
  window.__futColor=it?(it.color||"#ff9a3c"):"#ff9a3c";
  const html=`<div style="max-width:430px">
    <h3 class="sub" style="margin-top:0">${it?"✎ 编辑愿望":"🌠 添加未来想要完成的事"}</h3>
    <label class="muted">想完成的事（自定义名称）</label>
    <input id="futTitle" type="text" style="width:100%" value="${escAttr(it?it.title:"")}" placeholder="例如：去一次冰岛看极光">
    <label class="muted" style="margin-top:8px;display:block">完成期限</label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">
      <label class="chip ${mode==='date'?'on':''}"><input type="radio" name="futMode" value="date" ${mode==='date'?'checked':''} onchange="futModeChange()"> 🎯 具体日期</label>
      <label class="chip ${mode==='months'?'on':''}"><input type="radio" name="futMode" value="months" ${mode==='months'?'checked':''} onchange="futModeChange()"> ⏳ N个月内</label>
      <label class="chip ${mode==='someday'?'on':''}"><input type="radio" name="futMode" value="someday" ${mode==='someday'?'checked':''} onchange="futModeChange()"> 🌌 有生之年</label>
    </div>
    <div id="futDateWrap" style="margin:4px 0">${mode==='date'?`<input id="futDate" type="date" style="width:100%" value="${escAttr(it&&it.tdate?it.tdate:"")}">`:""}</div>
    <div id="futMonthsWrap" style="margin:4px 0">${mode==='months'?`<input id="futMonths" type="number" min="1" max="600" style="width:100px" value="${it&&it.months?it.months:6}"> 个月内`:""}</div>
    <label class="muted" style="margin-top:8px;display:block">分类标签（可选，自由填）</label>
    <input id="futTag" type="text" style="width:100%" value="${escAttr(it&&it.tag?it.tag:"")}" placeholder="如：旅行 / 学习 / 存钱 / 生活">
    <label class="muted" style="margin-top:8px;display:block">主题色</label>
    <div id="futColors" style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">
      ${["#ff9a3c","#4cc9f0","#9d4edd","#06d6a0","#ef476f","#ffd166","#118ab2","#f15bb5"].map(c=>`<span onclick="futPickColor('${c}',this)" style="width:24px;height:24px;border-radius:6px;background:${c};cursor:pointer;border:2px solid ${it&&it.color===c?'#000':'transparent'}"></span>`).join("")}
    </div>
    <label class="muted" style="margin-top:8px;display:block">备注（可选）</label>
    <textarea id="futNote" rows="3" style="width:100%">${escAttr(it&&it.note?it.note:"")}</textarea>
    <div style="text-align:right;margin-top:10px">
      <button class="pxbtn" onclick="App.closeModal()">取消</button>
      <button class="pxbtn primary" onclick="saveFuture('${id||''}')">${it?"保存":"添加"}</button>
    </div>
  </div>`;
  openModal(html, it?"编辑愿望":"未来想要完成事");
}
function futModeChange(){
  const m=document.querySelector('input[name=futMode]:checked').value;
  $("#futDateWrap").innerHTML = m==='date'?`<input id="futDate" type="date" style="width:100%">`:"";
  $("#futMonthsWrap").innerHTML = m==='months'?`<input id="futMonths" type="number" min="1" max="600" style="width:100px" value="6"> 个月内`:"";
}
function futPickColor(c,el){ window.__futColor=c; document.querySelectorAll('#futColors span').forEach(s=>s.style.borderColor='transparent'); if(el) el.style.borderColor='#000'; }
function saveFuture(id){
  const title=$("#futTitle").value.trim();
  if(!title){ toast("先写想完成的事喵~","warn"); return; }
  const mode=document.querySelector('input[name=futMode]:checked').value;
  const tag=$("#futTag").value.trim();
  const note=$("#futNote").value.trim();
  const color=window.__futColor||"#ff9a3c";
  let months=null, tdate="";
  if(mode==="months"){ months=Math.max(1,Math.min(600, parseInt($("#futMonths").value,10)||6)); }
  if(mode==="date"){ tdate=$("#futDate").value; if(!tdate){ toast("选个目标日期吧~","warn"); return; } }
  if(id){
    const it=S.future.items.find(x=>x.id===id);
    if(it){ it.title=title; it.mode=mode; it.months=months; it.tdate=tdate; it.tag=tag; it.note=note; it.color=color; }
    toast("已更新~","good");
  } else {
    S.future.items.push({id:uid(),title,mode,months,tdate,tag,note,color,created:todayStr(),done:false,doneDate:""});
    toast("愿望已记下，未来加油喵~","good");
  }
  save(); App.closeModal(); R.future();
}
function delFuture(id){ if(!confirm("确定删除这件愿望？"))return; S.future.items=S.future.items.filter(x=>x.id!==id); save(); R.future(); toast("已删除~","good"); }
function futureDone(id){
  const it=S.future.items.find(x=>x.id===id); if(!it)return;
  it.done=true; it.doneDate=todayStr();
  addXP(8); S.cat.fish=(S.cat.fish||0)+1;
  save(); R.future(); confettiBurst(); toast("🎉 完成一件未来愿望！+8EXP +1🐟","gold");
}
// 「转成任务」：把未来愿望拆成可执行任务（可分解步骤 + 目标日）
function futureToTask(id){
  const it=S.future.items.find(x=>x.id===id); if(!it)return;
  const tdate=futureTargetDate(it)||"";
  const html=`<div style="max-width:440px">
    <h3 class="sub" style="margin-top:0">⚔️ 把愿望拆成任务</h3>
    <p class="muted" style="margin:4px 0 10px">「${escapeHtml(it.title)}」</p>

// 完成撒花特效（像素方块/星星，轻量 canvas）
function confettiBurst(){
  try{
    if(document.getElementById("__confetti")) document.getElementById("__confetti").remove();
    const c=document.createElement("canvas");
    c.id="__confetti"; c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:9999;width:100%;height:100%";
    document.body.appendChild(c);
    const ctx=c.getContext("2d");
    c.width=innerWidth; c.height=innerHeight;
    const colors=["#ff9a3c","#4cc9f0","#9d4edd","#06d6a0","#ef476f","#ffd166","#f15bb5","#118ab2"];
    const cx=c.width/2, cy=c.height*0.42;
    const parts=[];
    for(let i=0;i<140;i++){
      const a=Math.random()*Math.PI*2, sp=2+Math.random()*6;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,s:5+Math.random()*9,
        rot:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.35,col:colors[(Math.random()*colors.length)|0],
        star:Math.random()<0.5,life:0});
    }
    let frame=0;
    function draw(){
      ctx.clearRect(0,0,c.width,c.height);
      let alive=false;
      for(const p of parts){
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.vx*=0.99; p.rot+=p.vr; p.life++;
        if(p.y<c.height+20) alive=true;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col;
        if(p.star){ ctx.fillRect(-p.s/2,0,p.s,2); ctx.fillRect(0,-p.s/2,2,p.s); ctx.fillRect(-p.s/3,-p.s/3,p.s/1.5,p.s/1.5); }
        else { ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); }
        ctx.restore();
      }
      frame++;
      if(alive && frame<300) requestAnimationFrame(draw); else c.remove();
    }
    draw();
  }catch(e){}
}

/* ============================================================
   30天一致性趋势（习惯完成率 + 任务完成数 折线）
   ============================================================ */
function renderTrend30(){
  const days=[]; 
  for(let i=29;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().slice(0,10);
    const habitTotal=S.habits.length+(S.health.customHabits||[]).length;
    const habitDone=habitChecksOn(ds);
    const tasksDone=S.tasks.filter(t=>t.done&&t.date===ds).length;
    days.push({ds,hr:habitTotal?Math.min(habitDone/habitTotal,1):0,td:tasksDone});
  }
  const W=560,H=120,pad=6;
  const maxT=Math.max(...days.map(d=>d.td),1);
  const px=i=>pad+i*(W-2*pad)/29;
  const hy=v=>H-pad-v*(H-2*pad);
  const ty=v=>H-pad-(v/maxT)*(H-2*pad);
  const habitPts=days.map((d,i)=>`${px(i).toFixed(1)},${hy(d.hr).toFixed(1)}`).join(" ");
  const taskPts=days.map((d,i)=>`${px(i).toFixed(1)},${ty(d.td).toFixed(1)}`).join(" ");
  const avg=Math.round(days.reduce((a,d)=>a+d.hr,0)/30*100);
  const tSum=days.reduce((a,d)=>a+d.td,0);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;background:var(--input-bg);border-radius:6px">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)" stroke-width="1"/>
    <polyline points="${habitPts}" fill="none" stroke="#9d4edd" stroke-width="2"/>
    <polyline points="${taskPts}" fill="none" stroke="#4cc9f0" stroke-width="2" stroke-dasharray="4 3"/>
    ${days.map((d,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${hy(d.hr).toFixed(1)}" r="2" fill="#9d4edd"><title>${d.ds} 习惯${Math.round(d.hr*100)}% / 任务${d.td}个</title></circle>`).join("")}
  </svg>
  <div class="muted" style="margin-top:4px"><span style="color:#9d4edd">━ 习惯完成率</span>（30天均值 ${avg}%）　<span style="color:#4cc9f0">┅ 任务完成数</span>（共 ${tSum} 个）</div>`;
}

/* ============================================================
   跨维度相关性洞察（Pearson）
   ============================================================ */
function moodScore(m){ const map={"😂":5,"🥳":5,"✨":5,"🥰":5,"😊":4,"🎨":4,"📖":4,"😋":4,"🏃":4,"🎮":4,"🤗":4,"😎":4,"🌸":4,"🙂":3,"🤔":3,"😐":3,"😴":2,"😢":1,"😭":1,"😡":1,"🤒":1}; return map[m]||null; }
function pearson(xs,ys){
  const n=xs.length; if(n<7)return null;
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); dx+=(xs[i]-mx)**2; dy+=(ys[i]-my)**2; }
  if(!dx||!dy)return null;
  return num/Math.sqrt(dx*dy);
}
function renderCorrelations(){
  const pairs=[]; // [名称A,名称B,取值函数A,取值函数B]
  const getSleep=ds=>{const s=S.health.sleep[ds];return s?calcSleep(s.bed,s.wake):null;};
  const getWater=ds=>S.health.water[ds]??null;
  const getMood=ds=>S.moods[ds]?moodScore(S.moods[ds]):null;
  const getTasks=ds=>S.tasks.filter(t=>t.done&&t.date===ds).length;
  const getHabits=ds=>habitChecksOn(ds);
  const defs=[["😴睡眠时长","⚔️任务完成",getSleep,getTasks],["😊心情","✅习惯打卡",getMood,getHabits],["💧饮水","😊心情",getWater,getMood],["😴睡眠时长","😊心情",getSleep,getMood]];
  const out=[];
  defs.forEach(([na,nb,fa,fb])=>{
    const xs=[],ys=[];
    for(let i=0;i<30;i++){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().slice(0,10);
      const a=fa(ds),b=fb(ds); if(a!==null&&b!==null){xs.push(a);ys.push(b);} }
    const r=pearson(xs,ys);
    if(r!==null&&Math.abs(r)>=0.25){
      const strong=Math.abs(r)>=0.5;
      out.push(`<div class="advice">${r>0?"📈":"📉"} <b>${na}</b> 与 <b>${nb}</b> ${r>0?"正相关":"负相关"}（r=${r.toFixed(2)}${strong?" · 明显":""}）${r>0?`——${na}越好，${nb}往往越好`:`——两者此消彼长，值得留意`}</div>`);
    }
  });
  return out.length?out.join(""):'<div class="muted">数据还不够多（需两类数据同时记录≥7天），继续记录睡眠/心情/饮水，规律会自己浮现喵~</div>';
}

function weeklyStats(){

  const spend=S.finance.records.filter(r=>r.type==="out"&&days.includes(r.date)).reduce((a,b)=>a+b.amt,0);
  const income=S.finance.records.filter(r=>r.type==="in"&&days.includes(r.date)).reduce((a,b)=>a+b.amt,0);
  const moods=days.map(ds=>S.moods[ds]).filter(Boolean);
  const pomo=S.pomo.stats.week||0;
  const sleeps=days.map(ds=>{const s=S.health.sleep[ds];return s?calcSleep(s.bed,s.wake):null;}).filter(x=>x!==null);
  const avgSleep=sleeps.length?(sleeps.reduce((a,b)=>a+b,0)/sleeps.length).toFixed(1):null;
  return {range:`${days[0]} ~ ${days[6]}`,tasksDone:tasksDone.length,taskTitles:tasksDone.slice(0,8).map(t=>t.title),habitChecks,spend,income,moods:moods.join(""),pomo,avgSleep,bestStreak:Math.max(0,...S.habits.map(h=>h.streak||0))};

function diaryImgHandler(input){
  const files=input.files; if(!files||!files.length)return;
  let count=0;
  Array.from(files).forEach(f=>{
    if(!f.type.startsWith('image/'))return;
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=1024; let w=img.width,h=img.height;
        if(w>max){h=h*max/w;w=max;}
        if(h>max){w=w*max/h;h=max;}
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const data=canvas.toDataURL('image/jpeg',0.78);
        const prev=$('#diaryPrev'); if(!prev)return;
        const item=document.createElement('div');
        item.className='diary-prev-item';
        item.innerHTML=`<img src="${data}"><button class="del" onclick="this.parentNode.remove()" title="移除">✕</button>`;
        item.dataset.img=data;
        prev.appendChild(item);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(f);
    count++;
  });
  input.value='';
  if(count) toast('图片已添加，可继续添加或保存~','good');
}
