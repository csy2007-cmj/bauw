function initDoodle(c){const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);c._drawing=false;c._strokes=[];c._cur=[];
  const start=e=>{e.preventDefault();c._drawing=true;const p=pos(c,e);c._cur=[p];};
  const move=e=>{if(!c._drawing)return;const p=pos(c,e);c._cur.push(p);redrawAll(c);};
  const end=()=>{if(!c._drawing)return;c._drawing=false;if(c._cur.length>1){c._strokes.push({color:$('#dColor').value,size:+$('#dSize').value,pts:c._cur.slice()});}c._cur=[];redrawAll(c);};
  c.ontouchstart=e=>start(e);c.ontouchmove=e=>move(e);c.ontouchend=end;
  c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;
}
function pos(c,e){const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};}
function redrawAll(c){const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);c._strokes.forEach(s=>{if(s.pts.length<2)return;ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.pts[0].x,s.pts[0].y);for(let i=1;i<s.pts.length;i++)ctx.lineTo(s.pts[i].x,s.pts[i].y);ctx.stroke();});if(c._cur.length>1){const last=c._strokes.length?c._strokes[c._strokes.length-1]:{color:$('#dColor').value,size:+$('#dSize').value};ctx.strokeStyle=last.color;ctx.lineWidth=last.size;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(c._cur[0].x,c._cur[0].y);for(let i=1;i<c._cur.length;i++)ctx.lineTo(c._cur[i].x,c._cur[i].y);ctx.stroke();}}
function dClear(){const c=document.getElementById('dCanvas');if(c){c._strokes=[];c._cur=[];const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);}}
function dUndo(){const c=document.getElementById('dCanvas');if(!c||!c._strokes.length)return;c._strokes.pop();redrawAll(c);}
function closeDoodle(){const bg=document.getElementById('doodleBg');if(bg)bg.classList.remove('show');}
function dSave(){const c=document.getElementById('dCanvas');if(!c)return;if(!c._strokes||!c._strokes.length){toast('画布是空的~','warn');return;}const data=c.toDataURL('image/png');const prev=$('#diaryPrev');if(!prev)return;const item=document.createElement('div');item.className='diary-prev-item';item.innerHTML=`<img src="${data}"><button class="del" onclick="this.parentNode.remove()" title="移除">✕</button>`;item.dataset.img=data;prev.appendChild(item);closeDoodle();toast('涂鸦已加入待保存列表~','good');}
function insertTable(){const ta=$('#diaryContent');if(!ta)return;const tpl='\n| 列1 | 列2 | 列3 |\n|---|---|---|\n|  |  |  |\n|  |  |  |\n';const s=ta.selectionStart||ta.value.length,e=ta.selectionEnd||ta.value.length;ta.value=ta.value.slice(0,s)+tpl+ta.value.slice(e);ta.focus();ta.selectionStart=ta.selectionEnd=s+tpl.length;toast('已插入表格（可编辑）~','good');}
function renderDiaryContent(text){if(!text)return'';let html=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let _mediaRec=null, _audioChunks=[], _recSR=null, _recTimer=null, _recSec=0;
function toggleRec(){ if(_mediaRec&&_mediaRec.state==='recording') stopRec(); else startRec(); }
function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('当前浏览器不支持录音喵~','warn');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    _mediaRec=new MediaRecorder(stream); _audioChunks=[];
    _mediaRec.ondataavailable=e=>{if(e.data.size)_audioChunks.push(e.data);};
    _mediaRec.onstop=()=>{
      const blob=new Blob(_audioChunks,{type:'audio/webm'});
      const reader=new FileReader();
      reader.onload=()=>{
        const base64=reader.result; const text=($('#recLiveText')||{}).value||'';
        S.voices.unshift({id:uid(),audio:base64,text,text2:'',date:todayStr(),time:new Date().toTimeString().slice(0,5),len:_recSec});
        save(); logAction('录音'+(text?'："'+text.slice(0,16)+'…"':''),'语音');
        const lt=$('#recLiveText'); if(lt)lt.value=''; const lv=$('#recLive'); if(lv)lv.classList.remove('show');
        renderVoiceList(); toast('录音已保存，可回听或转为任务~','good');
      };
      reader.readAsDataURL(blob); stream.getTracks().forEach(t=>t.stop());
    };
    _mediaRec.start(); _recSec=0; $('#recLen').textContent='0s'; $('#recLiveText').value='';
    clearInterval(_recTimer); _recTimer=setInterval(()=>{_recSec++; const el=$('#recLen'); if(el)el.textContent=_recSec+'s'; if(_recSec>=120)stopRec();},1000);
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){ _recSR=new SR(); _recSR.lang='zh-CN'; _recSR.continuous=true; _recSR.interimResults=true;
      _recSR.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript; const el=$('#recLiveText'); if(el)el.value=t;};
      _recSR.onerror=()=>{}; try{_recSR.start();}catch(e){}
    } else { toast('浏览器不支持实时转文字，仅录音；可手写补充~','warn'); }
    const btn=$('#recBtn'); btn.classList.add('recording'); btn.textContent='⏹'; $('#recLive').classList.add('show');
  }).catch(()=>toast('麦克风权限被拒绝喵~检查权限设置','warn'));
}
function stopRec(){
  if(_mediaRec&&_mediaRec.state==='recording') _mediaRec.stop();
  if(_recSR){try{_recSR.stop();}catch(e){}}
  clearInterval(_recTimer); const btn=$('#recBtn'); if(btn){btn.classList.remove('recording');btn.textContent='🎙️';}
}

const AI_PROVIDERS={
  openai:{url:"https://api.openai.com/v1/chat/completions",model:"gpt-4o-mini"},
  deepseek:{url:"https://api.deepseek.com/chat/completions",model:"deepseek-chat"},
  custom:{url:"",model:"gpt-4o-mini"}
};
async function callAI(messages, stream=false, onChunk=null){
  if(!S.ai||!S.ai.key){toast("请先在设置中配置AI API Key~","warn");return null;}
  const prov=AI_PROVIDERS[S.ai.provider]||AI_PROVIDERS.openai;
  const url=S.ai.endpoint||prov.url;
  try{
    const resp=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.ai.key},
      body:JSON.stringify({model:prov.model,messages:typeof messages==="string"?[{role:"user",content:messages}]:messages,stream:!!(stream&&onChunk),max_tokens:1024})
    });
    if(!resp.ok){const e=await resp.text();throw new Error("API错误("+resp.status+"): "+e.slice(0,150));}
    if(stream&&onChunk){
      const reader=resp.body.getReader();const dec=new TextDecoder();let buf="",full="";
      while(true){const{done,value}=await reader.read();if(done)break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split("\n");buf=lines.pop()||"";
        for(const line of lines){if(!line.trim()||!line.startsWith("data:"))continue;
          const d=line.slice(5).trim();if(d==="[DONE]")continue;
          try{const j=JSON.parse(d);const c=j.choices[0]?.delta?.content||"";full+=c;onChunk(full,c);}catch(e){}
        }
      }
      return full;
    }
    const data=await resp.json();
    return data.choices[0]?.message?.content||"";
  }catch(e){toast("AI调用失败："+(e.message||e),"warn");console.error(e);return null;}
}

function setupAIReader(){
  const area=document.getElementById("readArea");if(!area)return;
  area.onmouseup=function(){
    setTimeout(()=>{
      const sel=window.getSelection();const txt=(sel?.toString()||"").trim();
      if(txt.length<3){const old=document.getElementById("aiPopup");if(old)old.remove();return;}
      const r=sel.getRangeAt(0);const rect=r.getBoundingClientRect();
      let popup=document.getElementById("aiPopup");
      if(!popup){
        popup=document.createElement("div");popup.id="aiPopup";popup.className="ai-popup";
        document.body.appendChild(popup);
      }
      popup.innerHTML='<div class="ai-acts"><button onclick="aiExplain()">💡解释</button><button onclick="aiTranslate()">🌐翻译</button><button onclick="aiAsk()">❓提问</button><button onclick="aiSummarize()">📝摘要</button><button onclick="document.getElementById(\'aiPopup\').remove()">✕</button></div>';
      popup.style.left=Math.min(rect.left+rect.width/2-80,window.innerWidth-180)+"px";
      popup.style.top=Math.max(rect.bottom+4,40)+"px";
      popup.style.display="block";
      window._aiSelText=txt;
    },10);
  };
  document.addEventListener("mousedown",function(e){if(!e.target.closest("#aiPopup")&&!e.target.closest("#readArea")){const p=document.getElementById("aiPopup");if(p)p.remove();}});
}

          await ensureLib('epub');
          area.innerHTML='<div id="epubArea" style="min-height:420px;background:var(--input-bg);border-radius:6px"></div>';

              // 尝试blob URL方式

          r.hooks.content.register((contents)=>{const d=contents.document;d.documentElement.style.background='var(--input-bg)';d.documentElement.style.color='var(--text)';});
          if(meta.progress&&meta.progress>1.05){try{r.display(meta.progress);}catch(e){r.display();}}
          else r.display();
          meta.total=(_epubBook.spine&&_epubBook.spine.length)||meta.total; save();
          r.on('relocated',l=>{meta.progress=l.start.cfi||meta.progress;save();const info=document.getElementById('readInfo');if(info)info.textContent='进度 '+Math.round((l.start.percentage||0)*100)+'%';});
          if(window._epubKeyHandler) document.removeEventListener('keydown',window._epubKeyHandler);

function renderReadStats(){
  const rs=S.readStats||{days:{},total:0};
  const tdy=todayStr();
  const todayMin=rs.days[tdy]||0;
  // 近7天
  let week=0;
  for(let i=0;i<7;i++){ const d=new Date(Date.now()-i*86400000).toISOString().slice(0,10); week+=rs.days[d]||0; }
  const readDays=Object.keys(rs.days).length;
  const notesCnt=(S.bookNotes||[]).length;
  const doneBooks=S.books.filter(b=>b.total&&b.progress&&(typeof b.progress==="number")&&b.progress/b.total>=0.98).length;
  // 近14天迷你条形图
  let bars="";
  let maxM=10;
  const arr=[];
  for(let i=13;i>=0;i--){ const d=new Date(Date.now()-i*86400000).toISOString().slice(0,10); const m=rs.days[d]||0; arr.push({d,m}); if(m>maxM)maxM=m; }
  bars=arr.map(x=>`<div title="${x.d} · ${x.m}分钟" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:46px"><div style="height:${Math.max(x.m/maxM*44,x.m?3:1)}px;background:${x.m?'var(--accent)':'var(--panel2,rgba(128,128,128,.25))'};border-radius:2px 2px 0 0"></div></div>`).join("");
  const excCnt=(S.excerpts||[]).filter(e=>e.src==="读书").length;
  return `<div class="panel" style="margin-top:12px">
    <h3 class="sub" style="margin-top:0">📊 阅读统计</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="health-tile" style="flex:1;min-width:90px"><div class="big">${todayMin}<span style="font-size:11px">分</span></div><div class="muted">今日阅读</div></div>
      <div class="health-tile" style="flex:1;min-width:90px"><div class="big">${week}<span style="font-size:11px">分</span></div><div class="muted">近7天</div></div>
      <div class="health-tile" style="flex:1;min-width:90px"><div class="big">${rs.total>=60?(rs.total/60).toFixed(1)+"<span style='font-size:11px'>时</span>":rs.total+"<span style='font-size:11px'>分</span>"}</div><div class="muted">累计时长</div></div>
      <div class="health-tile" style="flex:1;min-width:90px"><div class="big">${readDays}<span style="font-size:11px">天</span></div><div class="muted">阅读天数</div></div>
      <div class="health-tile" style="flex:1;min-width:90px"><div class="big">${notesCnt}<span style="font-size:11px">条</span></div><div class="muted">读书笔记</div></div>
      <div class="health-tile" style="flex:1;min-width:90px"><div class="big">${doneBooks}/${S.books.length}<span style="font-size:11px">本</span></div><div class="muted">读完/藏书</div></div>
    </div>
    <div style="display:flex;gap:2px;margin-top:10px;align-items:flex-end">${bars}</div>
    <div class="muted" style="margin-top:4px;font-size:10px">近14天每日阅读分钟数 · 打开书即开始计时，返回书架/关页面自动结算${excCnt?` · 已有 ${excCnt} 条读书摘录`:""}</div>
  </div>`;
}

let CN_CITIES_FULL=[], CN_TOWNS_FULL=[];
function buildCnGeo(){
  const golden=2.39996323;
  for(const prov in CN_CITY_NAMES){
    const pp=CN_PROVINCES.find(p=>p.n===prov); if(!pp)continue;
    const names=CN_CITY_NAMES[prov]; const n=names.length;
    const R=14+Math.min(n,44)*0.62;
    names.forEach((nm,i)=>{
      const rr=n===1?0:R*Math.sqrt((i+0.5)/n);
      const ang=i*golden;
      CN_CITIES_FULL.push({n:nm,prov:prov,x:+(pp.x+Math.cos(ang)*rr).toFixed(1),y:+(pp.y+Math.sin(ang)*rr).toFixed(1)});
    });
  }
  for(const prov in CN_TOWN_NAMES){
    const pp=CN_PROVINCES.find(p=>p.n===prov); if(!pp)continue;
    const names=CN_TOWN_NAMES[prov]; const n=names.length;
    const R=11+Math.min(n,6)*1.0;
    names.forEach((nm,i)=>{
      const rr=R*Math.sqrt((i+0.5)/Math.max(n,1));
      const ang=i*1.7+0.8;
      CN_TOWNS_FULL.push({n:nm,prov:prov,x:+(pp.x+Math.cos(ang)*rr).toFixed(1),y:+(pp.y+Math.sin(ang)*rr).toFixed(1)});
    });
  }
}
buildCnGeo();

function isVisited(type,name){return (S.travel.visited||[]).some(x=>x.type===type&&x.name===name);}
function isWish(type,name){return (S.travel.wishlist||[]).some(x=>x.type===type&&x.name===name);}
function travelMark(type,name,status){
  const meta={type,name,date:todayStr()};
  if(status==='visited'){ if(!isVisited(type,name))S.travel.visited.unshift(meta); S.travel.wishlist=S.travel.wishlist.filter(x=>!(x.type===type&&x.name===name));}
  else if(status==='wish'){ if(!isWish(type,name))S.travel.wishlist.unshift(meta); S.travel.visited=S.travel.visited.filter(x=>!(x.type===type&&x.name===name));}
  else if(status==='none'){ S.travel.visited=S.travel.visited.filter(x=>!(x.type===type&&x.name===name)); S.travel.wishlist=S.travel.wishlist.filter(x=>!(x.type===type&&x.name===name));}
  if(status==='visited')addXP(type==='city'||type==='town'?5:3);
  save(); logAction('标记'+status+'：'+name,'旅行'); R.travel();
}
const TRAVEL_NOTE_TAGS=[['🍜','美食'],['🏨','住宿'],['📸','景点'],['💡','贴士'],['💭','记忆'],['🛍️','购物'],['🚗','交通'],['📝','其他']];
function travelNoteTagEmoji(tag){ const f=TRAVEL_NOTE_TAGS.find(x=>x[1]===tag); return f?f[0]:'📝'; }
function travelNoteKey(type,name){ return type+'|'+name; }
function getTravelNotes(type,name){ return (S.travel.notes && S.travel.notes[travelNoteKey(type,name)]) || []; }
function addTravelNote(type,name,t,tag){
  t=(t||'').trim(); if(!t) return false;
  S.travel.notes=S.travel.notes||{};
  const k=travelNoteKey(type,name);
  if(!S.travel.notes[k]) S.travel.notes[k]=[];
  S.travel.notes[k].push({id:uid(),t,tag:tag||'',created:todayStr()});
  save(); return true;
}
function delTravelNote(type,name,id){
  const k=travelNoteKey(type,name);
  if(S.travel.notes && S.travel.notes[k]) S.travel.notes[k]=S.travel.notes[k].filter(x=>x.id!==id);
  save();
}
function delTravelNoteById(id){
  if(!window.__td) return;
  delTravelNote(window.__td.type, window.__td.name, id);
  showTravelDetail(window.__td.type, window.__td.name, window.__td.info);
}
function addTravelNoteQuick(){
  if(!window.__td) return;
  const t=$("#tdNoteText").value;
  const tag=$("#tdTag").value;
  if(addTravelNote(window.__td.type, window.__td.name, t, tag)){
    showTravelDetail(window.__td.type, window.__td.name, window.__td.info);
  } else toast('词条内容不能为空喵~','warn');
}
function safeTxt(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showTravelDetail(type,name,info){
  if(_cnMoved){ _cnMoved=false; return; }
  window.__td={type,name,info};
  const v=isVisited(type,name), w=isWish(type,name);
  const tl={country:'🌍 国家',province:'🇨🇳 省级',city:'🏙️ 城市',town:'🏘️ 镇/名镇',custom:'📍 自定义'}[type]||'地点';
  const notes=getTravelNotes(type,name);
  const noteHtml=`
    <div class="td-notes">
      <div class="td-notes-h">📚 我的地点词条 <span class="muted">(${notes.length})</span></div>
      <div id="tdNoteList">${notes.length?notes.map(n=>`<div class="td-note"><span class="td-tag">${travelNoteTagEmoji(n.tag)}</span><span class="td-ntxt">${safeTxt(n.t)}</span><button class="del" onclick="delTravelNoteById('${n.id}')">✕</button></div>`).join(''):'<div class="muted" style="font-size:12px">还没有词条，写下你对这里的记忆、美食、攻略吧~</div>'}</div>
      <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">
        <select id="tdTag" style="width:auto;font-size:12px">${TRAVEL_NOTE_TAGS.map(t=>`<option value="${t[1]}">${t[0]} ${t[1]}</option>`).join('')}</select>
        <input type="text" id="tdNoteText" placeholder="写一条词条，如：巷口那家糖水铺" style="flex:1;min-width:120px;font-size:12px" onkeydown="if(event.key==='Enter')addTravelNoteQuick()">
        <button class="pxbtn small primary" onclick="addTravelNoteQuick()">＋添加</button>
      </div>
    </div>`;
  $("#travelDetail").innerHTML=`<div class="travel-detail"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><div><b style="font-size:15px;color:var(--accent)">${name}</b> <span class="muted">${tl}</span></div><div style="display:flex;gap:4px"><button class="pxbtn ${v?'primary':'small'}" onclick="travelMark('${type}','${name}','${v?'none':'visited'}')">${v?'✓ 已去过':'标记去过'}</button><button class="pxbtn ${w?'primary':'small'}" onclick="travelMark('${type}','${name}','${w?'none':'wish'}')">${w?'⭐ 想去中':'想去'}</button><button class="pxbtn small" onclick="$('#travelDetail').innerHTML=''">关闭</button></div></div><div class="muted" style="margin-top:6px;font-size:12px">${safeTxt(info)||''}</div>${type==='city'&&CITY_GUIDES[name]?("<button class='pxbtn small primary' style='margin-top:8px' onclick=\"openCityGuide('"+name+"')\">🗺️ 查看城市景点地图 →</button>"):''}${noteHtml}</div>`;
}
function addTravelCustom(){
  const n=prompt('自定义地点名称（如：外婆家·厦门某村）'); if(!n)return;
  const c=prompt('所属国家/省（可选）','')||'自定义';
  S.travel.customs.unshift({id:uid(),name:n,country:c,date:todayStr()});
  S.travel.visited.unshift({type:'custom',name:n,date:todayStr()});
  save(); R.travel(); toast('已点亮自定义地点：'+n,'good');
}

function allCityPois(city){
  const g=CITY_GUIDES[city]; if(!g)return[];
  const spots=(g.spots||[]).map(p=>Object.assign({},p,{grp:'spot',custom:false}));
  const tr=(g.transit||[]).map(p=>Object.assign({},p,{grp:'transit',custom:false}));
  const us=((S.travel.cityPois||{})[city])||[];
  return spots.concat(tr).concat(us.map(p=>Object.assign({},p,{grp:catGroup(p.cat),custom:true})));
}

function parseDurH(t){
  if(!t)return 1.5;
  const m=t.match(/([\d.]+)\s*-\s*([\d.]+)\s*h/); if(m)return parseFloat(m[2]);
  const m2=t.match(/([\d.]+)\s*h/); if(m2)return parseFloat(m2[1]);
  if(/一整天/.test(t))return 8; if(/半天/.test(t))return 4;
  return 1.5;
}
function planCityRoute(){
  const city=_cityGuide; if(!city)return;
  const pois=allCityPois(city).filter(q=>q.grp==='spot'&&isWish('spot',poiKey(city,q.n)));
  if(pois.length<2){toast('先把想去的景点标为 ⭐ 想去（至少2个），再来规划路线喵~','warn');return;}
  const pts=pois.slice(); const order=[];
  let cur=pts.shift(); order.push(cur);
  while(pts.length){
    let bi=0,bd=1e9;
    for(let i=0;i<pts.length;i++){const d=Math.hypot(pts[i].x-cur.x,pts[i].y-cur.y);if(d<bd){bd=d;bi=i;}}
    cur=pts.splice(bi,1)[0]; order.push(cur);
  }
  _cityRoute={city:city,pts:order};
  toast('🧭 已生成 '+order.length+' 站路线（就近排序）','good');
  R.travel();
}

let _cityPosMap=null,_cityZoom=1,_cityZX=0,_cityZY=0;
function spreadCityPois(pois){
  if(!pois||pois.length<2)return {};
  const pts=pois.map(p=>({x:p.x,y:p.y}));
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  pts.forEach(t=>{minX=Math.min(minX,t.x);maxX=Math.max(maxX,t.x);minY=Math.min(minY,t.y);maxY=Math.max(maxY,t.y);});
  const spanX=Math.max(maxX-minX,.001),spanY=Math.max(maxY-minY,.001);
  const sc=Math.min(84/spanX,84/spanY,2.6);
  const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
  pts.forEach(t=>{t.x=50+(t.x-cx)*sc;t.y=50+(t.y-cy)*sc;});
  const dmin=13.5;
  for(let it=0;it<80;it++){
    let moved=false;
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const dx=pts[j].x-pts[i].x,dy=pts[j].y-pts[i].y;
      let d=Math.hypot(dx,dy);
      if(d<dmin){
        if(d<.001){pts[j].x+=.6;pts[j].y+=.4;moved=true;continue;}
        const push=(dmin-d)/2,ux=dx/d,uy=dy/d;
        pts[i].x-=ux*push;pts[i].y-=uy*push;pts[j].x+=ux*push;pts[j].y+=uy*push;moved=true;
      }
    }
    pts.forEach(t=>{t.x=Math.max(7,Math.min(93,t.x));t.y=Math.max(8,Math.min(92,t.y));});
    if(!moved)break;
  }
  const m={};pois.forEach((p,i)=>m[p.n]=pts[i]);
  return m;
}

function cityZoomTo(z,ax,ay){

}
function cityZoomClamp(){

function bindCityMapGestures(){
  const st=document.querySelector('.city-stage');if(!st)return;
  const ptrs=new Map();let startDist=0,startZoom=1,startMid=null,moved=false,last=null,lastTap={t:0,x:0,y:0};
  const toSvg=function(x,y){const r=st.getBoundingClientRect();return{x:(x-r.left)/r.width*100,y:(y-r.top)/r.height*100};};
  st.onpointerdown=function(e){
    if(e.target.closest('.city-ctrl'))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    try{st.setPointerCapture(e.pointerId);}catch(err){}
    const a=[].slice.call(ptrs.values());
    if(a.length===2){startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startZoom=_cityZoom;startMid=toSvg((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);}
    else if(a.length===1){last={x:e.clientX,y:e.clientY};}
  };
  st.onpointermove=function(e){
    if(!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const a=[].slice.call(ptrs.values());
    if(a.length===1&&last){
      const dx=e.clientX-last.x,dy=e.clientY-last.y;
      if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
      if(moved&&_cityZoom>1.001){
        const r=st.getBoundingClientRect();
        _cityZX+=dx/r.width*100;_cityZY+=dy/r.height*100;
        cityZoomClamp();cityZoomApply();
      }
      last={x:e.clientX,y:e.clientY};
    }else if(a.length===2&&startDist>0){
      moved=true;
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      const m=toSvg((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);
      const z=Math.max(1,Math.min(10,startZoom*d/startDist));
      const wx=(startMid.x-_cityZX)/startZoom,wy=(startMid.y-_cityZY)/startZoom;
      _cityZoom=z;_cityZX=m.x-wx*z;_cityZY=m.y-wy*z;
      cityZoomClamp();cityZoomApply();
    }
  };
  const up=function(e){
    const wasSingle=ptrs.size===1;
    ptrs.delete(e.pointerId);
    if(ptrs.size<2)startDist=0;
    const a=[].slice.call(ptrs.values());
    if(a.length===1)last={x:a[0].x,y:a[0].y};else last=null;
    if(wasSingle&&!moved){
      const now=Date.now(),px=e.clientX,py=e.clientY;
      if(now-lastTap.t<330&&Math.hypot(px-lastTap.x,py-lastTap.y)<45){
        const mp=toSvg(px,py);cityZoomTo(Math.min(10,_cityZoom*2),mp.x,mp.y);lastTap={t:0,x:0,y:0};
      }else lastTap={t:now,x:px,y:py};
    }
  };
  st.onpointerup=up;st.onpointercancel=up;
  st.addEventListener('wheel',function(e){
    e.preventDefault();
    const m=toSvg(e.clientX,e.clientY);
    cityZoomTo(_cityZoom*(e.deltaY<0?1.18:1/1.18),m.x,m.y);
  },{passive:false});
  st.addEventListener('click',function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
}

/* ================= 中国地图·Canvas 平滑缩放版（对标高德交互） ================= */
/* 视图状态集中存于 cnv：scale 缩放、cx/cy 视图中心(地图坐标)、rot 旋转、tilt 倾斜(0~0.6) */
let cnv={scale:1,cx:215,cy:250,rot:0,tilt:0,tScale:1,tcx:215,tcy:250,tRot:0,tTilt:0,
  min:1,max:12,anim:false,raf:0,canvas:null,ctx:null,dpr:1,W:0,H:0,resized:false};
let _cnMoved=false;
let _cnPtr=new Map(), _cnPinch=null, _cnDrag=null, cnHit=[];

function cnLevelName(s){ return s<2.5?'🌐 全国概览':s<5?'🗺️ 省级视野':s<8?'🏙️ 市级视野':'🏘️ 镇级视野'; }
function cnMapToScreen(mx,my){
  const s=cnv.scale,c=Math.cos(cnv.rot),si=Math.sin(cnv.rot),t=cnv.tilt;
  const dx=mx-cnv.cx, dy=(my-cnv.cy)*(1-t);
  const rx=dx*c-dy*si, ry=dx*si+dy*c;
  return [cnv.W/2+rx*s, cnv.H/2+ry*s];
}
function cnScreenToMap(sx,sy){
  const s=cnv.scale,c=Math.cos(cnv.rot),si=Math.sin(cnv.rot),t=cnv.tilt;
  const rx=(sx-cnv.W/2)/s, ry=(sy-cnv.H/2)/s;
  const dx=rx*c+ry*si, dy=(-rx*si+ry*c)/(1-t);
  return [cnv.cx+dx, cnv.cy+dy];
}
function cnClampCenter(){
  const m=90; // 可选边界：限制中心不漂出地图太远
  cnv.cx=Math.max(-m,Math.min(430+m,cnv.cx));
  cnv.cy=Math.max(-m,Math.min(500+m,cnv.cy));
}
/* 以屏幕点(curX,curY)为锚点，将缩放设为绝对值 ns（缩放中心跟随手指，避免偏移） */
function cnZoomAbs(ns,curX,curY){
  ns=Math.max(cnv.min,Math.min(cnv.max,ns));
  if(ns===cnv.scale)return;
  const m=cnScreenToMap(curX,curY);
  const c=Math.cos(cnv.rot),si=Math.sin(cnv.rot),t=cnv.tilt;
  const rx=(curX-cnv.W/2)/ns, ry=(curY-cnv.H/2)/ns;
  const dx=rx*c+ry*si, dy=(-rx*si+ry*c)/(1-t);
  cnv.cx=m[0]-dx; cnv.cy=m[1]-dy; cnv.scale=ns;
  cnClampCenter();
}
function cnStartAnim(){ if(cnv.anim)return; cnv.anim=true; cnv.raf=requestAnimationFrame(cnTick); }
function cnTick(){
  const k=0.24; // 缓动系数，对标高德顺滑感
  cnv.scale+=(cnv.tScale-cnv.scale)*k;
  cnv.cx+=(cnv.tcx-cnv.cx)*k;
  cnv.cy+=(cnv.tcy-cnv.cy)*k;
  cnv.rot+=(cnv.tRot-cnv.rot)*k;
  cnv.tilt+=(cnv.tTilt-cnv.tilt)*k;
  const done=Math.abs(cnv.tScale-cnv.scale)<0.003 && Math.abs(cnv.tcx-cnv.cx)<0.4 && Math.abs(cnv.tcy-cnv.cy)<0.4 && Math.abs(cnv.tRot-cnv.rot)<0.003 && Math.abs(cnv.tTilt-cnv.tilt)<0.003;
  if(done){ cnv.scale=cnv.tScale;cnv.cx=cnv.tcx;cnv.cy=cnv.tcy;cnv.rot=cnv.tRot;cnv.tilt=cnv.tTilt; cnv.anim=false; }
  cnClampCenter(); cnDraw();
  if(cnv.anim) cnv.raf=requestAnimationFrame(cnTick);
}
function cnSetScale(s){ cnv.tScale=Math.max(cnv.min,Math.min(cnv.max,s)); cnStartAnim(); }
function cnZoomBy(factor){ cnv.tScale=Math.max(cnv.min,Math.min(cnv.max,cnv.scale*factor)); cnStartAnim(); }
function cnResetView(){ cnv.tScale=1; cnv.tcx=215; cnv.tcy=250; cnv.tRot=0; cnv.tTilt=0; cnStartAnim(); }
function cnZoomTo(mx,my,ts){ cnv.tScale=Math.max(cnv.min,Math.min(cnv.max,ts||7)); cnv.tcx=mx; cnv.tcy=my; cnv.tRot=0; cnv.tTilt=0; cnStartAnim(); }

function drawDot(ctx,p,s){
  const sp=cnMapToScreen(p.x,p.y);
  const col=p.visited?'#e74c3c':(p.type==='town'?'#8e7cc3':'#5a8ab0');
  const r=p.type==='town'?2.6:3.2;
  ctx.beginPath(); ctx.arc(sp[0],sp[1],r,0,7); ctx.fillStyle=col; ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle='#fff'; ctx.stroke();
  if(s>=3.4 && p.n){ ctx.fillStyle=p.visited?'#e74c3c':'#33485c'; ctx.font=(p.type==='town'?'8px':'9px')+' sans-serif'; ctx.textAlign='center'; ctx.fillText(p.n,sp[0],sp[1]-(r+3)); }
}
function cnDraw(){
  const ctx=cnv.ctx; if(!ctx)return;
  const W=cnv.W,H=cnv.H;
  ctx.setTransform(cnv.dpr,0,0,cnv.dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#bfe0f2'); g.addColorStop(1,'#dcefe0');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const s=cnv.scale, clusterOn=s<5.5;
  cnHit=[];
  // 省份：始终独立显示
  CN_PROVINCES.forEach(p=>{
    const sp=cnMapToScreen(p.x,p.y);
    if(sp[0]<-30||sp[0]>W+30||sp[1]<-30||sp[1]>H+30)return;
    const pVis=isVisited('province',p.n), pWish=isWish('province',p.n);
    const col=pVis?'#e74c3c':pWish?'#f0a500':'#5a8ab0';
    ctx.beginPath(); ctx.arc(sp[0],sp[1],6,0,7); ctx.fillStyle=col; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#fff'; ctx.stroke();
    if(s>=2.2){ ctx.fillStyle=pVis?'#e74c3c':'#33485c'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText(p.n,sp[0],sp[1]-9); }
    cnHit.push({x:sp[0],y:sp[1],r:9,type:'province',name:p.n,info:p.type+' · '+p.info});
  });
  // 市/镇：按层级显隐 + 低缩放聚合
  const pts=[];
  if(s>=2.4) CN_CITIES_FULL.forEach(c=>pts.push({x:c.x,y:c.y,n:c.n,type:'city',info:c.prov+' · 城市',visited:isVisited('city',c.n)}));
  if(s>=5)   CN_TOWNS_FULL.forEach(c=>pts.push({x:c.x,y:c.y,n:c.n,type:'town',info:c.prov+' · 古镇/名镇',visited:isVisited('town',c.n)}));
  if(clusterOn){
    const cell=30, grid=new Map();
    pts.forEach(p=>{ const sp=cnMapToScreen(p.x,p.y); if(sp[0]<-20||sp[0]>W+20||sp[1]<-20||sp[1]>H+20)return; p._sx=sp[0];p._sy=sp[1]; const key=Math.floor(sp[0]/cell)+'_'+Math.floor(sp[1]/cell); let a=grid.get(key); if(!a){a=[];grid.set(key,a);} a.push(p); });
    grid.forEach(arr=>{
      if(arr.length===1){ const p=arr[0]; drawDot(ctx,p,s); cnHit.push({x:p._sx,y:p._sy,r:8,type:p.type,name:p.n,info:p.info}); }
      else{
        let sx=0,sy=0; arr.forEach(p=>{sx+=p._sx;sy+=p._sy;}); sx/=arr.length; sy/=arr.length;
        const r=10+Math.min(arr.length,18)*0.7;
        ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fillStyle='rgba(90,138,176,.9)'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(arr.length,sx,sy);
        cnHit.push({x:sx,y:sy,r:r,cluster:true,mx:arr[0].x,my:arr[0].y});
      }
    });
  } else {
    pts.forEach(p=>{ const sp=cnMapToScreen(p.x,p.y); if(sp[0]<-20||sp[0]>W+20||sp[1]<-20||sp[1]>H+20)return; drawDot(ctx,p,s); if(s>=3.4) cnHit.push({x:sp[0],y:sp[1],r:7,type:p.type,name:p.n,info:p.info}); });
  }
  const lbl=document.getElementById('cnZoomLbl'); if(lbl) lbl.innerHTML='<b>'+cnLevelName(s)+'</b> · '+s.toFixed(1)+'x';
  // 全国概括（低缩放）始终标注省级名称，缩放越大字号略增、与临近点碰撞时跳过
  if(CN_PROVINCES && s<=3.2){
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    const labeled=[];
    const fs=Math.max(9, Math.min(15, 9+s*1.6));
    CN_PROVINCES.forEach(p=>{
      const sp=cnMapToScreen(p.x,p.y); if(sp[0]<-20||sp[0]>W+20||sp[1]<-20||sp[1]>H+20)return;
      const txx=sp[0], tyx=sp[1]-9;
      for(const o of labeled){ if(Math.abs(o.x-txx)<fs*1.4 && Math.abs(o.y-tyx)<fs*1.6) return; }
      labeled.push({x:txx,y:tyx});
      const vis=isVisited('province',p.n), wis=isWish('province',p.n);
      ctx.font='bold '+fs+'px sans-serif';
      ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.strokeText(p.n, txx, tyx);
      ctx.fillStyle=vis?'#e74c3c':wis?'#f0a500':'#1a2c40'; ctx.fillText(p.n, txx, tyx);
    });
  }
}
function cnInitCanvas(){
  const cv=document.getElementById('cnCanvas'); if(!cv)return;
  const wrap=cv.parentElement;
  const rect=wrap.getBoundingClientRect();
  cnv.canvas=cv; cnv.ctx=cv.getContext('2d');
  cnv.dpr=Math.min(2,window.devicePixelRatio||1);
  cnv.W=rect.width; cnv.H=rect.height;
  cv.width=Math.round(cnv.W*cnv.dpr); cv.height=Math.round(cnv.H*cnv.dpr);
  cv.onpointerdown=cnPtrDown; cv.onpointermove=cnPtrMove; cv.onpointerup=cnPtrUp; cv.onpointercancel=cnPtrUp; cv.onpointerleave=cnPtrUp; cv.onwheel=cnWheelEv;
  if(!cnv.resized){ window.addEventListener('resize',()=>{ const c=document.getElementById('cnCanvas'); if(!c)return; const r=c.parentElement.getBoundingClientRect(); cnv.W=r.width; cnv.H=r.height; c.width=Math.round(cnv.W*cnv.dpr); c.height=Math.round(cnv.H*cnv.dpr); cnDraw(); }); cnv.resized=true; }
  cnDraw();
}
function cnPtrDown(e){
  cnv.canvas.setPointerCapture(e.pointerId);
  _cnPtr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(_cnPtr.size===1){ _cnDrag={x:e.clientX,y:e.clientY,cx0:cnv.cx,cy0:cnv.cy}; _cnMoved=false; }
  else if(_cnPtr.size===2){
    const r=cnv.canvas.getBoundingClientRect(); const a=[..._cnPtr.values()][0],b=[..._cnPtr.values()][1];
    _cnPinch={dist:Math.hypot(a.x-b.x,a.y-b.y),ang:Math.atan2(b.y-a.y,b.x-a.x),mx0:(a.x+b.x)/2-r.left,my0:(a.y+b.y)/2-r.top,scale0:cnv.scale,rot0:cnv.rot,tilt0:cnv.tilt};
    _cnDrag=null; _cnMoved=true;
  }
  e.preventDefault();
}
function cnPtrMove(e){
  if(!_cnPtr.has(e.pointerId))return;
  _cnPtr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(_cnPtr.size===1 && _cnDrag){
    const dx=e.clientX-_cnDrag.x, dy=e.clientY-_cnDrag.y;
    if(Math.abs(dx)+Math.abs(dy)>3)_cnMoved=true;
    const c=Math.cos(cnv.rot), si=Math.sin(cnv.rot), t=cnv.tilt, sc=cnv.scale;
    const rx=dx/sc, ry=dy/sc;
    const dmx=rx*c+ry*si, dmy=(-rx*si+ry*c)/(1-t);
    cnv.cx=_cnDrag.cx0-dmx; cnv.cy=_cnDrag.cy0-dmy; cnClampCenter(); cnDraw();
  } else if(_cnPtr.size===2 && _cnPinch){
    const r=cnv.canvas.getBoundingClientRect(); const a=[..._cnPtr.values()][0],b=[..._cnPtr.values()][1];
    const dist=Math.hypot(a.x-b.x,a.y-b.y), ang=Math.atan2(b.y-a.y,b.x-a.x);
    const mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
    cnZoomAbs(_cnPinch.scale0*(dist/_cnPinch.dist), mx, my); // 双指中心为锚点缩放
    cnv.rot=_cnPinch.rot0+(ang-_cnPinch.ang);                 // 双指旋转
    cnv.tilt=Math.max(0,Math.min(0.6,_cnPinch.tilt0+(my-_cnPinch.my0)*0.004)); // 双指垂直拖动=倾斜
    cnDraw();
  }
  e.preventDefault();
}
function cnPtrUp(e){
  if(!_cnPtr.has(e.pointerId))return;
  _cnPtr.delete(e.pointerId);
  if(_cnPtr.size===1){ const p=[..._cnPtr.values()][0]; _cnDrag={x:p.x,y:p.y}; _cnMoved=true; }
  else if(_cnPtr.size===0){ _cnDrag=null; _cnPinch=null; if(!_cnMoved) cnHitTest(cnv.canvas,e); else _cnMoved=false; }
}
function cnHitTest(cv,e){
  const r=cv.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top;
  let best=null,bd=1e9;
  for(const h of cnHit){ const d=Math.hypot(h.x-x,h.y-y); if(d<(h.r+5) && d<bd){ bd=d; best=h; } }
  if(best){ if(best.cluster){ cnZoomTo(best.mx,best.my,Math.max(cnv.scale*1.9,7)); } else { showTravelDetail(best.type,best.name,best.info); } }
}
function cnWheelEv(e){ e.preventDefault(); const r=cnv.canvas.getBoundingClientRect(); cnZoomAbs(cnv.scale*(e.deltaY<0?1.2:1/1.2), e.clientX-r.left, e.clientY-r.top); }

/* ============================================================
   白噪音引擎
   ============================================================ */
let noiseCtx=null, noiseNode=null;
function startNoise(type){
  if(type==="none"){ stopNoise(); return; }
  stopNoise();
  try{ noiseCtx=new(window.AudioContext||window.webkitAudioContext)(); if(noiseCtx.state==='suspended'&&noiseCtx.resume)noiseCtx.resume(); }catch(e){return;}
  const sr=noiseCtx.sampleRate;
  const buf=noiseCtx.createBuffer(1,sr*2,sr);
  const d=buf.getChannelData(0);
  if(type==="rain"){ for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.15*(Math.sin(i*0.0003)*0.5+0.5); } // pink-ish
  else if(type==="forest"){ for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.08+(Math.sin(i*0.0007)*0.04); }
  else if(type==="cafe"){ for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.06+(Math.sin(i*0.0002)*0.03); }
  else if(type==="fire"){ for(let i=0;i<d.length;i++)d[i]=Math.random()*0.2*(Math.sin(i*0.0008)*0.4+0.6); }
  noiseNode=noiseCtx.createBufferSource(); noiseNode.buffer=buf; noiseNode.loop=true;
  noiseNode.connect(noiseCtx.destination); noiseNode.start();
  // animate noise visualizer
  const vis=$("#noiseVis"); if(vis) vis.innerHTML='<div class="noise-vis">'+Array.from({length:12},()=>'<div class="bar"></div>').join("")+'</div>';
  if(!window._nvInt) window._nvInt=setInterval(()=>{$$("#noiseVis .bar").forEach(b=>{b.style.height=(8+Math.random()*22)+"px"})},200);
}
function stopNoise(){
  if(noiseNode){ try{noiseNode.stop();}catch(e){} noiseNode=null; }
  if(window._nvInt){ clearInterval(window._nvInt); window._nvInt=null; }
  const vis=$("#noiseVis"); if(vis) vis.innerHTML="";
}

/* ============================================================
   体力习惯热力图
   ============================================================ */
function renderHabitHeatmap(){
  const days=182;
  const heat=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    let count=0;
    S.habits.forEach(h=>{ if(h.log&&h.log[ds]) count++; });
    S.health.customHabits&&S.health.customHabits.forEach(h=>{ if(h.log&&h.log[ds]) count++; });
    heat.push({ds,count});
  }
  const max=Math.max(1,...heat.map(h=>h.count));
  let html='<div class="heatmap">';
  heat.forEach((h,i)=>{
    const lvl=h.count===0?0:h.count<=max*0.25?1:h.count<=max*0.5?2:h.count<=max*0.75?3:4;
    html+=`<div class="hcell l${lvl}" title="${h.ds}: ${h.count}项完成"></div>`;
    if((i+1)%7===0) html+='<br>';
  });
  html+='</div><div class="heatmap-legend"><span>少</span><span class="hcell l0"></span><span class="hcell l1"></span><span class="hcell l2"></span><span class="hcell l3"></span><span class="hcell l4"></span><span>多</span></div>';
  return html;
}

/* ============================================================
   习惯强度分 / 断签后果 / 年度热力图（P0 核心差距补齐）
   ============================================================ */
let _hmYear = new Date().getFullYear();
// 聚合：某天完成的习惯数（主习惯 history + 自定义习惯 log）
function habitChecksOn(ds){
  let n=0;
  (S.habits||[]).forEach(h=>{ if(h.history && h.history[ds]) n++; });
  (S.health.customHabits||[]).forEach(h=>{ if(h.log && h.log[ds]) n++; });
  return n;
}
// 每日首次打开时评估断签：重置 streak、强度减半、小猫掉经验
function isoWeek(d){ const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=dt.getUTCDay()||7; dt.setUTCDate(dt.getUTCDate()+4-day); const ys=new Date(Date.UTC(dt.getUTCFullYear(),0,1)); return dt.getUTCFullYear()+"-W"+Math.ceil((((dt-ys)/86400000)+1)/7); }
function daysBetween(a,b){ return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000)); }
function evaluateHabitStreaks(){
  const tdy=todayStr();
  const yd=(d=>{d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)})(new Date());
  const wk=isoWeek(new Date());
  const all=[...(S.habits||[]), ...(S.health.customHabits||[])];
  let changed=false, broken=0, petXP=0, forgiven=0;
  // 周度结算（每周切换时）
  if(S.lastWeekEval!==wk){
    all.forEach(h=>{ ensureHabit(h); if(h.freq==="weekly"){ if((h.weekCount||0)>=(h.weekTarget||3)) h.weekStreak=(h.weekStreak||0)+1; else h.weekStreak=0; h.weekCount=0; } });
    S.lastWeekEval=wk; changed=true;
  }
  // 日度评估（每天一次）
  if(S.lastHabitEval!==tdy){
    all.forEach(h=>{
      ensureHabit(h);
      if(h.freq==="weekly"){ h._atRisk=false; return; }   // 周频率不按天断签
      if(h.last && h.last!==tdy && h.last!==yd){
        if(h.grace>0 && (h.skips||0) < h.grace){
          h.skips=(h.skips||0)+1; h.strength=clamp(h.strength*0.9,0,100); forgiven++;   // 宽恕生效，保住连签
        } else {
          if(h.streak>0){ broken++; petXP+=8; }
          h.streak=0; h.skips=0; h.strength=clamp(h.strength*0.5,0,100); h._atRisk=false;
        }
      } else if(h.last===yd && h.streak>0){ h._atRisk=true; }
      else { h._atRisk=false; }
    });
    if(forgiven>0) toast(`🛡️ 宽恕生效，${forgiven} 个习惯的连签保住了~`,'good');
    if(broken>0){
      const c=S.cat;
      c.xp=Math.max(0,c.xp-petXP);
      c.mood=clamp(c.mood-5*broken,0,100);
      c.full=clamp(c.full-5*broken,0,100);
      toast(`⚠️ 断签了 ${broken} 个习惯，${c.name} 掉了 ${petXP} 经验！快补卡喵~`,'warn');
    }
    S.lastHabitEval=tdy; changed=true;
  }
  if(changed) save();
}
// 年度习惯热力图（GitHub 风格 53 周 × 7 天）
function setHmYear(y){ _hmYear=y; if(curMod==="health") R.health(); }
function renderAnnualHabitHeatmap(){
  const year=_hmYear;
  const MON=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const start=new Date(year,0,1); start.setDate(start.getDate()-start.getDay());
  const end=new Date(year,11,31);
  const totalDays=Math.round((end-start)/86400000)+1;
  const weeks=Math.ceil(totalDays/7);
  const cells=[];
  let yearTotal=0, max=1;
  for(let i=0;i<totalDays;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const inYear=d.getFullYear()===year;
    const count=inYear?habitChecksOn(ds):0;
    if(inYear){ yearTotal+=count; if(count>max)max=count; }
    cells.push({ds,count,inYear});
  }
  let cols='';
  for(let w=0;w<weeks;w++){
    let col='';
    for(let dy=0;dy<7;dy++){
      const c=cells[w*7+dy];
      if(!c){ col+='<div class="hcell empty"></div>'; continue; }
      const lvl=c.inYear?(c.count===0?0:c.count<=max*0.25?1:c.count<=max*0.5?2:c.count<=max*0.75?3:4):-1;
      const cls=lvl<0?'hcell empty':('hcell l'+lvl);
      const tip=c.inYear?(c.ds+': '+c.count+' 项完成'):'';
      col+='<div class="'+cls+'"'+(tip?' title="'+tip+'"':'')+'></div>';
    }
    cols+='<div class="heat-col">'+col+'</div>';
  }
  let monthLabels='<div class="heat-months">';
  let lastM=-1;
  for(let w=0;w<weeks;w++){
    const c=cells[w*7];
    const m=(c&&c.inYear)?new Date(c.ds).getMonth():-1;
    if(m!==-1&&m!==lastM){ monthLabels+='<span class="hm-label">'+MON[m]+'</span>'; lastM=m; }
    else monthLabels+='<span class="hm-label"></span>';
  }
  monthLabels+='</div>';
  const wdNames=['','一','','三','','五',''];
  let wd='<div class="heat-weekday">';
  for(let dy=0;dy<7;dy++) wd+='<span style="height:12px;line-height:12px">'+wdNames[dy]+'</span>';
  wd+='</div>';
  const nav='<div class="heat-nav"><button class="pxbtn small" onclick="setHmYear('+(year-1)+')">◀ '+(year-1)+'</button><b>'+year+' 年</b><button class="pxbtn small" onclick="setHmYear('+(year+1)+')">'+(year+1)+' ▶</button></div>';
  const legend='<div class="heatmap-legend"><span>少</span><span class="hcell l0"></span><span class="hcell l1"></span><span class="hcell l2"></span><span class="hcell l3"></span><span class="hcell l4"></span><span>多</span></div>';
  return '<div class="heat-year">'+nav+'<div class="heat-sum muted">今年累计 <b>'+yearTotal+'</b> 次打卡 · 最忙一天 '+max+' 次</div><div class="heat-body">'+wd+'<div class="heat-right">'+monthLabels+'<div class="heat-grid">'+cols+'</div></div></div>'+legend+'</div>';
}

function toggleCustomHabit(id){
  const h=S.health.customHabits.find(x=>x.id===id); if(!h)return; ensureHabit(h);
  const tdy=todayStr();
  if(h.log[tdy]){ delete h.log[tdy]; h.streak=Math.max(0,h.streak-1); if(h.counts)delete h.counts[tdy]; if(h.freq==="weekly"&&h.weekCount>0)h.weekCount--; h.strength=clamp(h.strength-2,0,100); }
  else {

    if(h.freq!=="weekly"){ if(h.log[yd]) h.streak++; else h.streak=1; }
    if(h.freq==="weekly") h.weekCount++;
    h.counts=h.counts||{}; h.counts[tdy]=1;
    h.strength=clamp(h.strength+(h.freq==="weekly"?3:3)+(h.freq==="weekly"?0:h.streak*0.3),0,100); h._atRisk=false;

  }

}

function inspImgHandler(input){
  const f=input.files[0]; if(!f||!f.type.startsWith('image/'))return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const max=600; let w=img.width,h=img.height;
      if(w>max){h=h*max/w;w=max;} if(h>max){w=w*max/h;h=max;}
      c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      const data=c.toDataURL('image/jpeg',0.7);
      $("#inspImgData").value=data;
      $("#inspImgPrev").innerHTML=`<img src="${data}" class="insp-img"><div style="margin-top:4px"><button class="pxbtn small" onclick="inspOCR()">🔍 识别图中文字(OCR)</button></div>`;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
  input.value='';
}

/* ===== 图片OCR（AI视觉识别，无Key降级） ===== */
async function inspOCR(){
  const img=$("#inspImgData").value;
  if(!img){ toast("先上传一张图片喵~","warn"); return; }
  if(!S.ai||!S.ai.key){ toast("OCR需要AI视觉能力，请先在设置中配置API Key（支持视觉的模型）~","warn"); return; }
  toast("🔍 正在识别图中文字…","good");
  const prov=AI_PROVIDERS[S.ai.provider]||AI_PROVIDERS.openai;
  const url=S.ai.endpoint||prov.url;
  try{
    const resp=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.ai.key},
      body:JSON.stringify({model:prov.model,max_tokens:800,messages:[{role:"user",content:[
        {type:"text",text:"请识别这张图片中的所有文字，直接输出文字内容，不要任何解释。若无文字则简要描述图片内容（30字内）。"},
        {type:"image_url",image_url:{url:img}}
      ]}]})
    });
    if(!resp.ok)throw new Error("API "+resp.status);
    const data=await resp.json();
    const txt=(data.choices[0]?.message?.content||"").trim();
    if(!txt){ toast("没有识别到文字喵~","warn"); return; }
    const ta=$("#inspTxtImg");
    ta.value=(ta.value?ta.value+"\n":"")+txt;
    toast("✅ 识别完成，已填入灵感框~","good");
  }catch(e){
    toast("识别失败："+(e.message||e)+"（当前模型可能不支持视觉，可换支持图片的模型）","warn");
  }
}

function compressImg(file,maxSize){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        let w=img.width,h=img.height;
        if(w>maxSize||h>maxSize){const r=Math.min(maxSize/w,maxSize/h);w*=r;h*=r;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.8));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderDeadlineSection(){
  const tdy=todayStr();
  const overdue=S.tasks.filter(t=>!t.done && t.date && t.date<tdy).sort((a,b)=>a.date.localeCompare(b.date));
  const dueToday=S.tasks.filter(t=>!t.done && t.date===tdy);
  const deadHtml=(overdue.length||dueToday.length)?`
    <div style="margin-top:6px">
      ${overdue.map(t=>`<div class="todo-row" style="margin-bottom:4px"><div class="cb" onclick="toggleTask('${t.id}')"></div><div class="body"><div class="ttl" style="color:var(--hp)">⏰ ${t.title}</div><div class="meta"><span class="tag" style="background:var(--hp);color:#fff">逾期 ${daysBetween(t.date,tdy)} 天</span><span>原定 ${t.date}</span></div></div></div>`).join("")}
      ${dueToday.map(t=>`<div class="todo-row" style="margin-bottom:4px"><div class="cb" onclick="toggleTask('${t.id}')"></div><div class="body"><div class="ttl">📅 ${t.title}</div><div class="meta"><span class="tag" style="background:var(--warn);color:#fff">今日到期</span><span>原定 ${t.date}</span></div></div></div>`).join("")}
    </div>` : '<div class="muted">太棒了，暂无逾期或今日到期任务~</div>';
  return `
    <div class="sub" style="margin-top:12px">⏰ 截止提醒 ${overdue.length?`<span class="tag" style="background:var(--hp);color:#fff">${overdue.length} 逾期</span>`:''} ${dueToday.length?`<span class="tag" style="background:var(--warn);color:#fff">${dueToday.length} 今日</span>`:''}</div>
    ${deadHtml}
    <button class="pxbtn small" style="margin-top:6px" onclick="App.go('task')">去处理 →</button>`;
}
function renderExcerptSection(){
  const exHtml=(S.excerpts&&S.excerpts.length)?renderExcerpts():'<div class="muted">暂无摘录，在任务/灵感中点击"摘录"即可互通~</div>';
  return `
    <div class="sub" style="margin-top:12px">🔄 摘录互通池</div>
    ${exHtml}`;
}
function renderGuildPanel(){
  const skinHtml=`<div class="skin-picker">${Object.entries(CAT_SKINS).map(([id,s])=>{
        const unlocked=S.cat.skinsUnlocked.includes(id);
        const active=S.cat.skin===id;
        return `<div class="skin-opt ${active?'active':''} ${!unlocked?'locked':''}" onclick="selectSkin('${id}')" title="${s.name} · ${s.unlock}">${s.emoji}</div>`;
      }).join("")}</div>`;
  return `
    <h3 class="sub" style="margin-top:14px">🏯 冒险者公会 · 扩展</h3>
    <div class="guild-grid">
      <div class="guild-cell">
        <div class="sub" style="margin-top:0">🏠 像素房间</div>
        ${renderRoom()}
      </div>
      <div class="guild-cell">
        <div class="sub" style="margin-top:0">🐱 小猫皮肤</div>
        ${skinHtml}
        <div class="muted" style="margin-top:4px;font-size:10px">${CAT_SKINS[S.cat.skin]?.name||'新叶喵'} · ${CAT_SKINS[S.cat.skin]?.unlock||'初始'}</div>
      </div>
    </div>`;
}
function deadlineRemind(){
  const tdy=todayStr();
  if(S.lastRemindDate===tdy) return;
  const overdue=S.tasks.filter(t=>!t.done && t.date && t.date<tdy).length;
  const dueToday=S.tasks.filter(t=>!t.done && t.date===tdy).length;
  if(overdue+dueToday>0) toast(`⏰ 截止提醒：${overdue} 个逾期 · ${dueToday} 个今日到期，别忘啦喵~`,'warn');
  S.lastRemindDate=tdy; save();
}
function renderExcerpts(){
  if(!S.excerpts||!S.excerpts.length) return '<div class="muted">暂无摘录，在任务/灵感中点击"摘录"即可互通~</div>';
  return S.excerpts.slice(-20).reverse().map(e=>`
    <div class="panel-soft" style="margin-bottom:4px;font-size:12px">
      <span class="tag">${e.from==="task"?"🗡️任务":"💡灵感"}</span> ${e.text}
      <div class="muted">${e.note||'点击添加笔记'} · <a onclick="addExcerptNote('${e.id}')" style="cursor:pointer;color:var(--accent)">编辑笔记</a></div>
    </div>`).join("");
}

/* ============================================================
   全局搜索
   ============================================================ */
function toggleSearch(){
  const existing=document.getElementById("searchOverlay");
  if(existing){ existing.remove(); return; }
  const overlay=document.createElement("div"); overlay.id="searchOverlay"; overlay.className="search-overlay show";
  overlay.innerHTML=`<div class="search-box"><input type="text" id="searchInput" placeholder="搜索任务、记账、灵感、日志、未来愿望…" autofocus oninput="doSearch()"><div class="search-results" id="searchResults"></div></div>`;
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
  setTimeout(()=>$("#searchInput")?.focus(),100);
}
function doSearch(){
  const q=$("#searchInput").value.trim().toLowerCase();
  if(!q){$("#searchResults").innerHTML="";return;}
  const results=[];
  S.tasks.forEach(t=>{if(t.title.toLowerCase().includes(q))results.push({mod:"🗡️任务",text:t.title,action:()=>{App.go("task")}});});
  S.finance.records.forEach(r=>{if((r.tag+r.note||"").toLowerCase().includes(q))results.push({mod:"💰账房",text:`${r.tag} ¥${r.amt}`,action:()=>{App.go("fin")}});});
  S.inspiration.items.forEach(i=>{if(i.t.toLowerCase().includes(q))results.push({mod:"💡灵感",text:i.t,action:()=>{App.go("insp")}});});
  S.diary.forEach(d=>{if((d.title+d.content||"").toLowerCase().includes(q))results.push({mod:"📓日志",text:d.title||d.content.slice(0,40),action:()=>{App.go("diary")}});});
  (S.bookNotes||[]).forEach(a=>{ if(((a.text||"")+(a.note||"")+(a.bookName||"")).toLowerCase().includes(q)) results.push({mod:"📖读书",text:(a.bookName?a.bookName+"：":"")+(a.note||a.text||"").slice(0,40),action:()=>{App.go("read")}}); });
  S.habits.forEach(h=>{if(h.name.toLowerCase().includes(q))results.push({mod:"❤️习惯",text:h.name,action:()=>{App.go("task")}});});
  (S.future&&S.future.items||[]).forEach(i=>{if((i.title+(i.tag||"")+(i.note||"")).toLowerCase().includes(q))results.push({mod:"🌠未来",text:i.title+(i.done?" ✅":""),action:()=>{App.go("future")}});});
  S.psych.notes.forEach(n=>{if(n.ans.toLowerCase().includes(q))results.push({mod:"🔮心法",text:n.ans.slice(0,40),action:()=>{App.go("psych")}});});
  $("#searchResults").innerHTML=results.length?results.slice(0,20).map(r=>`<div class="search-item" onclick="document.getElementById('searchOverlay').remove();${r.action.toString().replace(/^\(\)=>/,'')}"><span class="mod-tag">${r.mod}</span>${r.text}</div>`).join(""):'<div class="muted">没有找到相关结果喵~</div>';
}

/* ============================================================
   深色模式自动切换
   ============================================================ */
function toggleDarkMode(){
  const modes=["auto","light","dark"];
  const themes={light:"暖阳小屋",dark:"暗夜森林"};
  const idx=modes.indexOf(S.profile.darkMode||"auto");
  const next=modes[(idx+1)%3];
  S.profile.darkMode=next;
  const isDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
  if(next==="auto"){ S.profile.theme=isDark?"暗夜森林":"暖阳小屋"; }
  else if(next==="dark"){ S.profile.theme="暗夜森林"; }
  else { S.profile.theme="暖阳小屋"; }
  save(); render(); toast("深色模式："+({"auto":"自动","light":"浅色","dark":"深色"}[next])+"~","good");
}

/* ============================================================
   自由布局
   ============================================================ */
function applyLayoutMode(){ let mode=S.layout||"auto"; if(mode==="auto"){ const w=window.innerWidth; mode = w<640?"compact":(w>=1024?"wide":"default"); } document.body.setAttribute("data-layout",mode); }
window.addEventListener('resize',function(){ if((S.layout||"auto")==="auto") applyLayoutMode(); });
function toggleLayout(){
  const layouts=["auto","compact","wide"];
  const idx=layouts.indexOf(S.layout||"auto");
  S.layout=layouts[(idx+1)%3];
  applyLayoutMode(); save(); toast("布局："+({"auto":"自动","compact":"手机窄屏","wide":"iPad宽屏"}[S.layout]),"good");
}

/* ============================================================
   阅读器划线批注（持久化到 S.bookNotes）
   ============================================================ */
function addAnnotation(text,cfi,note){
  if(!S.bookNotes)S.bookNotes=[];
  S.bookNotes.push({id:uid(),text,cfi,note,date:todayStr(),bookId:_readingBook?.id,bookName:_readingBook?.name||""});
  save(); toast("批注已保存~","good");
}
function showAnnotations(){
  if(!_readingBook)return;
  const annots=(S.bookNotes||[]).filter(a=>a.bookId===_readingBook.id);
  if(!annots.length){ toast("暂无批注~","warn"); return; }
  const html=annots.map(a=>`<div class="annot-item"><div style="font-size:11px;color:var(--ink-dim)">${a.date}</div><div style="font-size:13px">${escapeHtml((a.text||"").slice(0,100))}</div>${a.note?`<div class="muted" style="margin-top:4px">📝 ${escapeHtml(a.note)}</div>`:""}</div>`).join("");
  openModal(html,"读书笔记 · 批注");
}
function addBookNote(){
  if(!_readingBook){ toast("请先打开一本书~","warn"); return; }
  const note=prompt("记录读书笔记：");
  if(!note)return;
  // 尝试带上当前选中文字作为摘录
  let selTxt="";
  try{ selTxt=(window.getSelection()?.toString()||"").trim().slice(0,300); }catch(e){}
  addAnnotation(selTxt||"位置标记",_readingBook.progress||"",note);
}
function openBookNotes(){
  if(!_readingBook){ toast("请先打开一本书~","warn"); return; }
  const bid=_readingBook.id;
  const annots=(S.bookNotes||[]).filter(a=>a.bookId===bid);
  const list=annots.length?annots.map(a=>`<div class="annot-item" style="border-left:3px solid var(--accent);padding:6px 8px;margin-bottom:6px;background:var(--panel2,rgba(0,0,0,.06));border-radius:4px">
    <div style="font-size:11px;color:var(--ink-dim)">${a.date}${a.cfi?` · 位置 ${String(a.cfi).slice(0,18)}`:""} <button class="del" style="float:right" onclick="delBookNote('${a.id}')">✕</button></div>
    ${a.text&&a.text!=="位置标记"?`<div style="font-size:12px;font-style:italic;opacity:.85;margin-top:2px">「${escapeHtml(a.text.slice(0,150))}」</div>`:""}
    ${a.note?`<div style="font-size:13px;margin-top:3px">📝 ${escapeHtml(a.note)}</div>`:""}
  </div>`).join(""):'<div class="muted">这本书还没有笔记，选中文字后点「✍️ 划线批注」试试~</div>';
  openModal(`<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
      <button class="pxbtn small primary" onclick="App.closeModal();addHighlightNote()">✍️ 划线批注</button>
      <button class="pxbtn small" onclick="App.closeModal();addBookNote();setTimeout(openBookNotes,300)">📝 位置笔记</button>
      ${annots.length?`<button class="pxbtn small" onclick="exportBookNotes('${bid}')">⬇ 导出笔记</button>`:""}
    </div><div style="max-height:50vh;overflow:auto">${list}</div>`,"📖 "+(_readingBook.name||"读书笔记")+"（"+annots.length+"条）");
}
function addHighlightNote(){
  if(!_readingBook){ toast("请先打开一本书~","warn"); return; }
  let selTxt="";
  try{ selTxt=(window.getSelection()?.toString()||"").trim(); }catch(e){}
  // epub 的选区在 iframe 内
  if(!selTxt && _epubBook){ try{ document.querySelectorAll("#epubArea iframe").forEach(f=>{ const s=f.contentWindow?.getSelection()?.toString(); if(s&&s.trim())selTxt=s.trim(); }); }catch(e){} }
  if(!selTxt){ toast("先用鼠标选中一段文字，再点划线批注喵~","warn"); return; }
  const note=prompt("为这段划线写点想法（可留空）：\n\n「"+selTxt.slice(0,80)+"…」")||"";
  addAnnotation(selTxt.slice(0,300),_readingBook.progress||"",note);
  setTimeout(openBookNotes,300);
}
function delBookNote(id){
  S.bookNotes=(S.bookNotes||[]).filter(a=>a.id!==id);
  save(); App.closeModal(); openBookNotes();
}
function exportBookNotes(bid){
  const annots=(S.bookNotes||[]).filter(a=>a.bookId===bid);
  if(!annots.length){ toast("暂无笔记可导出~","warn"); return; }
  const name=annots[0].bookName||"读书笔记";
  const txt=`# ${name} · 读书笔记\n导出时间：${todayStr()}\n共 ${annots.length} 条\n\n`+annots.map((a,i)=>`## ${i+1}. ${a.date}\n${a.text&&a.text!=="位置标记"?"> "+a.text+"\n":""}${a.note?"笔记："+a.note+"\n":""}`).join("\n");
  download(name.replace(/\.[^.]+$/,"")+"_笔记_"+todayStr()+".md",txt);
  toast("笔记已导出~","good");
}
function saveProgress(){
  if(!_readingBook)return;
  _readingBook.progress=_txtPage||1;
  save();
}

(function initShortcuts(){
  window.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(document.activeElement.tagName==="INPUT"||document.activeElement.tagName==="TEXTAREA") return;
    if(e.key==="k"){ e.preventDefault(); toggleSearch(); }
    if(e.key==="n"){ e.preventDefault(); App.go("task"); setTimeout(()=>$("#newTask")?.focus(),200); }
    if(e.key==="r"){ e.preventDefault(); App.go("report"); }
    if(e.key==="d"){ e.preventDefault(); App.go("dash"); }
  });
})();
